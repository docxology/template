<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Template 5.0.1: the release note and the tag agree about which commit is the release</title><desc id="description">The v5.0.0 tag is not moved and its wrong sentence stays with it. The corrected note, the fail-closed tag-commit check and the 5.0.1 surfaces ship together. The diagram describes the contract rather than completed acceptance.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#829ab1"/></marker><style>text {font-family:Arial,Helvetica,sans-serif}.heading {font-size:23px;font-weight:700;fill:#102a43}.body {font-size:18px;fill:#334e68}</style></defs>
<rect width="1600" height="900" fill="#eef3f8"/>
<text x="72" y="98" font-size="52" font-weight="700" fill="#102a43">template/ 5.0.1</text>
<text x="74" y="146" font-size="25" fill="#334e68">A corrected note. A tag that does not move. A check that refuses the defect.</text>
<rect x="1250" y="60" width="278" height="82" rx="12" fill="#e0f2ee" stroke="#7da99b"/><text x="1389" y="94" font-size="17" font-weight="700" text-anchor="middle" fill="#245c4b">PROVENANCE</text><text x="1389" y="122" font-size="18" text-anchor="middle" fill="#245c4b">Note and tag must agree</text>
<g id="stage-1"><rect x="72" y="228" width="272" height="312" rx="15" fill="#fff" stroke="#cfdae5" stroke-width="2"/><rect x="96" y="252" width="42" height="30" rx="8" fill="#e2eaf3"/><text x="117" y="273" font-size="16" font-weight="700" text-anchor="middle" fill="#334e68">01</text><text x="96" y="326" class="heading">Release identity</text>
<text x="96" y="376" class="body">Tag resolves in Git</text>
<text x="96" y="412" class="body">Note names that commit</text>
<text x="96" y="448" class="body">The claim is compared</text>
<text x="96" y="484" class="body">Mismatch fails closed</text>
</g>
<path d="M 348 388 H 362" fill="none" stroke="#829ab1" stroke-width="2" marker-end="url(#arrow)"/>
<g id="stage-2"><rect x="368" y="228" width="272" height="312" rx="15" fill="#fff" stroke="#cfdae5" stroke-width="2"/><rect x="392" y="252" width="42" height="30" rx="8" fill="#e2eaf3"/><text x="413" y="273" font-size="16" font-weight="700" text-anchor="middle" fill="#334e68">02</text><text x="392" y="326" class="heading">Correction</text>
<text x="392" y="376" class="body">5.0.0 note corrected</text>
<text x="392" y="412" class="body">Tag left where it is</text>
<text x="392" y="448" class="body">Wrong bytes retained</text>
<text x="392" y="484" class="body">Supersession stated</text>
</g>
<path d="M 644 388 H 658" fill="none" stroke="#829ab1" stroke-width="2" marker-end="url(#arrow)"/>
<g id="stage-3"><rect x="664" y="228" width="272" height="312" rx="15" fill="#fff" stroke="#cfdae5" stroke-width="2"/><rect x="688" y="252" width="42" height="30" rx="8" fill="#e2eaf3"/><text x="709" y="273" font-size="16" font-weight="700" text-anchor="middle" fill="#334e68">03</text><text x="688" y="326" class="heading">New check</text>
<text x="688" y="376" class="body">First named commit compared</text>
<text x="688" y="412" class="body">Intermediate merges stay legal</text>
<text x="688" y="448" class="body">Unresolvable tags skipped</text>
<text x="688" y="484" class="body">Negative control recorded</text>
</g>
<path d="M 940 388 H 954" fill="none" stroke="#829ab1" stroke-width="2" marker-end="url(#arrow)"/>
<g id="stage-4"><rect x="960" y="228" width="272" height="312" rx="15" fill="#fff" stroke="#cfdae5" stroke-width="2"/><rect x="984" y="252" width="42" height="30" rx="8" fill="#e2eaf3"/><text x="1005" y="273" font-size="16" font-weight="700" text-anchor="middle" fill="#334e68">04</text><text x="984" y="326" class="heading">Surfaces</text>
<text x="984" y="376" class="body">Root binding at 5.0.1</text>
<text x="984" y="412" class="body">25 exemplar bindings</text>
<text x="984" y="448" class="body">Copies and receipts moved</text>
<text x="984" y="484" class="body">Contract passes at the tag</text>
</g>
<path d="M 1236 388 H 1250" fill="none" stroke="#829ab1" stroke-width="2" marker-end="url(#arrow)"/>
<g id="stage-5"><rect x="1256" y="228" width="272" height="312" rx="15" fill="#fff" stroke="#cfdae5" stroke-width="2"/><rect x="1280" y="252" width="42" height="30" rx="8" fill="#e2eaf3"/><text x="1301" y="273" font-size="16" font-weight="700" text-anchor="middle" fill="#334e68">05</text><text x="1280" y="326" class="heading">Unchanged</text>
<text x="1280" y="376" class="body">No pipeline behavior</text>
<text x="1280" y="412" class="body">No renderer or schema</text>
<text x="1280" y="448" class="body">No publication path</text>
<text x="1280" y="484" class="body">Same instruments, truer record</text>
</g>
<rect x="72" y="602" width="1456" height="148" rx="15" fill="#102a43"/>
<text x="104" y="652" font-size="29" font-weight="700" fill="#fff">One corrected claim: the release note and the tag name the same commit</text>
<text x="104" y="697" font-size="23" fill="#d8e5f1">Version identity  ·  note-to-tag binding  ·  immutable tags  ·  recorded negative control</text>
<text x="74" y="813" font-size="19" fill="#526d82">Provenance overview. The tag keeps the history it was cut with; the note and the check that follows it are corrected here.</text>
<text x="74" y="847" font-size="17" fill="#526d82">This diagram is not a test receipt, scientific result, or certification.</text>
</svg>
