name: Run tracked guards
description: >-
  Reject tracked non-public resources, tracked high-confidence secrets, and
  tracked generated artifacts, in the documented order.
runs:
  using: composite
  steps:
    - name: Guard public data and secrets
      shell: bash
      run: |
        set -euo pipefail
        # Sequential by design: each guard owns its own named failure and reads
        # the checked-out index before the next guard reasons about the tree.
        uv run python scripts/audit/check_tracked_all.py
        uv run python scripts/audit/check_tracked_secrets.py
        uv run python scripts/audit/check_tracked_generated_artifacts.py
