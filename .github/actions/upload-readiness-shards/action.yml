name: Upload exact bounded readiness transport
description: Upload a checked primary index and each Source-declared bounded shard; no acceptance is inferred from the index.
inputs:
  repo-root:
    description: Actual producer mirror containing the retained logical bytes.
    required: true
  directory:
    description: Exact confined transport directory.
    required: true
  kind:
    description: Source-declared native or candidate transport target.
    required: true
runs:
  using: composite
  steps:
    - name: Check exact bounded transport bytes and membership
      id: plan
      shell: bash
      env:
        TRANSPORT_ROOT: ${{ inputs.repo-root }}
        TRANSPORT_DIRECTORY: ${{ inputs.directory }}
        TRANSPORT_KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        .venv/bin/python -m infrastructure.reporting.native_workflow_transport \
          --repo-root "$TRANSPORT_ROOT" --directory "$TRANSPORT_DIRECTORY" --kind "$TRANSPORT_KIND" \
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --revision "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
    - name: Upload exact primary index
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.plan.outputs.primary_name }}
        path: ${{ inputs.directory }}/index/${{ steps.plan.outputs.index_filename }}
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Upload exact bounded shard 0000
      if: fromJSON(steps.plan.outputs.shard_count) > 0
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.plan.outputs.shard_prefix }}0000
        path: ${{ inputs.directory }}/shard-0000/${{ steps.plan.outputs.member_prefix }}-shard-0000.zip
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Upload exact bounded shard 0001
      if: fromJSON(steps.plan.outputs.shard_count) > 1
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
