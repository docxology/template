name: Prepare genuine acceptance document tools
description: Prepare official pinned Pandoc, cross-reference and JuliaMono assets plus native readers on the owned hosted runner.
inputs:
  mode:
    description: Native document prerequisites or converter binaries only; full acceptance uses native.
    required: false
    default: native
  python-executable:
    description: Already locked Python for the native LaTeX package validator; does not sync or acquire Python.
    required: false
    default: .venv/bin/python
runs:
  using: composite
  steps:
    - name: Validate document preparation mode
      id: preparation-mode
      shell: bash
      env:
        PREPARATION_MODE: ${{ inputs.mode }}
        PREPARED_PYTHON: ${{ inputs.python-executable }}
      run: |
        set -euo pipefail
        case "$PREPARATION_MODE" in
          native|converter) echo "mode=$PREPARATION_MODE" >> "$GITHUB_OUTPUT" ;;
          *) echo "document preparation mode must be native or converter" >&2; exit 1 ;;
        esac
        if [ "$PREPARATION_MODE" = native ]; then
          if [ ! -f "$PREPARED_PYTHON" ] || [ ! -x "$PREPARED_PYTHON" ]; then
            echo "native document preparation requires an already locked Python executable" >&2
            exit 1
          fi
        fi
    - name: Restore exact official document archives
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/template-acceptance-document-archives
        key: acceptance-document-archives-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.preparation-mode.outputs.mode }}-${{ hashFiles('.github/actions/setup-acceptance-documents/action.yml') }}
    - name: Prepare exact compatible Pandoc and cross-reference binaries
      shell: bash
      run: |
        set -euo pipefail
        archives="$RUNNER_TEMP/template-acceptance-document-archives"
        mkdir -p "$archives"
        destination=$(mktemp -d "$RUNNER_TEMP/template-document-tools.XXXXXX")
        if [ "$RUNNER_OS" = Linux ]; then
          pandoc_asset=pandoc-3.11-linux-amd64.tar.gz
          pandoc_directory=pandoc-3.11
          pandoc_sha=37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6
          pandoc_size=34940580
          crossref_asset=pandoc-crossref-Linux-X64.tar.xz
          crossref_sha=7f8b7c5c91233db2dcb1145fa580a9ee8343695589bdb0ece8661490bc12a644
          crossref_size=7504388
        elif [ "$RUNNER_ARCH" = ARM64 ]; then
          pandoc_asset=pandoc-3.11-arm64-macOS.zip
          pandoc_directory=pandoc-3.11-arm64
          pandoc_sha=15806bedf9517bfead72e88fe6a6696635c3691efbb6e152173440e9c5bb50b4
          pandoc_size=41832712
          crossref_asset=pandoc-crossref-macOS-ARM64.tar.xz
          crossref_sha=ce3571bd8bc335fa26bea46b390381a61bdf464bbf83fe4c7277160ba124a6fa
          crossref_size=18539672
        else
          pandoc_asset=pandoc-3.11-x86_64-macOS.zip
          pandoc_directory=pandoc-3.11-x86_64
          pandoc_sha=3b1c1b57f160112c821d02f23d946ede8b7f57a6ccf4632a25a512d334a9291f
          pandoc_size=26145603
          crossref_asset=pandoc-crossref-macOS-X64.tar.xz
          crossref_sha=03e84e3fd03beb2b36ac2ed5bc2608825d759f33e657bec05af8be8b16ca7690
          crossref_size=4579604
        fi
        test ! -L "$archives/$pandoc_asset"
        if [ ! -e "$archives/$pandoc_asset" ]; then
          curl --fail --location --retry 2 --max-time 180 --output "$archives/$pandoc_asset" "https://github.com/jgm/pandoc/releases/download/3.11/$pandoc_asset"
        fi
        test -f "$archives/$pandoc_asset"
        if [ "$(wc -c < "$archives/$pandoc_asset" | tr -d ' ')" != "$pandoc_size" ]; then
          echo "document archive size mismatch: $pandoc_asset" >&2
          exit 1
        fi
        echo "$pandoc_sha  $archives/$pandoc_asset" | shasum -a 256 --check --status || {
          echo "document archive SHA-256 mismatch: $pandoc_asset" >&2
          exit 1
        }
        test ! -L "$archives/$crossref_asset"
        if [ ! -e "$archives/$crossref_asset" ]; then
          curl --fail --location --retry 2 --max-time 180 --output "$archives/$crossref_asset" "https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.25a/$crossref_asset"
        fi
        test -f "$archives/$crossref_asset"
        if [ "$(wc -c < "$archives/$crossref_asset" | tr -d ' ')" != "$crossref_size" ]; then
          echo "document archive size mismatch: $crossref_asset" >&2
          exit 1
        fi
        echo "$crossref_sha  $archives/$crossref_asset" | shasum -a 256 --check --status || {
          echo "document archive SHA-256 mismatch: $crossref_asset" >&2
          exit 1
        }
        if [ "$RUNNER_OS" = Linux ]; then
          tar -xzf "$archives/$pandoc_asset" -C "$destination"
        else
          unzip -q "$archives/$pandoc_asset" -d "$destination"
        fi
        tar -xJf "$archives/$crossref_asset" -C "$destination"
        echo "$destination/$pandoc_directory/bin" >> "$GITHUB_PATH"
        echo "$destination" >> "$GITHUB_PATH"
        "$destination/$pandoc_directory/bin/pandoc" --version
        "$destination/pandoc-crossref" --version
    - name: Prepare native document prerequisites
      if: steps.preparation-mode.outputs.mode == 'native'
      shell: bash
      env:
        PREPARED_PYTHON: ${{ inputs.python-executable }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = Linux ]; then
          # The runner also exposes a development Chromium snapshot. Native
          # observations need the installed Google Chrome runtime and sandbox.
          chrome=/opt/google/chrome/chrome
          if [ ! -f "$chrome" ] || [ ! -x "$chrome" ] || [ -L "$chrome" ] || [ ! -f /opt/google/chrome/resources.pak ]; then
            echo "native document preparation requires the installed Google Chrome runtime" >&2
            exit 1
          fi
          "$chrome" --version
          echo "CHROME_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils zbar-tools texlive-luatex texlive-science \
            texlive-xetex texlive-latex-extra texlive-bibtex-extra \
            texlive-fonts-recommended texlive-latex-recommended lmodern fonts-dejavu
        else
          brew install poppler zbar
          export PATH="/Library/TeX/texbin:$PATH"
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          if [ ! -x /Library/TeX/texbin/xelatex ]; then
            brew install --cask basictex
          fi
          # Keep self-update and all package installs on one HTTPS CTAN mirror.
          # The redirector can select mirrors with different tlmgr revisions.
          sudo /Library/TeX/texbin/tlmgr option repository https://ctan.math.illinois.edu/systems/texlive/tlnet
          sudo /Library/TeX/texbin/tlmgr update --self
        fi
        # The prior step supplies the exact pinned Pandoc on PATH. The full
        # Linux package union prevents a second TeX installation; macOS still
        # provisions BasicTeX and audits the actual LaTeX package inventory.
        bash scripts/shell/setup-system-deps.sh --prepared-python "$PREPARED_PYTHON"
        if [ "$RUNNER_OS" = macOS ]; then
          sudo /Library/TeX/texbin/tlmgr install fontsize soul algorithm2e placeins ifoddpage relsize
        fi
        pdftoppm -v
        pdffonts -v
        xelatex --version
        bibtex --version
        pandoc --version
        pandoc-crossref --version
    - name: Prepare exact JuliaMono family
      if: steps.preparation-mode.outputs.mode == 'native'
      shell: bash
      run: |
        set -euo pipefail
        archives="$RUNNER_TEMP/template-acceptance-document-archives"
        archive="$archives/JuliaMono-ttf.tar.gz"
        test ! -L "$archive"
        if [ ! -e "$archive" ]; then
          curl --fail --location --retry 2 --max-time 180 --output "$archive" https://github.com/cormullion/juliamono/releases/download/v0.63.2/JuliaMono-ttf.tar.gz
        fi
        test -f "$archive"
        if [ "$(wc -c < "$archive" | tr -d ' ')" != 21847069 ]; then
          echo "document archive size mismatch: JuliaMono-ttf.tar.gz" >&2
          exit 1
        fi
        echo "be6517295198ec5c92bdbaad42f4f6f8d83f921d80512b79f54fe036add95c0c  $archive" | shasum -a 256 --check --status || {
          echo "document archive SHA-256 mismatch: JuliaMono-ttf.tar.gz" >&2
          exit 1
        }
        if [ "$RUNNER_OS" = Linux ]; then
          fonts="$HOME/.local/share/fonts/template-acceptance-juliamono"
        else
          fonts="$HOME/Library/Fonts/template-acceptance-juliamono"
        fi
        mkdir -p "$(dirname "$fonts")"
        mkdir "$fonts"
        tar -xzf "$archive" -C "$fonts"
        if [ "$RUNNER_OS" = Linux ]; then fc-cache -f "$fonts"; fi
        echo "TTFONTS=$fonts//:" >> "$GITHUB_ENV"
