name: Prepare genuine acceptance document tools
description: Prepare Source-pinned dynamic Linux builds or exact official macOS document archives, JuliaMono and native readers on the owned hosted runner.
inputs:
  mode:
    description: Native document prerequisites or converter binaries only; full acceptance uses native.
    required: false
    default: native
  python-executable:
    description: Already locked Python for Source provider preparation, the Linux mirror guard and native LaTeX validator; does not sync or acquire Python.
    required: false
    default: .venv/bin/python
runs:
  using: composite
  steps:
    - name: Validate document preparation mode
      id: preparation-mode
      shell: bash
      env:
        PREPARATION_MODE: ${{ inputs.mode }}
        PREPARED_PYTHON: ${{ inputs.python-executable }}
      run: |
        set -euo pipefail
        case "$PREPARATION_MODE" in
          native|converter) echo "mode=$PREPARATION_MODE" >> "$GITHUB_OUTPUT" ;;
          *) echo "document preparation mode must be native or converter" >&2; exit 1 ;;
        esac
        if [ "$PREPARATION_MODE" = native ] || [ "${RUNNER_OS:-}" = Linux ]; then
          if [ ! -f "$PREPARED_PYTHON" ] || [ ! -x "$PREPARED_PYTHON" ]; then
            echo "native/Linux document preparation requires an already locked Python executable" >&2
            exit 1
          fi
        fi
    - name: Restore exact document provider archives
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/template-acceptance-document-archives
        key: acceptance-document-archives-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.preparation-mode.outputs.mode }}-${{ hashFiles('infrastructure/config/native-document-providers.json', 'infrastructure/reporting/native_document_*.py', '.github/actions/setup-acceptance-documents/action.yml', '.github/actions/setup-acceptance-documents/ubuntu_apt_mirrors.py') }}
    - name: Prepare reviewed Linux acquisition and Nix
      if: runner.os == 'Linux'
      shell: bash
      env:
        PREPARED_PYTHON: ${{ inputs.python-executable }}
      run: |
        set -euo pipefail
        [ "$RUNNER_ARCH" = X64 ]
        if [ "$RUNNER_OS" = Linux ]; then
          if [ ! -f "$PREPARED_PYTHON" ] || [ ! -x "$PREPARED_PYTHON" ]; then
            echo "Ubuntu mirror preparation requires an already locked Python executable" >&2
            exit 1
          fi
          sudo -n "$PREPARED_PYTHON" -I -B - "$GITHUB_ACTION_PATH/ubuntu_apt_mirrors.py" <<'PYTHON'
        import hashlib
        import json
        import os
        from pathlib import Path
        import runpy
        import stat
        import sys
        import tempfile


        def identity(info):
            return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid,
                    info.st_nlink, info.st_size, info.st_mtime_ns, info.st_ctime_ns)


        def owned_bytes(path, limit):
            before = path.lstat()
            if (not stat.S_ISREG(before.st_mode) or before.st_uid != 0
                    or before.st_nlink != 1 or before.st_mode & 0o022):
                raise SystemExit(f"Expected an owned regular APT file: {path}")
            with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), "rb") as handle:
                data = handle.read(limit + 1)
                if (len(data) > limit or identity(os.fstat(handle.fileno())) != identity(before)
                        or identity(path.lstat()) != identity(before)):
                    raise SystemExit(f"APT file changed or exceeded its bound: {path}")
            return before, data


        mirror = Path("/etc/apt/apt-mirrors.txt")
        source = Path("/etc/apt/sources.list.d/ubuntu.sources")
        mirror_policy = runpy.run_path(sys.argv[1])
        mirror_limit = mirror_policy["MAX_MIRROR_BYTES"]
        before, current = owned_bytes(mirror, mirror_limit)
        try:
            preferred = mirror_policy["prefer_primary_archive"](current)
        except ValueError as error:
            raise SystemExit(str(error)) from None
        source_before, source_data = owned_bytes(source, 65536)
        active = False
        fields = {}
        for line in [*source_data.decode("utf-8").splitlines(), ""]:
            if line.lstrip().startswith("#"):
                continue
            if line.strip():
                key, separator, value = line.partition(":")
                key = key.lower()
                if line[0].isspace() or not separator or key in fields:
                    raise SystemExit("Refusing an unknown Ubuntu source stanza")
                fields[key] = value.strip()
            else:
                if fields.get("enabled", "yes") == "yes":
                    if fields.get("uris") == "mirror+file:/etc/apt/apt-mirrors.txt":
                        suites = set(fields.get("suites", "").split())
                        if ("deb" not in fields.get("types", "").split() or not suites
                                or not suites <= {"noble", "noble-updates", "noble-backports", "noble-security"}
                                or fields.get("signed-by") != "/usr/share/keyrings/ubuntu-archive-keyring.gpg"):
                            raise SystemExit("Refusing an unknown Ubuntu mirror-list source")
                        active = True
                fields = {}
        if not active:
            raise SystemExit("No active signed Ubuntu source uses the expected mirror list")
        print(json.dumps({"apt_mirrors_before": current.decode(),
                          "sha256": hashlib.sha256(current).hexdigest(),
                          "ubuntu_sources_sha256": hashlib.sha256(source_data).hexdigest()}), flush=True)
        if current != preferred:
            descriptor, temporary = tempfile.mkstemp(prefix=".template-apt-mirrors-", dir=mirror.parent)
            try:
                with os.fdopen(descriptor, "wb") as handle:
                    os.fchown(handle.fileno(), before.st_uid, before.st_gid)
                    os.fchmod(handle.fileno(), stat.S_IMODE(before.st_mode))
                    handle.write(preferred)
                    handle.flush()
                    os.fsync(handle.fileno())
                source_now, source_current = owned_bytes(source, 65536)
                if (identity(mirror.lstat()) != identity(before)
                        or identity(source_now) != identity(source_before) or source_current != source_data):
                    raise SystemExit("APT configuration changed before the priority update")
                os.replace(temporary, mirror)
            finally:
                if os.path.exists(temporary):
                    os.unlink(temporary)
        after, actual = owned_bytes(mirror, mirror_limit)
        if (actual != preferred or after.st_uid != before.st_uid or after.st_gid != before.st_gid
                or stat.S_IMODE(after.st_mode) != stat.S_IMODE(before.st_mode)):
            raise SystemExit("Ubuntu mirror-priority readback failed")
        print(json.dumps({"apt_mirrors_after": actual.decode(),
                          "sha256": hashlib.sha256(actual).hexdigest(),
                          "already_preferred": current == preferred}), flush=True)
        PYTHON
        fi
        if ! command -v nix >/dev/null 2>&1; then
          # Signed Noble packages supply the client and isolated build users;
          # never fetch an unpinned remote installer or select a host GHC.
          sudo -n apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo -n apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends nix-bin nix-setup-systemd
          sudo -n nix-store --init
        fi
        nix --version
    - name: Prepare exact compatible Pandoc and cross-reference binaries
      shell: bash
      env:
        PREPARED_PYTHON: ${{ inputs.python-executable }}
        PREPARATION_MODE: ${{ steps.preparation-mode.outputs.mode }}
      run: |
        set -euo pipefail
        preparation_python="$PREPARED_PYTHON"
        if [ ! -f "$preparation_python" ] || [ ! -x "$preparation_python" ]; then
          # Only converter-only macOS may use its already installed stdlib
          # interpreter. Native and all Linux callers require locked Python.
          [ "$RUNNER_OS" = macOS ] && [ "$PREPARATION_MODE" = converter ]
          preparation_python=$(command -v python3)
        fi
        archives="$RUNNER_TEMP/template-acceptance-document-archives"
        preparation=$(mktemp -d "$RUNNER_TEMP/template-document-preparation.XXXXXX")
        destination="$preparation/bin"
        arguments=(--source-root "$GITHUB_WORKSPACE" --archives "$archives" --destination "$destination")
        if [ "$RUNNER_OS" = Linux ]; then
          arguments+=(--nix-executable "$(command -v nix)" --nix-sudo)
        fi
        "$preparation_python" -I -B -c \
          'import runpy, sys; sys.path.insert(0, sys.argv.pop(1)); runpy.run_module("infrastructure.reporting.native_document_preparation", run_name="__main__")' \
          "$GITHUB_WORKSPACE" "${arguments[@]}"
        echo "$destination" >> "$GITHUB_PATH"
        echo "TEMPLATE_DOCUMENT_PROVIDER_PROVENANCE=$destination/document-provider-provenance.json" >> "$GITHUB_ENV"
    - name: Prepare the frozen tagging-capable Linux TeX distribution
      if: steps.preparation-mode.outputs.mode == 'native' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        [ "$RUNNER_ARCH" = X64 ]
        repository=https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2025/tlnet-final
        archives="$RUNNER_TEMP/template-acceptance-document-archives"
        installer="$archives/install-tl-2025-final.tar.gz"
        database="$archives/texlive-2025-final.tlpdb.xz"
        for archive in "$installer" "$database"; do test ! -L "$archive"; done
        if [ ! -e "$installer" ]; then
          curl --fail --location --retry 2 --max-time 180 --output "$installer" "$repository/install-tl-unx.tar.gz"
        fi
        if [ ! -e "$database" ]; then
          curl --fail --location --retry 2 --max-time 180 --output "$database" "$repository/tlpkg/texlive.tlpdb.xz"
        fi
        [ "$(wc -c < "$installer" | tr -d ' ')" = 5866884 ]
        [ "$(wc -c < "$database" | tr -d ' ')" = 2704836 ]
        echo "311df9f1477fd90c520159d1feddc2d6270f010d8349d1f6bdb9461a93b48a5c  $installer" | shasum -a 256 --check --status
        echo "56df038e9070a3d587eeceb5def3f154b2cacccef36d4295bb49e0618977c34a  $database" | shasum -a 256 --check --status
        # One frozen repository supplies both the engine and its complete package closure.
        # Do not transplant current LaTeX packages into Ubuntu's TeX Live 2023.
        destination=/usr/local/share/template-texlive-2025-final
        test ! -e "$destination"
        test ! -L "$destination"
        preparation=$(mktemp -d "$RUNNER_TEMP/template-texlive-preparation.XXXXXX")
        tar -xzf "$installer" -C "$preparation"
        cat > "$preparation/install.profile" <<PROFILE
        selected_scheme scheme-custom
        TEXDIR $destination
        TEXMFLOCAL $destination/texmf-local
        TEXMFSYSCONFIG $destination/texmf-config
        TEXMFSYSVAR $destination/texmf-var
        binary_x86_64-linux 1
        collection-basic 1
        collection-latex 1
        collection-latexrecommended 1
        collection-latexextra 1
        collection-luatex 1
        collection-xetex 1
        collection-bibtexextra 1
        collection-mathscience 1
        collection-fontsrecommended 1
        collection-plaingeneric 1
        collection-langenglish 1
        instopt_adjustpath 0
        tlpdbopt_install_docfiles 0
        tlpdbopt_install_srcfiles 0
        PROFILE
        # A cold Linux census reached only 1960 of 3059 pinned packages in 20 minutes.
        sudo timeout --signal=TERM --kill-after=30 2400s \
          "$preparation/install-tl-20260301/install-tl" --no-interaction --verify-downloads \
          --repository "$repository" --profile "$preparation/install.profile"
        # Refuse repository drift even after a completed disposable installation.
        curl --fail --location --max-time 180 --output "$preparation/closing.tlpdb.xz" "$repository/tlpkg/texlive.tlpdb.xz"
        echo "56df038e9070a3d587eeceb5def3f154b2cacccef36d4295bb49e0618977c34a  $preparation/closing.tlpdb.xz" | shasum -a 256 --check --status
        export PATH="$destination/bin/x86_64-linux:$PATH"
        echo "$destination/bin/x86_64-linux" >> "$GITHUB_PATH"
        lualatex --version
        xelatex --version
        tlmgr --version
        tlmgr option repository
    - name: Prepare native document prerequisites
      if: steps.preparation-mode.outputs.mode == 'native'
      shell: bash
      env:
        PREPARED_PYTHON: ${{ inputs.python-executable }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = Linux ]; then
          # The runner also exposes a development Chromium snapshot. Native
          # observations need the installed Google Chrome runtime and sandbox.
          chrome=/opt/google/chrome/chrome
          if [ ! -f "$chrome" ] || [ ! -x "$chrome" ] || [ -L "$chrome" ] || [ ! -f /opt/google/chrome/resources.pak ]; then
            echo "native document preparation requires the installed Google Chrome runtime" >&2
            exit 1
          fi
          "$chrome" --version
          echo "CHROME_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends poppler-utils zbar-tools fonts-dejavu
        else
          brew install poppler zbar
          export PATH="/Library/TeX/texbin:$PATH"
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          if [ ! -x /Library/TeX/texbin/xelatex ]; then
            brew install --cask basictex
          fi
          # Keep self-update and all package installs on one HTTPS CTAN mirror.
          # The redirector can select mirrors with different tlmgr revisions.
          sudo /Library/TeX/texbin/tlmgr option repository https://ctan.math.illinois.edu/systems/texlive/tlnet
          sudo /Library/TeX/texbin/tlmgr update --self
        fi
        # The prior step supplies the exact pinned Pandoc on PATH. The full
        # Linux upstream tree supplies one coherent TeX package union; macOS
        # provisions BasicTeX and audits the actual LaTeX package inventory.
        bash scripts/shell/setup-system-deps.sh --prepared-python "$PREPARED_PYTHON"
        if [ "$RUNNER_OS" = macOS ]; then
          sudo /Library/TeX/texbin/tlmgr install fontsize soul algorithm2e placeins ifoddpage relsize seqsplit
        fi
        pdftoppm -v
        pdffonts -v
        xelatex --version
        soul_provider=$(kpsewhich soul.sty)
        test -f "$soul_provider"
        printf 'soul.sty provider: %s\n' "$soul_provider"
        shasum -a 256 "$soul_provider"
        bibtex --version
        pandoc --version
        pandoc-crossref --version
    - name: Prepare exact JuliaMono family
      if: steps.preparation-mode.outputs.mode == 'native'
      shell: bash
      run: |
        set -euo pipefail
        archives="$RUNNER_TEMP/template-acceptance-document-archives"
        archive="$archives/JuliaMono-ttf.tar.gz"
        test ! -L "$archive"
        if [ ! -e "$archive" ]; then
          curl --fail --location --retry 2 --max-time 180 --output "$archive" https://github.com/cormullion/juliamono/releases/download/v0.63.2/JuliaMono-ttf.tar.gz
        fi
        test -f "$archive"
        if [ "$(wc -c < "$archive" | tr -d ' ')" != 21847069 ]; then
          echo "document archive size mismatch: JuliaMono-ttf.tar.gz" >&2
          exit 1
        fi
        echo "be6517295198ec5c92bdbaad42f4f6f8d83f921d80512b79f54fe036add95c0c  $archive" | shasum -a 256 --check --status || {
          echo "document archive SHA-256 mismatch: JuliaMono-ttf.tar.gz" >&2
          exit 1
        }
        if [ "$RUNNER_OS" = Linux ]; then
          # The payload account has its own HOME. Register the verified family
          # in the disposable runner's system font scope before Source custody.
          fonts=/usr/local/share/fonts/template-acceptance-juliamono
          test ! -e "$fonts"
          sudo install -d -m 755 "$fonts"
          sudo tar -xzf "$archive" -C "$fonts"
          sudo fc-cache -f "$fonts"
          font_probe_home=$(mktemp -d "$RUNNER_TEMP/template-font-probe.XXXXXX")
          HOME="$font_probe_home" fc-match --format '%{family}\n' JuliaMono | grep -Fx JuliaMono
        else
          fonts="$HOME/Library/Fonts/template-acceptance-juliamono"
          mkdir -p "$(dirname "$fonts")"
          mkdir "$fonts"
          tar -xzf "$archive" -C "$fonts"
        fi
        echo "TTFONTS=$fonts//:" >> "$GITHUB_ENV"
    - name: Record actual native TeX providers
      if: steps.preparation-mode.outputs.mode == 'native'
      shell: bash
      env:
        PREPARED_PYTHON: ${{ inputs.python-executable }}
      run: |
        set -euo pipefail
        "$PREPARED_PYTHON" -I -B - <<'PYTHON'
        import hashlib, json, os, shutil, subprocess
        from pathlib import Path
        tools = {}
        for name in ("lualatex", "xelatex", "kpsewhich", "bibtex", "pandoc", "pandoc-crossref"):
            found = shutil.which(name)
            assert found, f"missing prepared tool: {name}"
            path = Path(found).resolve(strict=True)
            result = subprocess.run([found, "--version"], stdin=subprocess.DEVNULL, capture_output=True, check=True, timeout=15)
            tools[name] = {"selected_path": found, "resolved_path": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "version_stdout": result.stdout.decode(), "version_stderr": result.stderr.decode()}
        providers = {}
        for name in ("latex.ltx", "tagpdf.sty", "documentmetadata-support.ltx"):
            result = subprocess.run(["kpsewhich", name], stdin=subprocess.DEVNULL, capture_output=True, check=True, timeout=15)
            path = Path(result.stdout.decode().strip()).resolve(strict=True)
            assert path.is_file(), f"missing TeX provider: {name}"
            body = path.read_bytes()
            providers[name] = {"path": str(path), "bytes": len(body), "sha256": hashlib.sha256(body).hexdigest()}
        source = subprocess.check_output(["git", "rev-parse", "HEAD"], stdin=subprocess.DEVNULL, text=True).strip()
        provenance = {"source_sha": source, "run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "role": "prepared native document tool provenance only", "runtime_acceptance": False, "host": os.environ["RUNNER_OS"], "tools": tools, "providers": providers}
        document_provider = json.loads(Path(os.environ["TEMPLATE_DOCUMENT_PROVIDER_PROVENANCE"]).read_bytes())
        if document_provider.get("runtime_acceptance") is not False:
            raise SystemExit("document preparation provenance cannot assert native acceptance")
        provenance["document_provider_preparation"] = document_provider
        if os.environ["RUNNER_OS"] == "Linux":
            provenance["distribution"] = {"repository": "https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2025/tlnet-final", "installer_sha256": "311df9f1477fd90c520159d1feddc2d6270f010d8349d1f6bdb9461a93b48a5c", "repository_database_xz_sha256": "56df038e9070a3d587eeceb5def3f154b2cacccef36d4295bb49e0618977c34a"}
        target = Path(os.environ["RUNNER_TEMP"]) / "template-acceptance-document-provenance.json"
        with target.open("x") as output:
            json.dump(provenance, output, indent=2)
            output.write("\n")
        print(json.dumps(provenance))
        PYTHON
