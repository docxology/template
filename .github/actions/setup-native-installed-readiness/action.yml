name: Prepare Source-locked installed native readiness inputs
description: Provision the existing official tools and warm exact locked dependencies before the unchanged cold operation budget starts.
inputs:
  prepare-lean:
    description: Prepare the Source-pinned Lean compiler for the complete native replay.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Validate native preparation selection
      shell: bash
      env:
        PREPARE_LEAN: ${{ inputs.prepare-lean }}
      run: |
        case "$PREPARE_LEAN" in
          true|false) ;;
          *) echo 'prepare-lean must be true or false' >&2; exit 2 ;;
        esac
    - shell: bash
      run: uv sync --locked --inexact --group dev --group public-exemplars --group installed-build --group rendering --group rendering-pptx
    - uses: ./.github/actions/setup-docs-lint
    - name: Verify the complete installed npm lock before native preparation
      shell: bash
      run: |
        .venv/bin/python - <<'PYTHON'
        import json
        import time
        from pathlib import Path
        from infrastructure.reporting.native_mermaid_runtime_selection import _installation
        root = Path.cwd()
        lock = json.loads((root / "package-lock.json").read_text())
        installed = _installation(root / "node_modules", lock, time.monotonic() + 120)
        print(f"Prepared exact Source npm rows: {len(installed['locked_installed_packages'])}")
        PYTHON
    - uses: ./.github/actions/setup-acceptance-documents
    - name: Prepare the source-pinned Lean compiler for full-suite replay
      if: inputs.prepare-lean == 'true'
      shell: bash
      run: |
        set -euo pipefail
        pin=$(cat projects/templates/template_active_inference/lean/lean-toolchain)
        formal_pin=$(cat projects/templates/template_formal/formal/lean/lean-toolchain)
        test "$pin" = 'leanprover/lean4:v4.35.0'
        test "$formal_pin" = "$pin"
        installer=$(mktemp "$RUNNER_TEMP/native-elan-init.XXXXXX")
        curl --fail --location --retry 2 --max-time 60 --output "$installer" https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh
        echo "4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264  $installer" | shasum -a 256 --check --status
        sh "$installer" -y --default-toolchain none
        "$HOME/.elan/bin/elan" toolchain install "$pin"
        "$HOME/.elan/bin/elan" run "$pin" lean --version
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - name: Prepare the exact self-contained Java reader runtime
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
      with:
        distribution: temurin
        java-version: '21.0.12.1+1'
        java-package: jre
        architecture: x64
        force-download: true
    - name: Prepare official native reader tools
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        QT_QPA_PLATFORM: offscreen
      run: |
        set -euo pipefail
        sudo -n apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress calibre default-jre-headless zbar-tools
        tool_parent=$(mktemp -d "$RUNNER_TEMP/template-native-tools.XXXXXX")
        destination="$tool_parent/epubcheck"
        java_executable=$(readlink -f "$JAVA_HOME/bin/java")
        .venv/bin/python scripts/shell/prepare_native_epubcheck.py --destination "$destination"
        "$java_executable" -version
        "$java_executable" -jar "$destination/epubcheck-5.4.0/epubcheck.jar" --version
        .venv/bin/python - "$java_executable" "$destination/epubcheck-5.4.0/epubcheck.jar" <<'PYTHON'
        from pathlib import Path
        import sys
        import time
        from infrastructure.reporting.native_epub_observer import bind_epubcheck_engine
        engine = bind_epubcheck_engine(Path(sys.argv[2]), Path(sys.argv[1]), deadline=time.monotonic() + 120)
        print(f"Prepared complete confined Java/EPUBCheck binding: {len(engine['files'])} files")
        PYTHON
        echo "TEMPLATE_NATIVE_JAVA=$java_executable" >> "$GITHUB_ENV"
        echo "TEMPLATE_NATIVE_EPUBCHECK=$destination/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"
    - name: Prepare or independently inspect exact browser math DATA
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -e output/readiness/native-dependencies ]; then
          .venv/bin/python -m infrastructure.reporting.native_dependency_preparation --repo-root .
        else
          .venv/bin/python - <<'PYTHON'
        from pathlib import Path
        from infrastructure.reporting.native_format_browser_cdn import compile_cdn_assets
        from infrastructure.reporting.release_readiness_snapshot import SnapshotReader
        reader=SnapshotReader(Path.cwd())
        compile_cdn_assets(reader)
        if not reader.unchanged(): raise ValueError("Source math DATA changed during inspection")
        PYTHON
        fi
    - name: Warm exact Source-locked offline dependencies for cold installed wheels
      uses: ./.github/actions/setup-native-offline-cache
