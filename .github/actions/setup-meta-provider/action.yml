name: Prepare declared Meta provider
description: Build and install the genuine noneditable public Meta wheel into the prepared root interpreter.
runs:
  using: composite
  steps:
    - name: Build and install the current provider wheel
      shell: bash
      run: |
        set -euo pipefail
        wheels=$(mktemp -d "$RUNNER_TEMP/template-meta-provider.XXXXXX")
        uv build --wheel --no-build-isolation --python .venv/bin/python \
          --out-dir "$wheels" projects/templates/template_literature_meta_analysis
        uv pip install --python .venv/bin/python --no-deps --reinstall "$wheels"/*.whl
