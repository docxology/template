name: Reclaim declared native runner capacity
description: Reclaim the fixed hosted Linux toolchain footprint before native allocation.
runs:
  using: composite
  steps:
    - name: Reclaim the fixed hosted Linux toolchain footprint
      shell: 'bash -e {0}'
      run: |
        set -euo pipefail
        free_before=$(df -k --output=avail / | tail -n 1)
        for path in \
          /usr/local/lib/android \
          /usr/share/dotnet \
          /opt/ghc \
          /usr/share/swift \
          /usr/local/share/boost \
          /opt/hostedtoolcache/CodeQL \
          /opt/hostedtoolcache/PyPy \
          /opt/hostedtoolcache/Ruby \
          /opt/hostedtoolcache/Go; do
          if [ -e "$path" ]; then
            sudo rm -rf --one-file-system -- "$path" || echo "reclaim-retained=$path"
          fi
        done
        free_after=$(df -k --output=avail / | tail -n 1)
        echo "reclaimed_kib=$((free_after - free_before)) free_kib=$free_after"
        if [ "$free_after" -lt 10485760 ]; then
          echo "::warning::free space is below the declared 10 GiB preparation threshold"
        fi
