name: Prepare one owned pinned acceptance model
description: Authenticate Ollama 0.35.1 and smollm2:135m, then start a temporary loopback-only daemon on this hosted runner.
runs:
  using: composite
  steps:
    - name: Prepare exact official Ollama runtime
      shell: bash
      run: |
        set -euo pipefail
        destination=$(mktemp -d "$RUNNER_TEMP/template-acceptance-model.XXXXXX")
        if [ "$RUNNER_OS" = Linux ]; then
          asset=ollama-linux-amd64.tar.zst
          digest=9fcd79ac4575b2bd31b992eee18b1000c8ad126b451627c8f8cd091714cfbb10
          size=1439658961
        else
          asset=ollama-darwin.tgz
          digest=3137dbf28948ee844e0fb3e584d9b5de6879d73d9f0cb7eff3ad64930601d307
          size=159625239
        fi
        curl --fail --location --retry 2 --max-time 900 --output "$destination/$asset" "https://github.com/ollama/ollama/releases/download/v0.35.1/$asset"
        test "$(wc -c < "$destination/$asset" | tr -d ' ')" = "$size"
        echo "$digest  $destination/$asset" | shasum -a 256 --check --status
        if [ "$RUNNER_OS" = Linux ]; then
          tar --zstd -xf "$destination/$asset" -C "$destination"
          echo "$destination/bin" >> "$GITHUB_PATH"
          echo "TEMPLATE_ACCEPTANCE_OLLAMA=$destination/bin/ollama" >> "$GITHUB_ENV"
        else
          tar -xzf "$destination/$asset" -C "$destination"
          echo "$destination" >> "$GITHUB_PATH"
          echo "TEMPLATE_ACCEPTANCE_OLLAMA=$destination/ollama" >> "$GITHUB_ENV"
        fi
        rm "$destination/$asset"
        echo "TEMPLATE_ACCEPTANCE_MODEL_DIRECTORY=$destination" >> "$GITHUB_ENV"
    - name: Restore source-pinned model bytes
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/template-acceptance-model-cache/manifests/registry.ollama.ai/library/smollm2/135m
          ${{ runner.temp }}/template-acceptance-model-cache/blobs/sha256-b0f58c4c1a3ca56f34a7673b353d7d09b773a1abce00451a58d5ebd2541331cf
          ${{ runner.temp }}/template-acceptance-model-cache/blobs/sha256-f535f83ec568d040f88ddc04a199fa6da90923bbb41d4dcaed02caa924d6ef57
          ${{ runner.temp }}/template-acceptance-model-cache/blobs/sha256-fbacade46b4da804e0398c339c64b944d4b954452adf77cf050b49420116129e
          ${{ runner.temp }}/template-acceptance-model-cache/blobs/sha256-d502d55c1d609104ae6127aee92eb940e51e15c56dfb26dbd067e2771ee746f1
          ${{ runner.temp }}/template-acceptance-model-cache/blobs/sha256-58d1e17ffe5109a7ae296caafcadfdbe6a7d176f0bc4ab01e12a689b0499d8bd
          ${{ runner.temp }}/template-acceptance-model-cache/blobs/sha256-f02dd72bb2423204352eabc5637b44d79d17f109fdb510a7c51455892aa2d216
        key: acceptance-model-bytes-v1-${{ runner.os }}-9077fe9d2ae1a4a41a868836b56b8163731a8fe16621397028c2c76f838c6907-${{ hashFiles('.github/actions/setup-acceptance-model/action.yml') }}
    - name: Authenticate exact manifest and every fixed model blob
      shell: bash
      run: |
        set -euo pipefail
        destination="$RUNNER_TEMP/template-acceptance-model-cache"
        for relative in '' blobs manifests manifests/registry.ollama.ai manifests/registry.ollama.ai/library manifests/registry.ollama.ai/library/smollm2; do
          directory="$destination${relative:+/$relative}"
          if [ -e "$directory" ] || [ -L "$directory" ]; then
            test -d "$directory"
            test ! -L "$directory"
          else
            mkdir "$directory"
          fi
        done
        manifest="$destination/manifests/registry.ollama.ai/library/smollm2/135m"
        if [ ! -e "$manifest" ] && [ ! -L "$manifest" ]; then
          curl --fail --location --retry 2 --max-time 60 --output "$manifest" https://registry.ollama.ai/v2/library/smollm2/manifests/135m
        fi
        test -f "$manifest"
        test ! -L "$manifest"
        test "$(wc -c < "$manifest" | tr -d ' ')" = 1124
        echo "9077fe9d2ae1a4a41a868836b56b8163731a8fe16621397028c2c76f838c6907  $manifest" | shasum -a 256 --check --status
        python - "$manifest" > "$TEMPLATE_ACCEPTANCE_MODEL_DIRECTORY/blob-inputs.txt" <<'PYTHON'
        import json, sys
        from pathlib import Path
        manifest = json.loads(Path(sys.argv[1]).read_text())
        for record in [manifest["config"], *manifest["layers"]]:
            digest = record["digest"].removeprefix("sha256:")
            assert len(digest) == 64 and all(c in "0123456789abcdef" for c in digest)
            print(digest, record["size"])
        PYTHON
        while read -r digest size; do
          blob="$destination/blobs/sha256-$digest"
          if [ ! -e "$blob" ] && [ ! -L "$blob" ]; then
            curl --fail --location --retry 2 --max-time 300 --output "$blob" "https://registry.ollama.ai/v2/library/smollm2/blobs/sha256:$digest"
          fi
          test -f "$blob"
          test ! -L "$blob"
          test "$(wc -c < "$blob" | tr -d ' ')" = "$size"
          echo "$digest  $blob" | shasum -a 256 --check --status
        done < "$TEMPLATE_ACCEPTANCE_MODEL_DIRECTORY/blob-inputs.txt"
        {
          echo "OLLAMA_MODELS=$destination"
          echo "OLLAMA_HOST=http://127.0.0.1:11434"
          echo "OLLAMA_NO_CLOUD=1"
          echo "OLLAMA_NOPRUNE=1"
          echo "OLLAMA_NUM_PARALLEL=1"
          echo "OLLAMA_MAX_LOADED_MODELS=1"
          echo "OLLAMA_CONTEXT_LENGTH=2048"
          echo "OLLAMA_KEEP_ALIVE=1m"
          echo "OLLAMA_MODEL=smollm2:135m"
          echo "TEMPLATE_AUTOSCIENTISTS_MODEL=smollm2:135m"
          echo "TEMPLATE_AUTOSCIENTISTS_ENDPOINT=http://127.0.0.1:11434"
          echo "OLLAMA_TEST_PULL_MODEL=smollm2:135m"
          echo "OLLAMA_SKIP_TEST_MODEL_PULL=1"
        } >> "$GITHUB_ENV"
    - name: Start owned daemon and verify actual inference before observation
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PYTHON'
        import json, os, socket, subprocess, sys, time, urllib.request
        from pathlib import Path
        directory = Path(os.environ["TEMPLATE_ACCEPTANCE_MODEL_DIRECTORY"])
        with socket.socket() as probe:
            probe.bind(("127.0.0.1", 11434))
        environment = dict(os.environ, OLLAMA_HOST="127.0.0.1:11434")
        with (directory / "daemon.stdout").open("xb") as out, (directory / "daemon.stderr").open("xb") as err:
            anchor = "import signal,subprocess,sys,time\nsignal.signal(signal.SIGTERM,signal.SIG_IGN)\nserver=subprocess.Popen([sys.argv[1],'serve'])\nwhile True: time.sleep(0.5)\n"
            child = subprocess.Popen([sys.executable, "-c", anchor, os.environ["TEMPLATE_ACCEPTANCE_OLLAMA"]], env=environment, stdout=out, stderr=err, start_new_session=True)
        birth = subprocess.check_output(["ps", "-p", str(child.pid), "-o", "lstart="], text=True).strip()
        def members():
            rows = subprocess.check_output(["ps", "-axo", "pid=,pgid=,lstart=,stat="], text=True)
            return {int(fields[0]): " ".join(fields[2:7]) for line in rows.splitlines() if len(fields := line.split()) >= 8 and int(fields[1]) == child.pid and not fields[7].startswith("Z")}
        def remember():
            (directory / "daemon-owner.json").write_text(json.dumps({"pid": child.pid, "members": members()}))
        remember()
        deadline = time.monotonic() + 60
        while True:
            assert child.poll() is None, "Owned Ollama daemon stopped before readiness"
            try:
                with urllib.request.urlopen("http://127.0.0.1:11434/api/tags", timeout=2) as response:
                    tags = json.load(response)
                break
            except OSError:
                if time.monotonic() > deadline:
                    raise TimeoutError("Owned Ollama readiness deadline")
                time.sleep(1)
        assert len(tags["models"]) == 1 and tags["models"][0]["name"] == "smollm2:135m"
        assert tags["models"][0]["digest"] == "9077fe9d2ae1a4a41a868836b56b8163731a8fe16621397028c2c76f838c6907"
        request = urllib.request.Request("http://127.0.0.1:11434/api/generate", data=json.dumps({"model": "smollm2:135m", "prompt": "Say OK.", "stream": False, "options": {"num_predict": 16, "num_ctx": 4096, "seed": 0, "temperature": 0}}).encode(), headers={"Content-Type": "application/json"})
        with urllib.request.urlopen(request, timeout=120) as response:
            result = json.load(response)
        assert result["done"] and result["eval_count"] > 0 and result["response"].strip()
        remember()
        (directory / "inference-preparation.json").write_text(json.dumps(result))
        PYTHON
