name: Setup Python env
description: >-
  Shared CI setup: provision uv (with cache) and install Python. Factored out
  of ci.yml so the pinned action SHAs and cache configuration live in one place
  instead of being copy-pasted per job. The caller MUST run actions/checkout
  first — a local composite action's files are only available after checkout.

inputs:
  python-version:
    description: Python version passed to actions/setup-python.
    required: false
    default: "3.14"

  dependency-group:
    description: Explicit root dependency group reconciled by the caller.
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.13.0"
        enable-cache: true
        prune-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
          .python-version

    - id: python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    # Cache only compatible root inputs, exact resolved Python, host and group.
    # Every caller still performs its declared locked reconciliation; this is
    # installation acceleration, never proof of source or runtime acceptance.
    - name: Cache uv environment (uv.lock-keyed)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: uv-venv-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ inputs.dependency-group }}-${{ hashFiles('uv.lock', 'pyproject.toml', '.python-version') }}
        restore-keys: |
          uv-venv-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ inputs.dependency-group }}-

    - name: Set SOURCE_DATE_EPOCH for deterministic LaTeX builds
      shell: bash
      run: |-
        epoch=$(git log -1 --format=%ct)
        echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
        echo "TZ=UTC" >> "$GITHUB_ENV"
