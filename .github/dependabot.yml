# Dependabot — repository root, plus the 25 template projects under projects/templates/.
#
# Version-update coverage of the locks is why this file has three blocks rather than two.
# `directory: "/"` does not recurse, so before the first of these changes no version-update
# automation read `projects/templates/*/uv.lock` at all. Those manifests held 1,360 of this
# repository's 1,467 open alerts (93%) on 2026-11-03, because a version bump applied to one
# lock never reached the other twenty-four.
#
# `directories` (plural) is the key that accepts a glob; `directory` does not.
# `uv` is the key that reads `uv.lock`; `pip` reads `.txt` requirement files and PEP 621
# `pyproject.toml` only. `uv` covers the pyproject as well, so it is a superset here.
# See https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  # ───────────────────────────────────────────
  # GitHub Actions — weekly, max 5 open PRs
  # ───────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "automated"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ───────────────────────────────────────────
  # Python (uv) — root manifest and lock, weekly, grouped
  # ───────────────────────────────────────────
  # WHY `uv` AND NOT `pip`
  # This block was `pip`, which cannot see `uv.lock`: pip reads `.txt` requirement files and
  # PEP 621 `pyproject.toml`. The root `uv.lock` therefore had the same blind spot the template
  # locks had, one directory up. The `uv` ecosystem fetcher inherits the Python shared fetcher
  # and takes `pyproject.toml`, `uv.lock` and `.txt`/`.in` requirement files, so moving the
  # block to `uv` keeps the `pyproject.toml` coverage that worked and adds the lock.
  #
  # `[tool.uv.workspace] members` is empty in this repository, so nothing here reaches the
  # template projects implicitly; the third block covers them explicitly by glob.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "automated"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Dev/testing tools batched — lower risk, single PR
      dev-tools:
        patterns:
          - "pytest*"
          - "mypy*"
          - "ruff*"
          - "bandit*"
          - "pip-audit*"
          - "types-*"
          - "iniconfig*"
        update-types: ["minor", "patch"]
      # Core scientific deps batched separately
      scientific-core:
        patterns:
          - "numpy*"
          - "scipy*"
          - "pandas*"
          - "matplotlib*"
          - "scikit-learn*"
          - "networkx*"
        update-types: ["minor", "patch"]

  # ───────────────────────────────────────────
  # Python (uv) — the 25 template projects under projects/templates/
  # ───────────────────────────────────────────
  # WHY THIS BLOCK CANNOT FLOOD
  # Without `group-by`, one dependency needing an update in all 25 templates is 25 pull requests.
  # `group-by: dependency-name` collapses a dependency's update across every matched directory
  # into a SINGLE pull request, so a pillow bump is one PR covering all 25 locks, and
  # `open-pull-requests-limit` caps how many can be open at once. No `update-types` filter is set
  # deliberately: a filter would push excluded update types back out of the group and back into
  # per-directory PRs, which is the flood this block exists to prevent.
  #
  # A blind spot that produces a flood gets reverted by whoever is on call; a scoped one survives.
  - package-ecosystem: "uv"
    directories:
      - "/projects/templates/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "automated"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      templates-by-dependency:
        group-by: dependency-name
        patterns: ["*"]
