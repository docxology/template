name: Release Rehearsal

# CLEAN-CHECKOUT-MAJ-1 machinery + REHEARSAL-PARALLEL-1: two deterministic
# fresh-checkout rehearsals run as a two-cell matrix on hosted Linux, so the
# ~55-65 min sequential wall time approaches single-run time. Each cell runs
# exactly one fresh-checkout run (`--shard-index`) and uploads its own shard
# receipt; the `consolidate` job rebuilds the same two-run determinism receipt
# the sequential script produces (equal digests or the job fails — parallel
# cells must not weaken the comparison). Dispatch-only — zero cost on normal
# PRs; run from the Actions tab (or `gh workflow run release-rehearsal.yml`)
# when a clean-checkout receipt is needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rehearsal-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  UV_FROZEN: "true"
  MPLBACKEND: Agg

jobs:
  rehearsal:
    name: Clean-checkout rehearsal (ubuntu, run ${{ matrix.run-index }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One cell per rehearsal run; plan.runs defaults to 2 and the
      # consolidate job asserts the shard indices cover exactly 1..run_count.
      matrix:
        run-index: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      # The rehearsal's fresh clones have no node_modules, and CI=true makes
      # the docs-lint mermaid gate strict (mmdc unavailable => hard failure,
      # not a skip). Provision the toolchain at job level so each clone
      # resolves mmdc via PATH and Chrome via CHROME_EXECUTABLE_PATH — the
      # same lockfile-pinned install the CI docs-lint job uses.
      - name: Provision docs-lint toolchain (mmdc + chrome-headless-shell)
        uses: ./.github/actions/setup-docs-lint

      - name: Install pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1

      - name: Restore TeX Live cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /var/cache/apt
            /usr/share/texlive
            /usr/share/texmf
          key: texlive-${{ runner.os }}-xetex-extra-bibtex-fonts-v1
        id: texlive-cache

      - name: Install TeX Live (xelatex + bibtex)
        if: steps.texlive-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-bibtex-extra \
            texlive-fonts-recommended lmodern

      # Warm the uv cache from the repo lockfile so the rehearsal's fresh
      # clones can satisfy `uv sync --locked --offline` without network.
      - name: Warm uv cache
        run: uv sync --group public-exemplars

      - name: Run deterministic fresh-checkout rehearsal (shard ${{ matrix.run-index }})
        run: >-
          uv run --frozen --no-sync python scripts/maintenance/release_rehearsal.py
          --execute --shard-index ${{ matrix.run-index }}
          --receipt clean_checkout_rehearsal_shard_${{ matrix.run-index }}.json
          --artifact-dir clean_checkout_rehearsal_logs_run${{ matrix.run-index }}

      - name: Upload rehearsal shard receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-checkout-rehearsal-shard-${{ matrix.run-index }}
          path: |
            clean_checkout_rehearsal_shard_${{ matrix.run-index }}.json
            clean_checkout_rehearsal_logs_run${{ matrix.run-index }}/
          if-no-files-found: error

  consolidate:
    name: Consolidate rehearsal determinism receipt
    needs: [rehearsal]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync

      - name: Download rehearsal shard receipts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: clean-checkout-rehearsal-shard-*
          merge-multiple: false
          path: shards

      - name: Consolidate shards into the release receipt
        run: >-
          uv run --frozen --no-sync python scripts/maintenance/release_rehearsal.py
          --consolidate
          shards/clean-checkout-rehearsal-shard-1/clean_checkout_rehearsal_shard_1.json
          shards/clean-checkout-rehearsal-shard-2/clean_checkout_rehearsal_shard_2.json
          --receipt clean_checkout_rehearsal_receipt.json

      - name: Upload consolidated rehearsal receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-checkout-rehearsal-receipt
          path: clean_checkout_rehearsal_receipt.json
          if-no-files-found: error

      - name: Summarize receipt
        if: always()
        run: |
          {
            echo "## Clean-checkout rehearsal receipt"
            echo '```json'
            cat clean_checkout_rehearsal_receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
