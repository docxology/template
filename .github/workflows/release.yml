name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing root tag to release (e.g. v4.0.2)"
        required: true
      acceptance_run_id:
        description: "Successful exact-tag-SHA run that uploaded required acceptance (root 4+)"
        required: false
      acceptance_artifact_id:
        description: "Exact platform-required-acceptance artifact ID from that run (root 4+)"
        required: false
      acceptance_receipt_sha256:
        description: "SHA256 of output/readiness/release-candidate/receipt.json (root 4+)"
        required: false

permissions:
  contents: write  # Required to create the GitHub Release
  actions: read  # Read only the explicitly selected acceptance run/artifact

# Serialize by the selected tag across tag pushes and manual dispatches.
# Never cancel an in-flight release: publication may already have started.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Determine tag name
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for changelog generation
          submodules: true  # Match exact authored SDK bytes observed by acceptance
          persist-credentials: false
          ref: ${{ steps.tag.outputs.name }}

      - name: Verify checkout is the requested tag
        id: tag_checkout
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag '$TAG' does not exist in this checkout. Push the tag first or choose an existing tag."
            exit 1
          fi
          EXPECTED=$(git rev-parse "refs/tags/$TAG^{commit}")
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Checked-out commit '$ACTUAL' does not match requested tag '$TAG' at '$EXPECTED'."
            exit 1
          fi
          echo "source_commit=$ACTUAL" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      - name: Bind tagged candidate build policy
        run: |
          set -euo pipefail
          candidate=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          epoch=$(git -C "$GITHUB_WORKSPACE" show -s --format=%ct "$candidate")
          {
            echo "SOURCE_DATE_EPOCH=$epoch"
            echo "TEMPLATE_BUILD_EPOCH_SOURCE=git:$candidate"
            echo "TEMPLATE_EXECUTION_MODE=core"
            echo "TEMPLATE_DETERMINISTIC=1"
          } >> "$GITHUB_ENV"

      - name: Prepare locked release environment
        run: uv sync --locked --group public-exemplars --group installed-build --group publishing

      - uses: ./.github/actions/setup-acceptance-fixtures

      - name: Verify pristine published public exemplars
        run: >-
          uv run --no-sync --offline python -m infrastructure.validation.cli publication-audit
          --repo-root "$GITHUB_WORKSPACE" --all-public --strict --rendered --format json

      - name: Require explicit root 4+ acceptance handoff
        id: acceptance
        if: ${{ !startsWith(steps.tag.outputs.name, 'v0.') && !startsWith(steps.tag.outputs.name, 'v1.') && !startsWith(steps.tag.outputs.name, 'v2.') && !startsWith(steps.tag.outputs.name, 'v3.') }}
        env:
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_ARTIFACT_ID: ${{ inputs.acceptance_artifact_id }}
          ACCEPTANCE_RECEIPT_SHA256: ${{ inputs.acceptance_receipt_sha256 }}
        run: |
          set -euo pipefail
          uv run --no-sync --offline python -m infrastructure.publishing.release_acceptance inputs \
            --run-id "$ACCEPTANCE_RUN_ID" --artifact-id "$ACCEPTANCE_ARTIFACT_ID" \
            --receipt-sha256 "$ACCEPTANCE_RECEIPT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify hosted required-acceptance provenance
        if: steps.acceptance.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_ARTIFACT_ID: ${{ inputs.acceptance_artifact_id }}
        run: |
          set -euo pipefail
          # IDs were admitted before constructing these fixed, same-repository endpoints.
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN_ID" \
            > "$RUNNER_TEMP/root-release-acceptance-run.json"
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/actions/artifacts/$ACCEPTANCE_ARTIFACT_ID" \
            > "$RUNNER_TEMP/root-release-acceptance-artifact.json"
          uv run --no-sync --offline python -m infrastructure.publishing.release_acceptance hosted \
            --run-metadata "$RUNNER_TEMP/root-release-acceptance-run.json" \
            --artifact-metadata "$RUNNER_TEMP/root-release-acceptance-artifact.json" \
            --repository "$GITHUB_REPOSITORY" --revision "$(git rev-parse HEAD)" \
            --run-id "$ACCEPTANCE_RUN_ID" --artifact-id "$ACCEPTANCE_ARTIFACT_ID"

      - name: Select exact native reader Python release
        if: steps.acceptance.outputs.required == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.4"
      - uses: ./.github/actions/setup-native-installed-readiness
        if: steps.acceptance.outputs.required == 'true'
      - name: Verify complete authenticated candidate with independently installed current providers
        id: candidate_reader
        if: steps.acceptance.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RECEIPT_SHA256: ${{ inputs.acceptance_receipt_sha256 }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_ARTIFACT_ID: ${{ inputs.acceptance_artifact_id }}
        run: >-
          .venv/bin/python -m infrastructure.reporting.native_installed_launcher --mode handoff
          --source-root "$GITHUB_WORKSPACE" --source-commit "$(git rev-parse HEAD)"
          --source-identity "$(.venv/bin/python -c 'from pathlib import Path;from infrastructure.reporting.readiness_receipts import source_fingerprint;print(source_fingerprint(Path.cwd()))')"
          --current-root "$RUNNER_TEMP/template-release-reader-root"
          --scratch "$RUNNER_TEMP/template-release-reader-scratch"
          --epubcheck-jar "$TEMPLATE_NATIVE_EPUBCHECK" --java-executable "$TEMPLATE_NATIVE_JAVA"
          --python "$pythonLocation/bin/python" --uv "$(command -v uv)"
          --expected-platform Linux --timeout 14400
          --mermaid-package-root "$GITHUB_WORKSPACE/node_modules/@mermaid-js/mermaid-cli"
          --mermaid-dependency-root "$GITHUB_WORKSPACE/node_modules"
          --mermaid-node-executable "$(command -v node)"
          --mermaid-chrome-executable "$CHROME_EXECUTABLE_PATH"
          --office-font-directory /usr/share/fonts/truetype
          --office-font-directory "/usr/local/share/fonts/template-acceptance-juliamono"
          --repository "$GITHUB_REPOSITORY" --run-id "$ACCEPTANCE_RUN_ID"
          --acceptance-artifact-id "$ACCEPTANCE_ARTIFACT_ID"
          --acceptance-receipt-sha256 "$ACCEPTANCE_RECEIPT_SHA256"

      - name: Verify core test contract on tagged SHA
        run: |
          set -euo pipefail
          # Release gates must execute the real test contract on the exact
          # tagged SHA, not merely static contracts. The bounded pipeline-smoke
          # infra lane (the same contract project pipelines run) plus the
          # no-mocks gate provide focused executable evidence. The manual
          # Optional Hardening matrix and authenticated root 4+ required
          # acceptance remain separate publication obligations.
          uv run --no-sync --offline python scripts/audit/verify_no_mocks.py
          uv run --no-sync --offline python scripts/pipeline/stage_01_test.py --infra-only --infra-scope pipeline-smoke

      - name: Verify root package release contract
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: uv run --no-sync --offline python -m infrastructure.publishing.root_release_contract --tag "$TAG"

      - name: Verify public capability manifest
        run: uv run --no-sync --offline python scripts/gates/public_capabilities.py

      - name: Install supported Python 3.15
        if: steps.acceptance.outputs.required != 'true'
        id: python315
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Select supported Python 3.14
        if: steps.acceptance.outputs.required != 'true'
        id: python314
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Prepare locked installed-matrix dependency cache
        if: steps.acceptance.outputs.required != 'true'
        env:
          PYTHON315: ${{ steps.python315.outputs.python-path }}
          PYTHON314: ${{ steps.python314.outputs.python-path }}
        run: |
          set -euo pipefail
          read -r -a projects <<< "$(uv run --no-sync --offline python -m infrastructure.project.public_scope project-names)"
          for selection in "3.14=$PYTHON314" "3.15=$PYTHON315"; do
            minor=${selection%%=*}
            interpreter=${selection#*=}
            build_environment="$RUNNER_TEMP/release-build-cache-$minor"
            UV_PROJECT_ENVIRONMENT="$build_environment" uv sync --locked --no-python-downloads \
              --python "$interpreter" --only-group installed-build --no-install-project
            for scope in root "${projects[@]}"; do
              metadata="$GITHUB_WORKSPACE"
              if [ "$scope" != root ]; then
                metadata="$GITHUB_WORKSPACE/projects/$scope"
              fi
              slug=${scope//\//_}
              requirements="$RUNNER_TEMP/release-dependencies-$minor-$slug.txt"
              environment="$RUNNER_TEMP/release-dependency-cache-$minor-$slug"
              uv export --directory "$metadata" --locked --no-default-groups \
                --no-emit-project --no-emit-local --no-header --no-annotate \
                --output-file "$requirements"
              uv venv --no-project --no-python-downloads --python "$interpreter" "$environment"
              uv pip sync --no-config --no-build --require-hashes --allow-empty-requirements \
                --python "$environment/bin/python" "$requirements"
            done
          done

      - name: Verify complete installed-wheel matrix
        id: installed_matrix
        if: steps.acceptance.outputs.required != 'true'
        env:
          PYTHON315: ${{ steps.python315.outputs.python-path }}
          PYTHON314: ${{ steps.python314.outputs.python-path }}
        run: |
          set -euo pipefail
          uv run --no-sync --offline python scripts/gates/installed_public.py \
            --project-workers 1 --timeout 600 \
            --python "3.14=$PYTHON314" --python "3.15=$PYTHON315" \
            --evidence-dir "$GITHUB_WORKSPACE/output/readiness/installed-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Select source-bound installed publication inputs
        id: release_inputs
        env:
          REQUIRED_ACCEPTANCE: ${{ steps.acceptance.outputs.required }}
        run: |
          set -euo pipefail
          release_root="$GITHUB_WORKSPACE"
          installed_receipt="$release_root/output/readiness/installed-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/receipt.json"
          if [ "$REQUIRED_ACCEPTANCE" = true ]; then
            # The preceding fresh installed reader authenticated this complete candidate.
            release_root="$RUNNER_TEMP/template-release-reader-root"
            installed_receipt="$release_root/output/readiness/installed/receipt.json"
          fi
          test -f "$installed_receipt"
          expected=$(git --no-optional-locks -c core.fsmonitor=false -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          actual=$(git --no-optional-locks -c core.fsmonitor=false -C "$release_root" rev-parse HEAD)
          test "$actual" = "$expected"
          {
            echo "root=$release_root"
            echo "installed_receipt=$installed_receipt"
          } >> "$GITHUB_OUTPUT"

      - name: Admit the exact installed wheel and final source distribution
        id: distributions
        env:
          TAG: ${{ steps.tag.outputs.name }}
          RELEASE_ROOT: ${{ steps.release_inputs.outputs.root }}
          INSTALLED_RECEIPT: ${{ steps.release_inputs.outputs.installed_receipt }}
        run: |
          set -euo pipefail
          source_archive_directory="$RUNNER_TEMP/template-source-archive-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          uv build --sdist --no-build-isolation --offline --out-dir "$source_archive_directory"
          mkdir "$RELEASE_ROOT/dist"
          cp "$source_archive_directory"/*.tar.gz "$RELEASE_ROOT/dist/"
          uv run --no-sync --offline python -m infrastructure.publishing.root_release_artifacts \
            --repo-root "$RELEASE_ROOT" --tag "$TAG" \
            --installed-receipt "$INSTALLED_RECEIPT" \
            >> "$GITHUB_OUTPUT"
          uv run --no-sync --offline python -m twine check "$RELEASE_ROOT"/dist/*.whl "$RELEASE_ROOT"/dist/*.tar.gz

      - name: Generate changelog excerpt
        id: changelog
        env:
          TAG: ${{ steps.tag.outputs.name }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_ARTIFACT_ID: ${{ inputs.acceptance_artifact_id }}
          ACCEPTANCE_RECEIPT_SHA256: ${{ inputs.acceptance_receipt_sha256 }}
        run: |
          set -euo pipefail
          release_major="${TAG#v}"
          release_major="${release_major%%.*}"
          if [ "$release_major" -ge 4 ]; then
            candidate=$(git rev-parse HEAD)
            cp "docs/releases/$TAG.md" "$RUNNER_TEMP/template-release-notes.md"
            {
              echo
              echo "Accepted source: [$candidate](https://github.com/$GITHUB_REPOSITORY/commit/$candidate)."
              echo "Required acceptance: [run $ACCEPTANCE_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN_ID)."
              echo "Acceptance artifact: [$ACCEPTANCE_ARTIFACT_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN_ID/artifacts/$ACCEPTANCE_ARTIFACT_ID)."
              echo "Acceptance receipt SHA-256: $ACCEPTANCE_RECEIPT_SHA256."
            } >> "$RUNNER_TEMP/template-release-notes.md"
          else
            previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [ -n "$previous" ]; then
              git log "$previous..$TAG" --oneline --no-merges --max-count=50 > "$RUNNER_TEMP/template-release-notes.md"
            else
              git log "$TAG" --oneline --no-merges --max-count=50 > "$RUNNER_TEMP/template-release-notes.md"
            fi
          fi
          echo "file=$RUNNER_TEMP/template-release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Recheck admitted publication bytes
        id: asset_recheck
        env:
          TAG: ${{ steps.tag.outputs.name }}
          MANIFEST_SHA256: ${{ steps.distributions.outputs.manifest_sha256 }}
          RELEASE_ROOT: ${{ steps.release_inputs.outputs.root }}
          INSTALLED_RECEIPT: ${{ steps.release_inputs.outputs.installed_receipt }}
        run: |
          set -euo pipefail
          uv run --no-sync --offline python -m infrastructure.publishing.root_release_artifacts \
            --verify --repo-root "$RELEASE_ROOT" --tag "$TAG" --manifest-sha256 "$MANIFEST_SHA256" \
            --installed-receipt "$INSTALLED_RECEIPT"

      - name: Create GitHub Release
        id: publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Research Project Template ${{ steps.tag.outputs.name }}"
          body_path: ${{ steps.changelog.outputs.file }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-rc') || contains(steps.tag.outputs.name, '-beta') || contains(steps.tag.outputs.name, '-alpha') }}
          # Omit generate_release_notes — avoids duplicating narrative vs body_path excerpt.
          generate_release_notes: false
          files: |
            ${{ steps.release_inputs.outputs.root }}/dist/*
            ${{ steps.release_inputs.outputs.root }}/docs/releases/template-${{ steps.tag.outputs.name }}-overview.png

      - name: Verify retrieved release assets
        id: retrieved_assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          MANIFEST_SHA256: ${{ steps.distributions.outputs.manifest_sha256 }}
          RELEASE_ROOT: ${{ steps.release_inputs.outputs.root }}
          INSTALLED_RECEIPT: ${{ steps.release_inputs.outputs.installed_receipt }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/template-release-retrieved-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$destination"
          uv run --no-sync --offline python -m infrastructure.publishing.root_release_artifacts \
            --verify --repo-root "$RELEASE_ROOT" --tag "$TAG" --manifest-sha256 "$MANIFEST_SHA256" --retrieved "$destination" \
            --installed-receipt "$INSTALLED_RECEIPT"
      - name: Summarize release and retrieved-asset outcomes
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_COMMIT: ${{ steps.tag_checkout.outputs.source_commit }}
          REQUIRED_ACCEPTANCE: ${{ steps.acceptance.outputs.required }}
          HANDOFF_INPUTS: ${{ steps.acceptance.outcome }}
          CANDIDATE_READER: ${{ steps.candidate_reader.outcome }}
          INSTALLED_MATRIX: ${{ steps.installed_matrix.outcome }}
          WHEEL_ADMISSION: ${{ steps.distributions.outcome }}
          MANIFEST_SHA256: ${{ steps.distributions.outputs.manifest_sha256 }}
          ASSET_RECHECK: ${{ steps.asset_recheck.outcome }}
          RELEASE_PUBLICATION: ${{ steps.publish.outcome }}
          RETRIEVED_ASSETS: ${{ steps.retrieved_assets.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          matrix_reason=""
          if [ "$INSTALLED_MATRIX" = skipped ] && [ "$REQUIRED_ACCEPTANCE" = true ] && [ "$CANDIDATE_READER" = success ]; then
            matrix_reason="authenticated original matrix reused after fresh installed readback"
          fi
          # shellcheck disable=SC2016 # Backticks in printf formats are literal Markdown.
          {
            printf '### Release\n\nTag: `%s` · verified source: `%s` · job: `%s`\n\n' "$TAG" "${SOURCE_COMMIT:-not verified}" "$JOB_STATUS"
            printf '| Operation | Outcome | Detail |\n| --- | --- | --- |\n'
            printf '| Required handoff inputs | %s | required=%s |\n' "${HANDOFF_INPUTS:-not run}" "${REQUIRED_ACCEPTANCE:-not admitted}"
            printf '| Fresh installed candidate readback | %s | |\n' "${CANDIDATE_READER:-not run}"
            printf '| Installed-wheel matrix | %s | %s |\n' "${INSTALLED_MATRIX:-not run}" "$matrix_reason"
            printf '| Exact installed wheel/receipt and source distribution admission | %s | |\n' "${WHEEL_ADMISSION:-not run}"
            printf '| Admitted publication byte recheck | %s | |\n' "${ASSET_RECHECK:-not run}"
            printf '| GitHub release publication | %s | |\n' "${RELEASE_PUBLICATION:-not run}"
            printf '| Retrieved release asset verification | %s | |\n\n' "${RETRIEVED_ASSETS:-not run}"
            if [ "$WHEEL_ADMISSION" = success ] && [ "$ASSET_RECHECK" = success ]; then
              printf 'Admitted asset manifest SHA-256: `%s`\n\n' "$MANIFEST_SHA256"
            fi
            printf 'Publication and retrieved-byte verification retain separate outcomes.\n'
          } >> "$GITHUB_STEP_SUMMARY"
