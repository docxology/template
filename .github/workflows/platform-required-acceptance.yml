name: Platform required acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-required-acceptance-${{ github.run_id }}
  cancel-in-progress: false

env:
  UV_FROZEN: "true"
  MPLBACKEND: Agg
  OLLAMA_SKIP_TEST_MODEL_PULL: "1"

jobs:
  root-original:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
        include:
          - runner: ubuntu-24.04
            host: linux
          - runner: macos-latest
            host: darwin
        runner: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare selected locked environment
        run: uv sync --locked --inexact --group dev --group installed-build --group active-inference --group timeseries-bench --group rendering-pptx --python '${{ matrix.python }}'
      - name: Prepare exact Source-locked PDFium wheel fixture
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(.venv/bin/python -B -m infrastructure.project.pdfium_fixture_preparation \
            --repo-root "$PWD" --temporary-root "$RUNNER_TEMP")
          echo "TEMPLATE_TEST_PDFIUM_WHEEL=$wheel" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-docs-lint
      - uses: ./.github/actions/setup-acceptance-documents
      - name: Prepare source-locked browser math dependencies
        run: .venv/bin/python -m infrastructure.reporting.native_dependency_preparation --repo-root .
      - uses: ./.github/actions/setup-acceptance-model
      - uses: ./.github/actions/setup-ci-execution-user
        if: runner.os == 'Linux'
      - name: Original complete Root observation
        continue-on-error: true
        env:
          HOST: ${{ matrix.host }}
          MINOR: ${{ matrix.python }}
        run: |
          set -euo pipefail
          root_command=(.venv/bin/python -m infrastructure.project.public_acceptance_root
            --python "$MINOR=$PWD/.venv/bin/python" --mode live
            --evidence-dir "output/readiness/root-$HOST-$MINOR")
          if [ "$RUNNER_OS" = Linux ]; then
            exec .venv/bin/python -m infrastructure.core.testing.ci_execution_user run \
              --state "$RUNNER_TEMP/template-ci-execution/state.json" -- "${root_command[@]}"
          fi
          exec "${root_command[@]}"
      - name: Original macOS process and rendering obligations
        if: matrix.host == 'darwin' && matrix.python == '3.14'
        continue-on-error: true
        run: >-
          .venv/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli
          --gate root:macos:process --gate root:macos:rendering
          --evidence-dir output/readiness/auxiliary-darwin
      - name: Stop only the owned model daemon and descendants
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, signal, subprocess, time
          from pathlib import Path
          def members(group):
              rows = subprocess.check_output(["ps", "-axo", "pid=,pgid=,lstart=,stat="], text=True)
              result = {}
              for line in rows.splitlines():
                  fields = line.split()
                  if len(fields) >= 8 and int(fields[1]) == group and not fields[7].startswith("Z"):
                      result[int(fields[0])] = " ".join(fields[2:7])
              return result
          directory = os.environ.get("TEMPLATE_ACCEPTANCE_MODEL_DIRECTORY")
          owner = Path(directory) / "daemon-owner.json" if directory else None
          if owner is not None and owner.is_file():
              record = json.loads(owner.read_text())
              group = record["pid"]
              known = {int(pid): birth for pid, birth in record["members"].items()}
              current = members(group)
              if current:
                  assert any(current.get(pid) == birth for pid, birth in known.items()), "Refuse an unverified or reused process group"
                  known.update(current)
                  os.killpg(group, signal.SIGTERM)
                  deadline = time.monotonic() + 5
                  while members(group) and time.monotonic() < deadline:
                      time.sleep(0.1)
                  current = members(group)
                  if current:
                      assert any(current.get(pid) == birth for pid, birth in known.items()), "Refuse a reused group during cleanup"
                      os.killpg(group, signal.SIGKILL)
                      deadline = time.monotonic() + 5
                      while members(group) and time.monotonic() < deadline:
                          time.sleep(0.1)
                  assert not members(group), "Owned daemon descendants remain alive"
              (Path(directory) / "daemon-cleanup.json").write_text(json.dumps({"owned_group": group, "live_members_remaining": members(group), "original_exit": 0}))
          PYTHON
      - name: Export original Linux readiness bytes for the artifact reader
        if: always() && runner.os == 'Linux'
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user export
          --state "$RUNNER_TEMP/template-ci-execution/state.json"
      - name: Export original macOS readiness bytes for the artifact reader
        if: always() && runner.os == 'macOS'
        run: |
          .venv/bin/python -B - <<'PYTHON'
          import hashlib, json, os, tempfile, time
          from pathlib import Path
          from infrastructure.core.testing._ci_execution_files import _export

          deadline = time.monotonic() + 120
          destination = Path(tempfile.mkdtemp(
              prefix="template-ci-macos-artifacts-",
              dir=Path(os.environ["RUNNER_TEMP"]).resolve(strict=True),
          ))
          excluded = []
          total = _export(Path.cwd() / "output/readiness", destination, deadline, exclusions=excluded)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"TEMPLATE_CI_ARTIFACT_DIRECTORY={destination}\n")
          print(json.dumps({
              "transport_bytes": total,
              "excluded_pytest_scratch": len(excluded),
              "exclusions_sha256": hashlib.sha256(json.dumps(excluded).encode()).hexdigest(),
              "runtime_acceptance": False,
          }))
          PYTHON
      - name: Retain original source audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: required-source-root-${{ runner.os }}-${{ matrix.python }}
          path: |
            ${{ env.TEMPLATE_CI_ARTIFACT_DIRECTORY || 'output/readiness' }}/
            !${{ env.TEMPLATE_CI_ARTIFACT_DIRECTORY || 'output/readiness' }}/auxiliary-darwin/**
          if-no-files-found: error
          retention-days: 1
      - name: Retain original designated macOS auxiliary audit
        if: always() && matrix.host == 'darwin' && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: required-source-auxiliary-darwin
          path: output/readiness/auxiliary-darwin/
          if-no-files-found: error
          retention-days: 1

  common-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-python-env
      - name: Prepare both supported locked environments
        shell: bash
        run: |
          for minor in 3.14 3.15; do
            UV_PROJECT_ENVIRONMENT="output/runtime-envs/$minor" uv sync --locked --group dev --group installed-build --group active-inference --python "$minor"
          done
      - uses: ./.github/actions/setup-docs-lint
      - uses: ./.github/actions/setup-acceptance-documents
        with:
          python-executable: output/runtime-envs/3.14/bin/python
      - name: Prepare source-locked browser math dependencies
        run: output/runtime-envs/3.14/bin/python -m infrastructure.reporting.native_dependency_preparation --repo-root .
      - name: Prepare pinned Lean and TLC before formal observations
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 60 --output "$RUNNER_TEMP/elan-init.sh" https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh
          echo "4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264  $RUNNER_TEMP/elan-init.sh" | shasum -a 256 --check --status
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for pin in projects/templates/template_active_inference/lean/lean-toolchain projects/templates/template_formal/formal/lean/lean-toolchain; do
            "$HOME/.elan/bin/elan" toolchain install "$(tr -d '[:space:]' < "$pin")"
          done
          sudo apt-get install -y --no-install-recommends default-jre-headless
          java -version
      - name: Warm exact locked offline wheel dependencies for every scope and minor
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          for variable in "${!UV_@}" "${!PIP_@}"; do unset "$variable"; done
          unset PYTHONPATH PYTHONHOME VIRTUAL_ENV
          # Derived wheels stay under fresh job-owner cache custody; the locked
          # Source archive hash is not a mutable derived-wheel integrity proof.
          cache=$(mktemp -d "$RUNNER_TEMP/acceptance-installed-cache.XXXXXX")
          chmod 700 "$cache"
          export UV_CACHE_DIR="$cache" UV_LINK_MODE=copy
          echo "UV_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          build_requirements=$(mktemp "$RUNNER_TEMP/acceptance-build-requirements.XXXXXX")
          uv export --directory "$GITHUB_WORKSPACE" --locked --only-group installed-build --no-emit-project --no-emit-local --no-header --no-annotate --output-file "$build_requirements"
          read -r -a projects <<< "$(output/runtime-envs/3.14/bin/python -m infrastructure.project.public_scope project-names)"
          for minor in 3.14 3.15; do
            interpreter="$GITHUB_WORKSPACE/output/runtime-envs/$minor/bin/python"
            for scope in root "${projects[@]}"; do
              metadata="$GITHUB_WORKSPACE"
              if [ "$scope" != root ]; then metadata="$GITHUB_WORKSPACE/projects/$scope"; fi
              requirements=$(mktemp "$RUNNER_TEMP/acceptance-requirements.XXXXXX")
              environment=$(mktemp -d "$RUNNER_TEMP/acceptance-dependency-cache.XXXXXX")
              uv export --directory "$metadata" --locked --no-default-groups --no-emit-project --no-emit-local --no-header --no-annotate --output-file "$requirements"
              "$interpreter" -m infrastructure.project.locked_dependency_export --metadata-root "$metadata" --requirements "$requirements" --minor "$minor"
              uv venv --no-project --no-python-downloads --python "$interpreter" "$environment"
              uv pip sync --no-config --no-build --require-hashes --python "$environment/bin/python" "$build_requirements"
              uv pip install --no-config --no-build-isolation --no-deps --require-hashes --python "$environment/bin/python" --target "$environment/prepared-dependencies" --requirements "$requirements"
              rm -r "$environment"
              rm "$requirements"
            done
          done
          rm "$build_requirements"
      - name: Prepare exact immutable SIA sandbox image
        timeout-minutes: 10
        shell: bash
        env:
          SIA_SANDBOX_IMAGE: python@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
        run: |
          set -euo pipefail
          docker pull "$SIA_SANDBOX_IMAGE"
          image=$(docker image inspect --format '{{.Id}}' "$SIA_SANDBOX_IMAGE")
          echo "TEMPLATE_ACCEPTANCE_SIA_IMAGE_ID=$image" >> "$GITHUB_ENV"
          echo "TEMPLATE_SIA_TEST_IMAGE=$image" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-acceptance-model
      - name: Complete installed and export matrix
        id: installed
        shell: bash
        run: |
          set -euo pipefail
          set -o noclobber
          mkdir -p output/readiness/common-cli-originals
          original_status=0
          output/runtime-envs/3.14/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli \
            --installed --installed-workers 3 \
            --installed-interpreter "3.14=$PWD/output/runtime-envs/3.14/bin/python" \
            --installed-interpreter "3.15=$PWD/output/runtime-envs/3.15/bin/python" \
            --evidence-dir output/readiness/installed \
            > output/readiness/common-cli-originals/installed.stdout \
            2> output/readiness/common-cli-originals/installed.stderr || original_status=$?
          printf '%s\n' "$original_status" > output/readiness/common-cli-originals/installed.exit-code
          printf 'Installed/export matrix original exit: %s; receipt: output/readiness/installed/receipt.json\n' "$original_status"
          sha256sum output/readiness/common-cli-originals/installed.{stdout,stderr,exit-code}
          exit "$original_status"
      - name: Verify every original installed cell before dependent work
        run: >-
          output/runtime-envs/3.14/bin/python -m infrastructure.reporting.original_job_outcome
          --kind installed --receipt output/readiness/installed/receipt.json
      - name: Admit installed dependency providers and execute complete runtime matrix
        shell: bash
        run: |
          output/runtime-envs/3.14/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli \
            --prepare-runtime-providers --installed-receipt output/readiness/installed/receipt.json \
            > output/readiness/runtime-provider-input.json
          output/runtime-envs/3.14/bin/python - <<'PYTHON'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          providers = json.loads(Path("output/readiness/runtime-provider-input.json").read_text())
          wheels = [str(Path.cwd() / binding["path"]) for binding in providers["providers"].values()]
          for minor in ("3.14", "3.15"):
              interpreter = Path.cwd() / f"output/runtime-envs/{minor}/bin/python"
              if wheels:
                  subprocess.run(["uv", "pip", "install", "--offline", "--no-deps", "--python", str(interpreter), *wheels], check=True)
          command = [sys.executable, "scripts/gates/public_readiness.py", "--acceptance-matrix", "--project-workers", "3"]
          for minor in ("3.14", "3.15"):
              command += ["--python", f"{minor}={Path.cwd()}/output/runtime-envs/{minor}/bin/python"]
          command += providers["provider_wheel_arguments"]
          command += ["--evidence-dir", "output/readiness/projects"]
          originals = Path("output/readiness/common-cli-originals")
          originals.mkdir(exist_ok=True)
          stdout, stderr = originals / "runtime.stdout", originals / "runtime.stderr"
          with stdout.open("xb") as output, stderr.open("xb") as errors:
              original_status = subprocess.run(command, check=False, stdout=output, stderr=errors).returncode
          status = originals / "runtime.exit-code"
          with status.open("x") as output:
              output.write(f"{original_status}\n")
          print(f"Runtime matrix original exit: {original_status}; receipt: output/readiness/projects/receipt.json")
          for path in (stdout, stderr, status):
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              print(f"{digest}  {path}")
          raise SystemExit(original_status)
          PYTHON
      - name: Independently admit original Root export before transfer
        id: export_prepare
        run: |
          output/runtime-envs/3.14/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli \
            --prepare-transfer --export-receipt output/readiness/installed/receipt.json \
            > output/readiness/export-upload-input.json
          output/runtime-envs/3.14/bin/python -c 'import json,os;from pathlib import Path;v=json.loads(Path("output/readiness/export-upload-input.json").read_text());Path(os.environ["GITHUB_OUTPUT"]).open("a").write("upload_path="+v["upload_path"]+"\n")'
      - name: Actual public Root export upload
        id: export_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: root-candidate-export
          path: ${{ steps.export_prepare.outputs.upload_path }}
          if-no-files-found: error
          retention-days: 1
      - name: Actual same artifact download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.export_upload.outputs.artifact-id }}
          path: output/readiness/sandbox-download
      - name: Independently verify actual API and retrieved bytes
        env:
          UPLOAD_OUTPUTS: ${{ toJSON(steps.export_upload.outputs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          output/runtime-envs/3.14/bin/python -c 'import os;from pathlib import Path;Path("output/readiness/export-upload-outputs.json").write_text(os.environ["UPLOAD_OUTPUTS"])'
          output/runtime-envs/3.14/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli \
            --emit-transfer --export-receipt output/readiness/installed/receipt.json \
            --upload-outputs output/readiness/export-upload-outputs.json \
            --downloaded-directory output/readiness/sandbox-download \
            --repository "$GITHUB_REPOSITORY" --github-run-id "$GITHUB_RUN_ID" \
            --source-commit "$GITHUB_SHA" --evidence-dir output/readiness/sandbox-transfer
      - name: Stop only the owned model daemon and descendants
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, signal, subprocess, time
          from pathlib import Path
          def members(group):
              rows = subprocess.check_output(["ps", "-axo", "pid=,pgid=,lstart=,stat="], text=True)
              result = {}
              for line in rows.splitlines():
                  fields = line.split()
                  if len(fields) >= 8 and int(fields[1]) == group and not fields[7].startswith("Z"):
                      result[int(fields[0])] = " ".join(fields[2:7])
              return result
          directory = os.environ.get("TEMPLATE_ACCEPTANCE_MODEL_DIRECTORY")
          owner = Path(directory) / "daemon-owner.json" if directory else None
          if owner is not None and owner.is_file():
              record = json.loads(owner.read_text())
              group = record["pid"]
              known = {int(pid): birth for pid, birth in record["members"].items()}
              current = members(group)
              if current:
                  assert any(current.get(pid) == birth for pid, birth in known.items()), "Refuse an unverified or reused process group"
                  known.update(current)
                  os.killpg(group, signal.SIGTERM)
                  deadline = time.monotonic() + 5
                  while members(group) and time.monotonic() < deadline:
                      time.sleep(0.1)
                  current = members(group)
                  if current:
                      assert any(current.get(pid) == birth for pid, birth in known.items()), "Refuse a reused group during cleanup"
                      os.killpg(group, signal.SIGKILL)
                      deadline = time.monotonic() + 5
                      while members(group) and time.monotonic() < deadline:
                          time.sleep(0.1)
                  assert not members(group), "Owned daemon descendants remain alive"
              (Path(directory) / "daemon-cleanup.json").write_text(json.dumps({"owned_group": group, "live_members_remaining": members(group), "original_exit": 0}))
          PYTHON
      - name: Retain original source audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: required-source-common
          # Retain common-cli-originals/*.stdout, *.stderr and *.exit-code with
          # the unchanged installed/projects receipts and original member roots.
          path: output/readiness/
          if-no-files-found: error
          retention-days: 1

  auxiliary-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-python-env
      - name: Derive complete auxiliary project matrix from Source
        id: plan
        run: |
          set -euo pipefail
          matrix=$(.venv/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli --matrix-json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  auxiliary-original:
    needs: auxiliary-plan
    name: auxiliary-original (${{ matrix.cell }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.auxiliary-plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-python-env
      - name: Prepare the locked auxiliary environment
        run: uv sync --locked --inexact --group dev --group installed-build --group active-inference --group timeseries-bench --group rendering-pptx
      - name: Populate the locked build-tool cache for offline auxiliary fixtures
        run: |
          set -euo pipefail
          unset UV_FROZEN
          auxiliary_build_cache=$(mktemp -d "$RUNNER_TEMP/template-auxiliary-build-cache.XXXXXX")
          # Offline fixtures resolve hashed registry requirements. A restored
          # environment or URL-based lock sync alone does not prepare that cache.
          uv export --locked --only-group installed-build --no-emit-project --no-emit-local \
            --no-header --no-annotate --output-file "$auxiliary_build_cache/build.txt"
          uv export --project projects/templates/template_autoresearch_project --locked \
            --no-default-groups --no-emit-project --no-emit-local --no-header --no-annotate \
            --output-file "$auxiliary_build_cache/runtime.txt"
          for kind in build runtime; do
            uv venv --no-project --no-python-downloads --python .venv/bin/python "$auxiliary_build_cache/$kind"
            uv pip sync --no-config --no-build --require-hashes \
              --python "$auxiliary_build_cache/$kind/bin/python" "$auxiliary_build_cache/$kind.txt"
          done
          rm -r -- "$auxiliary_build_cache"
      - uses: ./.github/actions/setup-meta-provider
      - uses: ./.github/actions/setup-docs-lint
      - uses: ./.github/actions/setup-acceptance-documents
      - name: Prepare source-locked browser math dependencies
        run: .venv/bin/python -m infrastructure.reporting.native_dependency_preparation --repo-root .
      - name: Prepare pinned formal tools
        if: matrix.formal
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 60 --output "$RUNNER_TEMP/elan-init.sh" https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh
          echo "4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264  $RUNNER_TEMP/elan-init.sh" | shasum -a 256 --check --status
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for pin in projects/templates/template_active_inference/lean/lean-toolchain projects/templates/template_formal/formal/lean/lean-toolchain; do
            "$HOME/.elan/bin/elan" toolchain install "$(tr -d '[:space:]' < "$pin")"
          done
      - name: Prepare the declared Java launcher
        run: sudo apt-get install -y --no-install-recommends default-jre-headless
      - name: Prepare the exact immutable SIA sandbox image
        if: matrix.docker
        timeout-minutes: 10
        shell: bash
        env:
          SIA_SANDBOX_IMAGE: python@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
        run: |
          set -euo pipefail
          docker pull "$SIA_SANDBOX_IMAGE"
          image=$(docker image inspect --format '{{.Id}}' "$SIA_SANDBOX_IMAGE")
          echo "TEMPLATE_ACCEPTANCE_SIA_IMAGE_ID=$image" >> "$GITHUB_ENV"
          echo "TEMPLATE_SIA_TEST_IMAGE=$image" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-acceptance-model
        if: matrix.model
      - uses: ./.github/actions/setup-ci-execution-user
        with:
          docker: ${{ matrix.docker }}
      - name: Complete source-owned auxiliary project selection
        id: auxiliary
        continue-on-error: true
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user run
          --state "$RUNNER_TEMP/template-ci-execution/state.json" --
          .venv/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli
          --matrix-cell "${{ matrix.cell }}" --local-model smollm2:360m --docker-image-id "$TEMPLATE_ACCEPTANCE_SIA_IMAGE_ID"
          --auxiliary-workers 1
          --timeout-seconds 1800 --evidence-dir "output/readiness/auxiliary-linux/${{ matrix.cell }}"
      - name: Fail promptly for any unpassed project auxiliary obligation
        if: always()
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user run
          --state "$RUNNER_TEMP/template-ci-execution/state.json" --
          .venv/bin/python -m infrastructure.reporting.original_job_outcome
          --kind auxiliary --receipt "output/readiness/auxiliary-linux/${{ matrix.cell }}/receipt.json"
      - name: Stop only the owned model daemon and descendants
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, signal, subprocess, time
          from pathlib import Path
          def members(group):
              rows = subprocess.check_output(["ps", "-axo", "pid=,pgid=,lstart=,stat="], text=True)
              result = {}
              for line in rows.splitlines():
                  fields = line.split()
                  if len(fields) >= 8 and int(fields[1]) == group and not fields[7].startswith("Z"):
                      result[int(fields[0])] = " ".join(fields[2:7])
              return result
          directory = os.environ.get("TEMPLATE_ACCEPTANCE_MODEL_DIRECTORY")
          owner = Path(directory) / "daemon-owner.json" if directory else None
          if owner is not None and owner.is_file():
              record = json.loads(owner.read_text())
              group = record["pid"]
              known = {int(pid): birth for pid, birth in record["members"].items()}
              current = members(group)
              if current:
                  assert any(current.get(pid) == birth for pid, birth in known.items()), "Refuse an unverified or reused process group"
                  known.update(current)
                  os.killpg(group, signal.SIGTERM)
                  deadline = time.monotonic() + 5
                  while members(group) and time.monotonic() < deadline:
                      time.sleep(0.1)
                  current = members(group)
                  if current:
                      assert any(current.get(pid) == birth for pid, birth in known.items()), "Refuse a reused group during cleanup"
                      os.killpg(group, signal.SIGKILL)
                      deadline = time.monotonic() + 5
                      while members(group) and time.monotonic() < deadline:
                          time.sleep(0.1)
                  assert not members(group), "Owned daemon descendants remain alive"
              (Path(directory) / "daemon-cleanup.json").write_text(json.dumps({"owned_group": group, "live_members_remaining": members(group), "original_exit": 0}))
          PYTHON
      - name: Export original Linux readiness bytes for the artifact reader
        if: always()
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user export
          --state "$RUNNER_TEMP/template-ci-execution/state.json"
      - name: Retain original auxiliary audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: required-source-auxiliary-linux-${{ matrix.cell }}
          path: ${{ env.TEMPLATE_CI_ARTIFACT_DIRECTORY }}/auxiliary-linux/${{ matrix.cell }}/
          # Portable pipeline custody includes hidden original execution/cache bytes.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Retained until the sharded cells are enabled: the single-job roster form
  # cannot finish (one project measured 10264.8 s, 25 cannot fit one clock).
  native-original:
    # TODO(native-sharding): delete once native-original-cell runs.
    if: vars.NATIVE_SHARDING_CELLS != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14.4"
      # The roster-wide lane prepares every public exemplar and installs each one's
      # own lock, so a Root-only warm cannot serve it either. With no `matrix-cell`
      # the readiness action derives the full roster after its own `uv sync`, which
      # is the only point where an interpreter exists.
      - uses: ./.github/actions/setup-native-installed-readiness
      - name: Strict rendered publication evidence gate
        # The native worker refuses on this same strict rendered predicate before
        # any stage executes, so run it first: a stale receipt fails in seconds
        # instead of after the bounded native lifecycle. It skips and weakens
        # nothing; the lane still owns every native check.
        #
        # --rendered is deliberately NOT asserted here, for the same reason as in
        # platform-native-preflight.yml: rendered receipts are rebound only by
        # rebind.yml, which is dispatch-only and acts on the tip of origin/main.
        # Asserting a current rendered receipt inside a dispatch-only acceptance
        # run demands a rebind this run cannot perform. Every source, methods,
        # evidence, figure, artifact and placeholder check below still blocks.
        run: >-
          .venv/bin/python -m infrastructure.validation.cli publication-audit --all-public
          --strict --require-figure-accessibility --format markdown
      - name: Original authenticated installed native format inventory
        id: native
        run: >-
          .venv/bin/python -m infrastructure.reporting.native_installed_launcher --mode original
          --source-root "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA"
          --source-identity "$(.venv/bin/python -c 'from pathlib import Path;from infrastructure.reporting.readiness_receipts import source_fingerprint;print(source_fingerprint(Path.cwd()))')"
          --python "$GITHUB_WORKSPACE/.venv/bin/python" --uv "$(command -v uv)"
          --expected-platform Linux --timeout 14400
          --mermaid-package-root "$GITHUB_WORKSPACE/node_modules/@mermaid-js/mermaid-cli"
          --mermaid-dependency-root "$GITHUB_WORKSPACE/node_modules"
          --mermaid-node-executable "$(command -v node)"
          --mermaid-chrome-executable "$CHROME_EXECUTABLE_PATH"
          --office-font-directory /usr/share/fonts/truetype
          --office-font-directory "/usr/local/share/fonts/template-acceptance-juliamono"
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --current-root "$RUNNER_TEMP/template-native-original-root"
          --scratch "$RUNNER_TEMP/template-native-original-scratch"
          --epubcheck-jar "$TEMPLATE_NATIVE_EPUBCHECK" --java-executable "$TEMPLATE_NATIVE_JAVA"
      - name: Retain exact independently admitted native shards
        uses: ./.github/actions/upload-readiness-shards
        with:
          repo-root: ${{ runner.temp }}/template-native-original-root
          directory: ${{ runner.temp }}/template-native-original-root/output/readiness/native-transport
          kind: native
          # This roster lane's only output is the release artifact, and every one
          # of this workflow's 31 failures retained its transport correctly and
          # then expired after one day before anyone read it. The refusal that
          # blocks every release has therefore never been diagnosed. Thirty days
          # covers a release cycle. The per-cell indexes below keep one day:
          # they are bulk, and they are not the diagnostic.
          retention-days: 30
      - name: Preserve failed original raw and Code evidence
        if: always() && steps.native.outcome == 'failure'
        run: >-
          .venv/bin/python -m infrastructure.reporting.native_failed_transport
          --repo-root "$GITHUB_WORKSPACE" --mirror "$RUNNER_TEMP/template-native-original-root"
          --scratch "$RUNNER_TEMP/template-native-original-scratch"
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --revision "$GITHUB_SHA"
      - name: Retain bounded failed-native diagnostics without acceptance
        if: always() && steps.native.outcome == 'failure'
        uses: ./.github/actions/upload-readiness-shards
        with:
          repo-root: ${{ github.workspace }}
          directory: ${{ github.workspace }}/output/readiness/failed-native-transport
          kind: failed-native
          # Failure evidence, not a primary acceptance index. Every one of this
          # workflow's 31 failures retained its transport and then expired after
          # one day before anyone read it, so the refusal that blocks every
          # release has never been diagnosed. Thirty days covers a release cycle;
          # primary per-cell indexes keep their one-day default.
          retention-days: 30


  # The sharded native lane selects every canonical project from Source and
  # admits only a complete cell union. NATIVE_SHARDING_CELLS selects this lane;
  # the separately gated monolithic job remains the supported fallback.
  native-plan:
    if: vars.NATIVE_SHARDING_CELLS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-python-env
      - name: Derive the complete public project matrix from Source
        id: plan
        run: |
          set -euo pipefail
          # Reuse the Source-owned auxiliary matrix emitter. The `cell` values
          # are bare project names; `root` is not a project and is excluded.
          matrix=$(.venv/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli --matrix-json \
            | jq -c '{include: [.include[] | select(.cell != "root")]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  native-original-cell:
    needs: native-plan
    name: native-original-cell (${{ matrix.cell }})
    # Explicit selection keeps a missing cell from being mistaken for a pass.
    if: vars.NATIVE_SHARDING_CELLS == 'true'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.native-plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    # 14,400 s launcher clock plus preparation and transport margin. One project
    # measured 10,264.8 s without completing in run 41539538215.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14.4"
      # Offline cache scopes are derived inside the readiness action, after its own
      # `uv sync`. Resolving them in a workflow step here needs an interpreter that
      # does not exist yet: run 41952164694 died at `.venv/bin/python: No such file
      # or directory` (exit 127) on all 25 cells. The action takes `matrix-cell`
      # for exactly this, so warming and preparation share one predicate without a
      # step ordering that cannot work.
      - uses: ./.github/actions/setup-native-installed-readiness
        with:
          matrix-cell: ${{ matrix.cell }}
      - name: Keep the declared capacity before native allocation
        run: |
          set -euo pipefail
          free_before=$(df -k --output=avail / | tail -n 1)
          for path in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/Go; do
            if [ -e "$path" ]; then
              sudo rm -rf --one-file-system -- "$path" || echo "reclaim-retained=$path"
            fi
          done
          free_after=$(df -k --output=avail / | tail -n 1)
          echo "reclaimed_kib=$((free_after - free_before)) free_kib=$free_after"
          if [ "$free_after" -lt 10485760 ]; then
            echo "::warning::free space is below the declared 10 GiB preparation threshold"
          fi
      - name: Original authenticated installed native format inventory (one project)
        id: native
        run: >-
          .venv/bin/python -m infrastructure.reporting.native_installed_launcher --mode original
          --matrix-cell "${{ matrix.cell }}"
          --source-root "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA"
          --source-identity "$(.venv/bin/python -c 'from pathlib import Path;from infrastructure.reporting.readiness_receipts import source_fingerprint;print(source_fingerprint(Path.cwd()))')"
          --python "$GITHUB_WORKSPACE/.venv/bin/python" --uv "$(command -v uv)"
          --expected-platform Linux --timeout 14400
          --mermaid-package-root "$GITHUB_WORKSPACE/node_modules/@mermaid-js/mermaid-cli"
          --mermaid-dependency-root "$GITHUB_WORKSPACE/node_modules"
          --mermaid-node-executable "$(command -v node)"
          --mermaid-chrome-executable "$CHROME_EXECUTABLE_PATH"
          --office-font-directory /usr/share/fonts/truetype
          --office-font-directory "/usr/local/share/fonts/template-acceptance-juliamono"
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --current-root "$RUNNER_TEMP/template-native-original-root"
          --scratch "$RUNNER_TEMP/template-native-original-scratch"
          --epubcheck-jar "$TEMPLATE_NATIVE_EPUBCHECK" --java-executable "$TEMPLATE_NATIVE_JAVA"
      - name: Retain exact independently admitted native shards (one project)
        uses: ./.github/actions/upload-readiness-shards
        with:
          repo-root: ${{ runner.temp }}/template-native-original-root
          directory: ${{ runner.temp }}/template-native-original-root/output/readiness/native-cell-transports/${{ matrix.cell }}
          kind: native
          cell: ${{ matrix.cell }}
          retention-days: 30
      - name: Preserve failed original raw and Code evidence
        if: always() && steps.native.outcome == 'failure'
        run: >-
          .venv/bin/python -m infrastructure.reporting.native_failed_transport
          --repo-root "$GITHUB_WORKSPACE" --mirror "$RUNNER_TEMP/template-native-original-root"
          --scratch "$RUNNER_TEMP/template-native-original-scratch"
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --revision "$GITHUB_SHA"
      - name: Retain bounded failed-native diagnostics without acceptance
        if: always() && steps.native.outcome == 'failure'
        uses: ./.github/actions/upload-readiness-shards
        with:
          repo-root: ${{ github.workspace }}
          directory: ${{ github.workspace }}/output/readiness/failed-native-transport
          kind: failed-native
          # Failure evidence, not a primary acceptance index. Every one of this
          # workflow's 31 failures retained its transport and then expired after
          # one day before anyone read it, so the refusal that blocks every
          # release has never been diagnosed. Thirty days covers a release cycle;
          # primary per-cell indexes keep their one-day default.
          retention-days: 30

  complete:
    needs: [root-original, common-original, auxiliary-original, native-plan, native-original-cell]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14.4"
      - name: Read same-run original common DATA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: required-source-common
          path: output/readiness
      - name: Read same-run original macOS auxiliary DATA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: required-source-auxiliary-darwin
          path: output/readiness/auxiliary-darwin
      - uses: ./.github/actions/setup-native-installed-readiness
      - name: Require the complete native cell union before any admission
        if: vars.NATIVE_SHARDING_CELLS == 'true'
        # Fail closed with a named project. This is the guard the roster-wide
        # lane lacked: stopping early must never look like a 24-of-25 candidate.
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_MATRIX: ${{ needs.native-plan.outputs.matrix }}
          NATIVE_JOB_RESULT: ${{ needs.native-original-cell.result }}
        run: |
          set -euo pipefail
          expected=$(jq -r '.include[].cell' <<< "$NATIVE_MATRIX" | sort)
          expected_count=$(wc -l <<< "$expected" | tr -d ' ')
          echo "expected native cells: $expected_count"
          if [ "$NATIVE_JOB_RESULT" != "success" ]; then
            echo "::error::native cell lane result is '$NATIVE_JOB_RESULT', not success"
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' > "$RUNNER_TEMP/native-artifacts.txt"
          # A cell uploads one primary index plus its own `-shard-NNNN` members.
          # Only the primary names the cell, so the shard members are excluded:
          # counting them would report every shard as an undeclared cell.
          actual=$(grep -o '^required-source-native-cell-.*' "$RUNNER_TEMP/native-artifacts.txt" \
            | grep -v -- '-shard-[0-9]\{4\}$' \
            | sed 's/^required-source-native-cell-//' | sort || true)
          # comm needs two file operands; a here-string is stdin, not operand one.
          missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual" | sed '/^$/d'))
          extra=$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual" | sed '/^$/d'))
          if [ -n "$missing" ]; then
            echo "::error::missing native cell artifacts for: $(tr '\n' ' ' <<< "$missing")"
            exit 1
          fi
          if [ -n "$extra" ]; then
            echo "::error::unexpected native cell artifacts for: $(tr '\n' ' ' <<< "$extra")"
            exit 1
          fi
          echo "complete native cell union: $expected_count of $expected_count"
      - name: Note the disabled native cell lane
        if: vars.NATIVE_SHARDING_CELLS != 'true'
        run: |
          echo "::warning::native cell lane disabled; native-original is the active lane"
      - name: Independently admit complete candidate through fresh installed Source
        id: reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .venv/bin/python -m infrastructure.reporting.native_installed_launcher --mode reader
          ${{ vars.NATIVE_SHARDING_CELLS == 'true' && '--native-cell-union' || '' }}
          --source-root "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA"
          --source-identity "$(.venv/bin/python -c 'from pathlib import Path;from infrastructure.reporting.readiness_receipts import source_fingerprint;print(source_fingerprint(Path.cwd()))')"
          --python "$GITHUB_WORKSPACE/.venv/bin/python" --uv "$(command -v uv)"
          --expected-platform Linux --timeout 14400
          --mermaid-package-root "$GITHUB_WORKSPACE/node_modules/@mermaid-js/mermaid-cli"
          --mermaid-dependency-root "$GITHUB_WORKSPACE/node_modules"
          --mermaid-node-executable "$(command -v node)"
          --mermaid-chrome-executable "$CHROME_EXECUTABLE_PATH"
          --office-font-directory /usr/share/fonts/truetype
          --office-font-directory "/usr/local/share/fonts/template-acceptance-juliamono"
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --current-root "$RUNNER_TEMP/template-native-reader-root"
          --scratch "$RUNNER_TEMP/template-native-reader-scratch" --stage-bundle
          --epubcheck-jar "$TEMPLATE_NATIVE_EPUBCHECK" --java-executable "$TEMPLATE_NATIVE_JAVA"
          --receipt output/readiness/projects/receipt.json
          --receipt output/readiness/installed/receipt.json
          --receipt output/readiness/sandbox-transfer/receipt.json
          --auxiliary-receipt darwin=output/readiness/auxiliary-darwin/receipt.json
          --root-receipt linux/3.14=output/readiness/root-linux-3.14/receipt.json
          --root-receipt linux/3.15=output/readiness/root-linux-3.15/receipt.json
          --root-receipt darwin/3.14=output/readiness/root-darwin-3.14/receipt.json
          --root-receipt darwin/3.15=output/readiness/root-darwin-3.15/receipt.json
      - name: Complete passed exact-SHA candidate transport only
        id: candidate_transport
        uses: ./.github/actions/upload-readiness-shards
        with:
          repo-root: ${{ runner.temp }}/template-native-reader-root
          directory: ${{ runner.temp }}/template-native-reader-root/output/readiness/candidate-transport
          kind: candidate
      - name: Preserve failed reader raw and Code evidence
        if: always() && steps.reader.outcome == 'failure'
        run: >-
          .venv/bin/python -m infrastructure.reporting.native_failed_transport
          --repo-root "$GITHUB_WORKSPACE" --mirror "$RUNNER_TEMP/template-native-reader-root"
          --scratch "$RUNNER_TEMP/template-native-reader-scratch" --kind failed-reader
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --revision "$GITHUB_SHA"
      - name: Retain bounded failed-reader diagnostics without acceptance
        id: diagnostic_transport
        if: always() && steps.reader.outcome == 'failure'
        uses: ./.github/actions/upload-readiness-shards
        with:
          repo-root: ${{ github.workspace }}
          directory: ${{ github.workspace }}/output/readiness/failed-reader-transport
          kind: failed-reader
          # Failure evidence for the release-critical reader lane: the same
          # one-day expiry is why the refusal behind 31 failed releases has no
          # readable trace. Keep it past a release cycle.
          retention-days: 30
      - name: Summarize required acceptance outcomes
        if: always()
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          READER_OUTCOME: ${{ steps.reader.outcome }}
          CANDIDATE_TRANSPORT: ${{ steps.candidate_transport.outcome }}
          DIAGNOSTIC_TRANSPORT: ${{ steps.diagnostic_transport.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # Backticks in printf formats are literal Markdown.
          {
            printf '### Required acceptance\n\nSource: `%s` · job: `%s`\n\n' "$GITHUB_SHA" "$JOB_STATUS"
            printf '| Operation | Outcome |\n| --- | --- |\n'
            jq -r 'to_entries[] | "| Original observation job: " + .key + " | " + .value.result + " |"' <<< "$NEEDS_JSON"
            printf '| Fresh installed candidate readback | %s |\n' "${READER_OUTCOME:-not run}"
            printf '| Passed candidate transport | %s |\n' "${CANDIDATE_TRANSPORT:-not run}"
            printf '| Failed-reader diagnostic transport | %s |\n\n' "${DIAGNOSTIC_TRANSPORT:-not run}"
            printf 'Original job outcomes are diagnostic; the fresh installed reader admits the complete candidate. Failed-reader diagnostics do not constitute acceptance.\n\n'
            printf '[Retained run artifacts](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
