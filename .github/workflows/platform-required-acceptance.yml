name: Platform required acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-required-acceptance-${{ github.run_id }}
  cancel-in-progress: false

env:
  UV_FROZEN: "true"
  MPLBACKEND: Agg
  OLLAMA_SKIP_TEST_MODEL_PULL: "1"

jobs:
  root-original:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        include:
          - runner: ubuntu-latest
            host: linux
          - runner: macos-latest
            host: darwin
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare selected locked environment
        run: uv sync --locked --inexact --group dev --group timeseries-bench --group rendering-pptx --python '${{ matrix.python }}'
      - name: Prepare declared public codebase and synthetic time-series fixtures
        timeout-minutes: 15
        run: |
          .venv/bin/python scripts/fixtures/download_real_codebases.py
          .venv/bin/python - <<'PY'
          from scripts.fixtures.download_timeseries_benchmarks import generate_synthetic_timeseries
          generate_synthetic_timeseries()
          PY
      - uses: ./.github/actions/setup-docs-lint
      - name: Prepare source-declared native document tools
        run: bash scripts/shell/setup-system-deps.sh
      - name: Prepare PDF text reader
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          else
            brew install poppler
            echo /Library/TeX/texbin >> "$GITHUB_PATH"
          fi
      - name: Original complete Root observation
        continue-on-error: true
        env:
          HOST: ${{ matrix.host }}
          MINOR: ${{ matrix.python }}
        run: >-
          .venv/bin/python -m infrastructure.project.public_acceptance_root
          --python "$MINOR=$PWD/.venv/bin/python" --mode live
          --evidence-dir "output/readiness/root-$HOST-$MINOR"
      - name: Original macOS process and rendering obligations
        if: matrix.host == 'darwin' && matrix.python == '3.14'
        continue-on-error: true
        run: >-
          .venv/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli
          --gate root:macos:process --gate root:macos:rendering
          --evidence-dir output/readiness/auxiliary-darwin
      - name: Retain original source audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: required-source-root-${{ runner.os }}-${{ matrix.python }}
          path: |
            output/readiness/
            !output/readiness/auxiliary-darwin/**
          if-no-files-found: error
          retention-days: 1
      - name: Retain original designated macOS auxiliary audit
        if: always() && matrix.host == 'darwin' && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: required-source-auxiliary-darwin
          path: output/readiness/auxiliary-darwin/
          if-no-files-found: error
          retention-days: 1

  common-original:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Prepare three locked environments
        shell: bash
        run: |
          for minor in 3.12 3.13 3.14; do
            UV_PROJECT_ENVIRONMENT="output/runtime-envs/$minor" uv sync --locked --group dev --python "$minor"
          done
      - uses: ./.github/actions/setup-docs-lint
      - name: Prepare source-declared native document tools
        run: bash scripts/shell/setup-system-deps.sh
      - name: Prepare PDF text reader
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          else
            brew install poppler
            echo /Library/TeX/texbin >> "$GITHUB_PATH"
          fi
      - name: Complete installed and export matrix
        continue-on-error: true
        run: >-
          output/runtime-envs/3.14/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli
          --installed
          --installed-interpreter "3.12=$PWD/output/runtime-envs/3.12/bin/python"
          --installed-interpreter "3.13=$PWD/output/runtime-envs/3.13/bin/python"
          --installed-interpreter "3.14=$PWD/output/runtime-envs/3.14/bin/python"
          --evidence-dir output/readiness/installed
      - name: Admit installed dependency providers and execute complete runtime matrix
        continue-on-error: true
        shell: bash
        run: |
          output/runtime-envs/3.14/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli \
            --prepare-runtime-providers --installed-receipt output/readiness/installed/receipt.json \
            > output/readiness/runtime-provider-input.json
          output/runtime-envs/3.14/bin/python - <<'PYTHON'
          import json, subprocess, sys
          from pathlib import Path
          providers = json.loads(Path("output/readiness/runtime-provider-input.json").read_text())
          command = [sys.executable, "scripts/gates/public_readiness.py", "--acceptance-matrix", "--project-workers", "3"]
          for minor in ("3.12", "3.13", "3.14"):
              command += ["--python", f"{minor}={Path.cwd()}/output/runtime-envs/{minor}/bin/python"]
          command += providers["provider_wheel_arguments"]
          command += ["--evidence-dir", "output/readiness/projects"]
          raise SystemExit(subprocess.run(command, check=False).returncode)
          PYTHON
      - name: Every remaining source-owned obligation
        continue-on-error: true
        run: >-
          output/runtime-envs/3.14/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli
          --all --timeout-seconds 1800 --evidence-dir output/readiness/auxiliary
      - name: Independently admit original Root export before transfer
        id: export_prepare
        run: |
          output/runtime-envs/3.14/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli \
            --prepare-transfer --export-receipt output/readiness/installed/receipt.json \
            > output/readiness/export-upload-input.json
          output/runtime-envs/3.14/bin/python -c 'import json,os;from pathlib import Path;v=json.loads(Path("output/readiness/export-upload-input.json").read_text());Path(os.environ["GITHUB_OUTPUT"]).open("a").write("upload_path="+v["upload_path"]+"\n")'
      - name: Actual public Root export upload
        id: export_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: root-candidate-export
          path: ${{ steps.export_prepare.outputs.upload_path }}
          if-no-files-found: error
          retention-days: 1
      - name: Actual same artifact download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.export_upload.outputs.artifact-id }}
          path: output/readiness/sandbox-download
      - name: Independently verify actual API and retrieved bytes
        env:
          UPLOAD_OUTPUTS: ${{ toJSON(steps.export_upload.outputs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          output/runtime-envs/3.14/bin/python -c 'import os;from pathlib import Path;Path("output/readiness/export-upload-outputs.json").write_text(os.environ["UPLOAD_OUTPUTS"])'
          output/runtime-envs/3.14/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli \
            --emit-transfer --export-receipt output/readiness/installed/receipt.json \
            --upload-outputs output/readiness/export-upload-outputs.json \
            --downloaded-directory output/readiness/sandbox-download \
            --repository "$GITHUB_REPOSITORY" --github-run-id "$GITHUB_RUN_ID" \
            --source-commit "$GITHUB_SHA" --evidence-dir output/readiness/sandbox-transfer
      - name: Retain original source audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: required-source-common
          path: output/readiness/
          if-no-files-found: error
          retention-days: 1

  native-original:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv sync --locked --inexact --group dev --group rendering-pptx
      - uses: ./.github/actions/setup-docs-lint
      - name: Prepare source-declared native document tools
        run: bash scripts/shell/setup-system-deps.sh
      - name: Prepare PDF text reader
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          else
            brew install poppler
            echo /Library/TeX/texbin >> "$GITHUB_PATH"
          fi
      - name: Prepare official native reader tools
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo -n apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 update
          sudo -n apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress calibre default-jre-headless zbar-tools
          libreoffice --headless --version
          ebook-convert --version
          zbarimg --version
          java_executable="$(readlink -f "$(command -v java)")"
          "$java_executable" -version
          .venv/bin/python scripts/shell/prepare_native_epubcheck.py --destination "$RUNNER_TEMP/template-native-tools"
          "$java_executable" -jar "$RUNNER_TEMP/template-native-tools/epubcheck-5.4.0/epubcheck.jar" --version
          echo "TEMPLATE_NATIVE_JAVA=$java_executable" >> "$GITHUB_ENV"
          echo "TEMPLATE_NATIVE_EPUBCHECK=$RUNNER_TEMP/template-native-tools/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"
      - name: Prepare source-locked official browser math dependencies
        timeout-minutes: 6
        run: .venv/bin/python -m infrastructure.reporting.native_dependency_preparation --repo-root .
      - name: Original complete native format inventory
        continue-on-error: true
        run: >-
          .venv/bin/python -m infrastructure.reporting.native_format_acceptance
          --repo-root . --timeout 14400 --evidence-dir output/readiness/native
          --epubcheck-jar "$TEMPLATE_NATIVE_EPUBCHECK" --java-executable "$TEMPLATE_NATIVE_JAVA"
      - name: Retain original native source audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: required-source-native
          path: output/readiness/
          if-no-files-found: error
          retention-days: 1

  complete:
    needs: [root-original, common-original, native-original]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv sync --locked --group dev
      - name: Read same-run original common evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: required-source-common
          path: output/readiness
      - name: Read same-run original native evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: required-source-native
          path: output/readiness
      - name: Read same-run original macOS auxiliary evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: required-source-auxiliary-darwin
          path: output/readiness/auxiliary-darwin
      - name: Independently retrieve and bind six original Root artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python - <<'PYTHON'
          import os
          from pathlib import Path
          from infrastructure.project.public_hosted_origin import collect_hosted_origin
          collect_hosted_origin(Path.cwd(), Path("output/readiness/hosted-origin"),
              repository=os.environ["GITHUB_REPOSITORY"], run_id=int(os.environ["GITHUB_RUN_ID"]),
              head_sha=os.environ["GITHUB_SHA"], timeout=600)
          PYTHON
      - name: Independently admit every source-owned requirement
        run: >-
          .venv/bin/python -m infrastructure.reporting.required_acceptance_aggregate
          --revision "$GITHUB_SHA" --stage-bundle
          --hosted-origin-manifest output/readiness/hosted-origin/origin.json
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --receipt output/readiness/projects/receipt.json
          --receipt output/readiness/installed/receipt.json
          --receipt output/readiness/native/receipt.json
          --auxiliary-receipt linux=output/readiness/auxiliary/receipt.json
          --auxiliary-receipt darwin=output/readiness/auxiliary-darwin/receipt.json
          --receipt output/readiness/sandbox-transfer/receipt.json
          --root-receipt linux/3.12=output/readiness/root-linux-3.12/receipt.json
          --root-receipt linux/3.13=output/readiness/root-linux-3.13/receipt.json
          --root-receipt linux/3.14=output/readiness/root-linux-3.14/receipt.json
          --root-receipt darwin/3.12=output/readiness/root-darwin-3.12/receipt.json
          --root-receipt darwin/3.13=output/readiness/root-darwin-3.13/receipt.json
          --root-receipt darwin/3.14=output/readiness/root-darwin-3.14/receipt.json
      - name: Complete passed exact-SHA acceptance only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-required-acceptance
          path: output/readiness/hosted-bundle/
          if-no-files-found: error
          retention-days: 1
