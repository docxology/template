name: Prepare coordinated publication refresh

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact dispatched Source commit; must equal this workflow revision
        type: string
        required: true
      expected_version:
        description: Final coordinated Root version already present in Source
        type: string
        required: true
      mode:
        description: Regenerate all canonical publications and dependent Pitch analysis, or revalidate unchanged outputs
        type: choice
        options: ["refresh", "rebind-only"]
        default: "refresh"
      workers:
        description: One worker preserves strict shared-account process observation
        type: choice
        options: ["1"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: coordinated-publication-refresh-${{ github.sha }}
  cancel-in-progress: false

env:
  UV_FROZEN: "true"
  MPLBACKEND: Agg

jobs:
  refresh:
    name: Prepare reviewed publication output patch
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      REFRESH_MODE: ${{ inputs.mode }}
    permissions:
      contents: read
    steps:
      - name: Admit the exact dispatched Source
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || [ "$REQUESTED_SOURCE" != "$GITHUB_SHA" ]; then
            echo 'source_sha must equal this exact dispatched workflow revision' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      - name: Reconcile the exact locked Root
        run: uv sync --locked --group dev --group installed-build --group active-inference --group rendering --group rendering-pptx
      - name: Prepare Source-pinned native formats, Lean and provider dependencies
        uses: ./.github/actions/setup-native-installed-readiness
      - uses: ./.github/actions/setup-ci-execution-user
      - name: Run every coordinated phase under the fresh unprivileged execution account
        id: coordinated
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          REFRESH_WORKERS: ${{ inputs.workers }}
          REFRESH_DIRECTORY: ${{ runner.temp }}/template-ci-execution/artifacts/coordinated-publication-refresh
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user run
          --state "$RUNNER_TEMP/template-ci-execution/state.json" --
          .venv/bin/python -m infrastructure.publishing.publication_refresh
          --directory "$REFRESH_DIRECTORY" --mode "$REFRESH_MODE"
          run --source-sha "$REQUESTED_SOURCE" --expected-version "$EXPECTED_VERSION"
          --jobs "$REFRESH_WORKERS"
      - name: Retain the verified patch for ordinary reviewed PR integration
        if: steps.coordinated.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coordinated-publication-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/template-ci-execution/artifacts/coordinated-publication-refresh/review/
          if-no-files-found: error
          retention-days: 30
      - name: Retain original diagnostics separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coordinated-publication-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/template-ci-execution/artifacts/coordinated-publication-refresh/diagnostics/
            ${{ runner.temp }}/template-ci-execution/artifacts/coordinated-publication-refresh/*.json
            output/readiness/publication-refresh/
          if-no-files-found: ignore
          retention-days: 30
