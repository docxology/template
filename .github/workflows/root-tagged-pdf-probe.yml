name: Root tagged PDF capability probe

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact dispatch commit; must equal this workflow revision
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: root-tagged-pdf-probe-${{ github.run_id }}
  cancel-in-progress: false

env:
  UV_FROZEN: "true"
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tagged-pdf:
    name: Tagged PDF (${{ matrix.host }}, ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, host: linux, python: "3.14"}
          - {runner: ubuntu-24.04, host: linux, python: "3.15"}
          - {runner: macos-latest, host: darwin, python: "3.14"}
          - {runner: macos-latest, host: darwin, python: "3.15"}
    steps:
      - name: Admit the exact workflow revision
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] && [ "$REQUESTED_SOURCE" = "$GITHUB_SHA" ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          submodules: true
          persist-credentials: false
      - name: Prove the actual checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare the own Source-locked Root environment
        run: >-
          uv sync --locked --inexact --group dev --group installed-build
          --group active-inference --group timeseries-bench --group rendering-pptx
          --python '${{ matrix.python }}'
      - uses: ./.github/actions/setup-acceptance-documents
      - uses: ./.github/actions/setup-ci-execution-user
        if: runner.os == 'Linux'
      - name: Run the unchanged tagged PDF family and refuse skips
        id: probe
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        env:
          HOST: ${{ matrix.host }}
          MINOR: ${{ matrix.python }}
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/root-tagged-pdf-cli-$HOST-$MINOR"
          mkdir "$original"
          probe=$(cat <<'PYTHON'
          import hashlib, json, os, platform, stat, subprocess, sys, tempfile, tomllib
          import xml.etree.ElementTree as ET
          from importlib.metadata import version
          from pathlib import Path
          import infrastructure

          root = Path.cwd().resolve(strict=True)
          out = root / "output/readiness/root-tagged-pdf-probe" / f"{os.environ['HOST']}-{os.environ['MINOR']}"
          out.mkdir(parents=True, exist_ok=False)
          scratch = Path(tempfile.mkdtemp(prefix="root-tagged-pdf-case-", dir=os.environ["RUNNER_TEMP"]))
          assert not scratch.is_relative_to(root) and not root.is_relative_to(scratch)
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], stdin=subprocess.DEVNULL, text=True).strip()
          assert source == os.environ["GITHUB_SHA"]
          origin = Path(infrastructure.__file__).resolve(strict=True)
          assert origin == root / "infrastructure/__init__.py"
          sdk = version("research-project-template")
          assert sdk == infrastructure.__version__ == tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["MINOR"]
          node = "tests/infra_tests/rendering/test_figure_alt_real_pandoc.py::test_registry_alt_reaches_real_tagged_pdf_structure_tree"
          argv = [sys.executable, "-B", "-m", "pytest", "-o", "addopts=", "--import-mode=importlib", "--strict-markers", "--no-cov", "-q", "--junitxml", str(out / "junit.xml"), "--basetemp", str(scratch / "cases"), node]
          context = {"source_sha": source, "source_root": str(root), "python": platform.python_version(), "sdk_version": sdk, "sdk_origin": str(origin), "argv": argv, "runtime_acceptance": False}
          (out / "invocation.json").write_text(json.dumps(context, indent=2) + "\n")
          env = dict(os.environ, PYTEST_ADDOPTS="", PYTHONDONTWRITEBYTECODE="1")
          with (out / "stdout.raw").open("xb") as stdout, (out / "stderr.raw").open("xb") as stderr:
              completed = subprocess.run(argv, stdin=subprocess.DEVNULL, stdout=stdout, stderr=stderr, env=env, check=False)
          (out / "exit-code").write_text(f"{completed.returncode}\n")
          retained = []
          for path in sorted(scratch.rglob("*")):
              if path.suffix not in {".tex", ".log", ".pdf", ".aux", ".png", ".json"} or path.is_symlink():
                  continue
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode), "case diagnostic is not a regular file"
              assert len(retained) < 64 and info.st_size <= 4 * 1024 * 1024, "case diagnostic bound exceeded"
              raw = path.read_bytes()
              assert len(raw) == info.st_size and sum(item["bytes"] for item in retained) + len(raw) <= 16 * 1024 * 1024, "case diagnostic total exceeded"
              relative = path.relative_to(scratch)
              target = out / "case-files" / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              retained.append({"path": relative.as_posix(), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()})
          (out / "case-files.json").write_text(json.dumps(retained, indent=2) + "\n")
          assert completed.returncode == 0, f"original pytest exit: {completed.returncode}"
          report = out / "junit.xml"
          assert report.is_file() and not report.is_symlink() and report.stat().st_size <= 2 * 1024 * 1024
          document = ET.parse(report).getroot()
          assert document.tag == "testsuites" and len(document) == 1
          suite = document[0]
          assert suite.tag == "testsuite" and all(suite.get(key) == value for key, value in {"tests": "1", "failures": "0", "errors": "0", "skipped": "0"}.items()), "exactly one passing, unskipped test is required"
          cases = list(suite.iter("testcase"))
          assert len(cases) == 1 and cases[0].get("name") == node.split("::")[1]
          assert cases[0].get("classname") == "tests.infra_tests.rendering.test_figure_alt_real_pandoc"
          assert not any(list(case.iter(tag)) for case in cases for tag in ("failure", "error", "skipped"))
          (out / "probe.json").write_text(json.dumps({"source_sha": source, "passed": True, "runtime_acceptance": False}) + "\n")
          PYTHON
          )
          command=(.venv/bin/python -B -c "$probe")
          original_status=0
          if [ "$RUNNER_OS" = Linux ]; then
            .venv/bin/python -m infrastructure.core.testing.ci_execution_user run \
              --state "$RUNNER_TEMP/template-ci-execution/state.json" -- "${command[@]}" \
              > "$original/stdout.raw" 2> "$original/stderr.raw" || original_status=$?
          else
            "${command[@]}" > "$original/stdout.raw" 2> "$original/stderr.raw" || original_status=$?
          fi
          printf '%s\n' "$original_status" > "$original/exit-code"
          exit "$original_status"
      - name: Export original Linux probe bytes
        id: linux_export
        if: always() && runner.os == 'Linux'
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user export
          --state "$RUNNER_TEMP/template-ci-execution/state.json"
      - name: Export original macOS probe bytes
        id: darwin_export
        if: always() && runner.os == 'macOS'
        run: |
          .venv/bin/python -B - <<'PYTHON'
          import json, os, tempfile, time
          from pathlib import Path
          from infrastructure.core.testing._ci_execution_files import _export
          destination = Path(tempfile.mkdtemp(prefix="template-tagged-pdf-artifacts-", dir=os.environ["RUNNER_TEMP"]))
          exclusions = []
          total = _export(Path.cwd() / "output/readiness", destination, time.monotonic() + 120, exclusions=exclusions)
          with Path(os.environ["GITHUB_ENV"]).open("a") as environment:
              environment.write(f"TEMPLATE_CI_ARTIFACT_DIRECTORY={destination}\n")
          print(json.dumps({"transport_bytes": total, "excluded_pytest_scratch": exclusions, "runtime_acceptance": False}))
          PYTHON
      - name: Retain the actual test and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: root-tagged-pdf-${{ matrix.host }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TEMPLATE_CI_ARTIFACT_DIRECTORY }}/root-tagged-pdf-probe/${{ matrix.host }}-${{ matrix.python }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain the original wrapper streams and exit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: root-tagged-pdf-cli-${{ matrix.host }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/root-tagged-pdf-cli-${{ matrix.host }}-${{ matrix.python }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Require the real unskipped test and complete export
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          EXPORT_OUTCOME: ${{ runner.os == 'Linux' && steps.linux_export.outcome || steps.darwin_export.outcome }}
        run: |
          set -euo pipefail
          [ "$PROBE_OUTCOME" = success ] && [ "$EXPORT_OUTCOME" = success ]
          echo 'This one-family tool probe grants no full Root, native, policy or release acceptance.' >> "$GITHUB_STEP_SUMMARY"
