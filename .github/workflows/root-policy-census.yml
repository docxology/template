name: DIAGNOSTIC paired Crossref complete cold native Source
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnostic-cold-pair-${{ github.run_id }}
  cancel-in-progress: false
env:
  UV_FROZEN: 'true'
  MPLBACKEND: Agg
  OLLAMA_SKIP_TEST_MODEL_PULL: '1'
jobs:
  cold-native-diagnostic:
    name: DIAGNOSTIC actual cold native (${{ matrix.cell }})
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        cell:
        - template_data_descriptor
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        submodules: true
        fetch-depth: 0
    - uses: ./.github/actions/setup-acceptance-fixtures
    - uses: ./.github/actions/setup-python-env
      with:
        python-version: 3.14.4
    - uses: ./.github/actions/setup-native-installed-readiness
      with:
        matrix-cell: ${{ matrix.cell }}
    - name: Prepare the exact immutable SIA sandbox image
      if: matrix.cell == 'template_sia'
      timeout-minutes: 10
      shell: bash
      env:
        SIA_SANDBOX_IMAGE: python@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
      run: 'set -euo pipefail

        docker pull "$SIA_SANDBOX_IMAGE"

        image=$(docker image inspect --format ''{{.Id}}'' "$SIA_SANDBOX_IMAGE")

        echo "TEMPLATE_SIA_TEST_IMAGE=$image" >> "$GITHUB_ENV"

        '
    - name: Keep the declared capacity before native allocation
      uses: ./.github/actions/reclaim-native-runner-capacity
    - name: Original authenticated installed native format inventory (one project)
      id: native
      run: .venv/bin/python -m infrastructure.reporting.native_installed_launcher --mode original --matrix-cell "${{ matrix.cell
        }}" --source-root "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA" --source-identity "$(.venv/bin/python -c 'from
        pathlib import Path;from infrastructure.reporting.readiness_receipts import source_fingerprint;print(source_fingerprint(Path.cwd()))')"
        --python "$GITHUB_WORKSPACE/.venv/bin/python" --uv "$(command -v uv)" --expected-platform Linux --timeout 14400 --mermaid-package-root
        "$GITHUB_WORKSPACE/node_modules/@mermaid-js/mermaid-cli" --mermaid-dependency-root "$GITHUB_WORKSPACE/node_modules"
        --mermaid-node-executable "$(command -v node)" --mermaid-chrome-executable "$CHROME_EXECUTABLE_PATH" --office-font-directory
        /usr/share/fonts/truetype --office-font-directory "/usr/local/share/fonts/template-acceptance-juliamono" --repository
        "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --current-root "$RUNNER_TEMP/template-native-original-root" --scratch
        "$RUNNER_TEMP/template-native-original-scratch" --epubcheck-jar "$TEMPLATE_NATIVE_EPUBCHECK" --java-executable "$TEMPLATE_NATIVE_JAVA"
    - name: Retain exact independently admitted native shards (one project)
      uses: ./.github/actions/upload-readiness-shards
      with:
        repo-root: ${{ runner.temp }}/template-native-original-root
        directory: ${{ runner.temp }}/template-native-original-root/output/readiness/native-cell-transports/${{ matrix.cell
          }}
        kind: native
        cell: ${{ matrix.cell }}
        retention-days: 30
    - name: Preserve failed original raw and Code evidence
      if: always() && steps.native.outcome == 'failure'
      run: .venv/bin/python -m infrastructure.reporting.native_failed_transport --repo-root "$GITHUB_WORKSPACE" --mirror "$RUNNER_TEMP/template-native-original-root"
        --scratch "$RUNNER_TEMP/template-native-original-scratch" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
        --revision "$GITHUB_SHA"
    - name: Retain bounded failed-native diagnostics without acceptance
      if: always() && steps.native.outcome == 'failure'
      uses: ./.github/actions/upload-readiness-shards
      with:
        repo-root: ${{ github.workspace }}
        directory: ${{ github.workspace }}/output/readiness/failed-native-transport
        kind: failed-native
        retention-days: 30
