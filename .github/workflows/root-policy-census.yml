{
  "name": "Owned complete cold SDK phase observation",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "source_sha": {
          "description": "Exact owned diagnostic revision; must equal dispatch Source",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "owned-cold-sdk-${{ github.run_id }}",
    "cancel-in-progress": false
  },
  "env": {
    "UV_FROZEN": "true",
    "PYTHONUNBUFFERED": "1",
    "MPLBACKEND": "Agg"
  },
  "jobs": {
    "original": {
      "name": "Phase-observed complete SDK (Linux, ${{ matrix.python }})",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 75,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "python": [
            "3.14"
          ]
        }
      },
      "steps": [
        {
          "name": "Admit exact owned Source",
          "shell": "bash",
          "env": {
            "REQUESTED_SOURCE": "${{ inputs.source_sha }}"
          },
          "run": "set -euo pipefail\n[[ \"$REQUESTED_SOURCE\" =~ ^[0-9a-f]{40}$ ]]\n[ \"$REQUESTED_SOURCE\" = \"$GITHUB_SHA\" ]\n"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ inputs.source_sha }}",
            "submodules": true,
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-python-env",
          "with": {
            "python-version": "${{ matrix.python }}",
            "dependency-group": "installed-build"
          }
        },
        {
          "name": "Prepare the actual locked complete contract environment",
          "run": "uv sync --locked --group installed-build --python '${{ matrix.python }}'"
        },
        {
          "uses": "./.github/actions/setup-meta-provider"
        },
        {
          "uses": "./.github/actions/setup-acceptance-documents",
          "with": {
            "mode": "converter"
          }
        },
        {
          "uses": "./.github/actions/setup-native-loader-fixture",
          "timeout-minutes": 10
        },
        {
          "uses": "./.github/actions/setup-ci-execution-user"
        },
        {
          "name": "Observe the complete real SDK module without changing original clocks",
          "id": "genuine",
          "continue-on-error": true,
          "timeout-minutes": 35,
          "shell": "bash",
          "run": "set -euo pipefail\noriginal=\"$RUNNER_TEMP/owned-genuine-sdk-cli\"\nmkdir \"$original\"\nstatus=0\n.venv/bin/python -m infrastructure.core.testing.ci_execution_user run \\\n --state \"$RUNNER_TEMP/template-ci-execution/state.json\" -- \\\n .venv/bin/python -B -u -c 'import hashlib,json,os,shutil,signal,sys,tempfile,threading,time,xml.etree.ElementTree as ET\nfrom pathlib import Path\nfrom infrastructure.core.subprocess_policy import SubprocessPolicy,run_with_policy\nroot=Path.cwd().resolve();directory=root/'\"'\"'output/readiness/owned-genuine-sdk'\"'\"';directory.mkdir(parents=True,exist_ok=False)\nscratch=Path(tempfile.mkdtemp(prefix='\"'\"'owned-genuine-sdk-originals-'\"'\"')).resolve()\nmodule='\"'\"'tests/infra_tests/reporting/test_native_original_launch_correctness.py'\"'\"'\nargv=[sys.executable,'\"'\"'-B'\"'\"','\"'\"'-u'\"'\"','\"'\"'-m'\"'\"','\"'\"'pytest'\"'\"','\"'\"'-c'\"'\"',str(root/'\"'\"'pyproject.toml'\"'\"'),'\"'\"'--rootdir'\"'\"',str(root),'\"'\"'--confcutdir'\"'\"',str(root),'\"'\"'-o'\"'\"','\"'\"'addopts='\"'\"','\"'\"'--import-mode=importlib'\"'\"','\"'\"'--assert=plain'\"'\"','\"'\"'--strict-markers'\"'\"','\"'\"'-p'\"'\"','\"'\"'no:cacheprovider'\"'\"','\"'\"'-vv'\"'\"','\"'\"'--tb=long'\"'\"','\"'\"'--durations=0'\"'\"','\"'\"'--junitxml='\"'\"'+str(directory/'\"'\"'pytest.xml'\"'\"'),'\"'\"'--basetemp='\"'\"'+str(scratch/'\"'\"'fixtures'\"'\"'),module]\ninvocation={'\"'\"'role'\"'\"':'\"'\"'actual-complete-phase-observed-SDK-diagnostic-NOT-production-or-Root-release-acceptance'\"'\"','\"'\"'source_commit'\"'\"':os.environ['\"'\"'GITHUB_SHA'\"'\"'],'\"'\"'repository'\"'\"':os.environ['\"'\"'GITHUB_REPOSITORY'\"'\"'],'\"'\"'workflow_run_id'\"'\"':os.environ['\"'\"'GITHUB_RUN_ID'\"'\"'],'\"'\"'actual_minor'\"'\"':f'\"'\"'{sys.version_info.major}.{sys.version_info.minor}'\"'\"','\"'\"'production_SDK_code_source'\"'\"':'\"'\"'8577df2e9c3b2912fab35adf889b844b7f1714a9'\"'\"','\"'\"'diagnostic_test_has_only_added_phase_signal_stack_observation_and_original_stream_preservation'\"'\"':True,'\"'\"'module_source_sha256'\"'\"':hashlib.sha256((root/module).read_bytes()).hexdigest(),'\"'\"'argv'\"'\"':argv,'\"'\"'whole_suite_original_budget_seconds'\"'\"':1800,'\"'\"'original_genuine_case_operation_seconds'\"'\"':1200,'\"'\"'original_genuine_case_pytest_seconds'\"'\"':1800,'\"'\"'native_observation_ceiling_unchanged'\"'\"':600,'\"'\"'no_watchdog_thread_added_inside_genuine_child'\"'\"':True}\n(directory/'\"'\"'invocation.json'\"'\"').write_text(json.dumps(invocation,indent=2)+'\"'\"'\\n'\"'\"')\nstop=threading.Event();probe_started=time.monotonic()\ndef proc(pid):\n path=Path('\"'\"'/proc'\"'\"')/str(pid);fields=(path/'\"'\"'stat'\"'\"').read_text().rsplit('\"'\"') '\"'\"',1)[1].split()\n return {'\"'\"'pid'\"'\"':pid,'\"'\"'parent_pid'\"'\"':int(fields[1]),'\"'\"'state'\"'\"':fields[0],'\"'\"'user_ticks'\"'\"':int(fields[11]),'\"'\"'system_ticks'\"'\"':int(fields[12]),'\"'\"'start_ticks'\"'\"':int(fields[19]),'\"'\"'wchan'\"'\"':(path/'\"'\"'wchan'\"'\"').read_text().strip(),'\"'\"'argv'\"'\"':(path/'\"'\"'cmdline'\"'\"').read_bytes().decode('\"'\"'utf-8'\"'\"','\"'\"'replace'\"'\"').rstrip('\"'\"'\\0'\"'\"').split('\"'\"'\\0'\"'\"')}\ndef sample():\n while not stop.wait(60):\n  observation={'\"'\"'elapsed_seconds'\"'\"':time.monotonic()-probe_started,'\"'\"'descendants'\"'\"':[],'\"'\"'signals'\"'\"':[],'\"'\"'errors'\"'\"':[]};queue=[os.getpid()];seen=set()\n  while queue and len(seen)<256:\n   parent=queue.pop()\n   if parent in seen:continue\n   seen.add(parent)\n   try:children=[int(value) for value in (Path('\"'\"'/proc'\"'\"')/str(parent)/'\"'\"'task'\"'\"'/str(parent)/'\"'\"'children'\"'\"').read_text().split()]\n   except OSError:continue\n   for pid in children:\n    queue.append(pid)\n    try:\n     info=proc(pid);observation['\"'\"'descendants'\"'\"'].append(info)\n     script=next((Path(argument) for argument in info['\"'\"'argv'\"'\"'] if argument.startswith('\"'\"'/'\"'\"') and argument.endswith('\"'\"'/genuine-pandoc-installed-sdk.py'\"'\"')),None)\n     if script is None or not script.is_relative_to(scratch/'\"'\"'fixtures'\"'\"'):continue\n     ready=(script.parent/'\"'\"'genuine-debug-phases.jsonl'\"'\"').read_bytes()\n     if len(ready)>1024*1024:raise ValueError('\"'\"'bounded genuine readiness exceeded'\"'\"')\n     first=json.loads(ready.splitlines()[0]);current=proc(pid)\n     if first['\"'\"'pid'\"'\"']!=pid or first['\"'\"'pid_start_ticks'\"'\"']!=current['\"'\"'start_ticks'\"'\"'] or current['\"'\"'start_ticks'\"'\"']!=info['\"'\"'start_ticks'\"'\"'] or current['\"'\"'argv'\"'\"']!=info['\"'\"'argv'\"'\"']:continue\n     os.kill(pid,signal.SIGUSR2);observation['\"'\"'signals'\"'\"'].append({'\"'\"'pid'\"'\"':pid,'\"'\"'pid_start_ticks'\"'\"':current['\"'\"'start_ticks'\"'\"'],'\"'\"'signal'\"'\"':'\"'\"'SIGUSR2'\"'\"','\"'\"'role'\"'\"':'\"'\"'native faulthandler registered before same-original ready marker; no ptrace/watchdog'\"'\"'})\n    except (OSError,ValueError,IndexError,KeyError) as error:observation['\"'\"'errors'\"'\"'].append({'\"'\"'pid'\"'\"':pid,'\"'\"'error'\"'\"':str(error)})\n  with (directory/'\"'\"'actual-native-proc-and-signal-samples.jsonl'\"'\"').open('\"'\"'a'\"'\"') as stream:stream.write(json.dumps(observation,sort_keys=True)+'\"'\"'\\n'\"'\"')\nsampler=threading.Thread(target=sample,name='\"'\"'external-owned-genuine-process-observer'\"'\"',daemon=True);sampler.start()\nstarted=time.monotonic()\ntry:\n actual=run_with_policy(argv,cwd=root,env=dict(os.environ,PYTHONUNBUFFERED='\"'\"'1'\"'\"'),policy=SubprocessPolicy(policy_id='\"'\"'owned-complete-genuine-SDK-phase-observation'\"'\"',source_path=__name__,timeout_seconds=1800,credential_free=True))\nfinally:\n stop.set();sampler.join(timeout=3)\n(directory/'\"'\"'pytest.stdout.txt'\"'\"').write_text(actual.stdout);(directory/'\"'\"'pytest.stderr.txt'\"'\"').write_text(actual.stderr)\nkept=[];kept_bytes=0\nif (scratch/'\"'\"'fixtures'\"'\"').is_dir():\n for case in sorted((scratch/'\"'\"'fixtures'\"'\"').iterdir()):\n  if case.is_symlink() or not case.is_dir():continue\n  candidates=[path for path in case.iterdir() if not path.is_symlink() and path.is_file() and path.suffix in {'\"'\"'.stdout'\"'\"','\"'\"'.stderr'\"'\"','\"'\"'.exit'\"'\"','\"'\"'.json'\"'\"','\"'\"'.jsonl'\"'\"'}]\n  for relative in ('\"'\"'cold-crossref-launcher-controls'\"'\"','\"'\"'mirror/output/readiness/native-loader-terminal-control'\"'\"'):\n   source=case/relative\n   if not source.is_dir() or source.is_symlink():continue\n   for parent,dirs,files in os.walk(source,followlinks=False):\n    dirs[:]=[name for name in dirs if name!='\"'\"'.git'\"'\"' and not (Path(parent)/name).is_symlink()]\n    candidates.extend(Path(parent)/name for name in files if not (Path(parent)/name).is_symlink())\n  child=case/'\"'\"'genuine-pandoc-installed-sdk.py'\"'\"'\n  if child.is_file() and not child.is_symlink():candidates.append(child)\n  for path in sorted(set(candidates)):\n   size=path.stat().st_size\n   if size>64*1024*1024 or kept_bytes+size>512*1024*1024:raise ValueError('\"'\"'bounded original SDK diagnostic exceeded'\"'\"')\n   body=path.read_bytes();kept_bytes+=len(body);target=directory/'\"'\"'fixture-originals'\"'\"'/case.name/path.relative_to(case);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(body)\n   kept.append({'\"'\"'path'\"'\"':str(target.relative_to(root)),'\"'\"'bytes'\"'\"':len(body),'\"'\"'sha256'\"'\"':hashlib.sha256(body).hexdigest()})\nsuites=[]\nif (directory/'\"'\"'pytest.xml'\"'\"').is_file():suites=[element.attrib for element in ET.parse(directory/'\"'\"'pytest.xml'\"'\"').getroot().iter('\"'\"'testsuite'\"'\"')]\npassed=actual.returncode==actual.original_returncode==0 and not actual.timed_out and not actual.custody_refused and not actual.command_error and bool(suites) and all(int(suite['\"'\"'tests'\"'\"'])>0 and all(int(suite[key])==0 for key in ('\"'\"'errors'\"'\"','\"'\"'failures'\"'\"','\"'\"'skipped'\"'\"')) for suite in suites)\nresult={'\"'\"'role'\"'\"':'\"'\"'actual-phase-observed-complete-SDK-process-not-production-acceptance'\"'\"','\"'\"'returncode'\"'\"':actual.returncode,'\"'\"'original_returncode'\"'\"':actual.original_returncode,'\"'\"'timed_out'\"'\"':actual.timed_out,'\"'\"'custody_refused'\"'\"':actual.custody_refused,'\"'\"'command_error'\"'\"':actual.command_error,'\"'\"'duration_seconds'\"'\"':time.monotonic()-started,'\"'\"'actual_suites'\"'\"':suites,'\"'\"'all_actual_selected_cases_passed_without_skip'\"'\"':passed,'\"'\"'external_sampler_stopped'\"'\"':not sampler.is_alive(),'\"'\"'retained_originals'\"'\"':kept,'\"'\"'release_acceptance_granted'\"'\"':False}\n(directory/'\"'\"'outcome.json'\"'\"').write_text(json.dumps(result,indent=2)+'\"'\"'\\n'\"'\"');shutil.rmtree(scratch)\nprint(json.dumps(result));raise SystemExit(0 if passed else 1)\n' \\\n > \"$original/stdout.raw\" 2> \"$original/stderr.raw\" || status=$?\nprintf '%s\\n' \"$status\" > \"$original/exit-code\"\nexit \"$status\"\n"
        },
        {
          "name": "Export original owned readiness",
          "id": "export",
          "if": "always()",
          "run": ".venv/bin/python -m infrastructure.core.testing.ci_execution_user export --state \"$RUNNER_TEMP/template-ci-execution/state.json\""
        },
        {
          "name": "Retain actual SDK original streams and results",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "phase-observed-complete-sdk-linux-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ env.TEMPLATE_CI_ARTIFACT_DIRECTORY }}/owned-genuine-sdk/\n${{ runner.temp }}/owned-genuine-sdk-cli/\n",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 30
          }
        },
        {
          "name": "Require actual whole-module consumer success and completed export",
          "if": "always()",
          "shell": "bash",
          "env": {
            "ORIGINAL_OUTCOME": "${{ steps.genuine.outcome }}",
            "EXPORT_OUTCOME": "${{ steps.export.outcome }}"
          },
          "run": "set -euo pipefail\n[ \"$ORIGINAL_OUTCOME\" = success ]\n[ \"$EXPORT_OUTCOME\" = success ]\necho \"Complete component proof only; no Root or public release acceptance granted.\" >> \"$GITHUB_STEP_SUMMARY\"\n"
        }
      ]
    }
  }
}
