name: Native candidate preflight

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/reporting/native_*.py'
      - 'infrastructure/reporting/release_readiness_*.py'
      - 'infrastructure/rendering/_mermaid_v11*'
      - '.github/actions/setup-native-installed-readiness/**'
      - '.github/actions/setup-docs-lint/**'
      - '.github/workflows/platform-native-preflight.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: native-preflight-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: 'true'
  MPLBACKEND: Agg

jobs:
  native-preflight:
    # Ubuntu 26.04 has no setup-python build for 3.14.4; this workflow needs the
    # same reviewed Noble image as ci.yml and the required acceptance.
    runs-on: ubuntu-24.04
    # 12000s operation + cold setup/upload. The 1800s bound was measured below
    # the cold lifecycle; see docs/guides/native-format-acceptance.md.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14.4"
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-native-installed-readiness
        with:
          prepare-lean: 'false'
