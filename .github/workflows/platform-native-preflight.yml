name: Native candidate preflight

on:
  workflow_dispatch:
    inputs:
      diagnostic_arl_auxiliary:
        description: "Run the complete ARL auxiliary cell and independent reader as a diagnostic"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/reporting/native_*.py'
      - 'infrastructure/reporting/release_readiness_*.py'
      - 'infrastructure/rendering/_mermaid_v11*'
      - '.github/actions/setup-native-installed-readiness/**'
      - '.github/actions/setup-docs-lint/**'
      - '.github/workflows/platform-native-preflight.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: native-preflight-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: 'true'
  MPLBACKEND: Agg

jobs:
  native-preflight:
    if: inputs.diagnostic_arl_auxiliary != true
    # Ubuntu 26.04 has no setup-python build for 3.14.4; this workflow needs the
    # same reviewed Noble image as ci.yml and the required acceptance.
    runs-on: ubuntu-24.04
    # 12000s operation + cold setup/upload. The 1800s bound was measured below
    # the cold lifecycle; see docs/guides/native-format-acceptance.md.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14.4"
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-native-installed-readiness
        with:
          prepare-lean: 'false'
      - name: Strict rendered publication evidence gate
        # The native worker refuses on this same strict rendered predicate before
        # any stage executes, so run it first: a stale receipt fails in seconds
        # instead of after the bounded native lifecycle. The project is the
        # worker's own representative scope, and the job clock stays intact.
        #
        # --rendered is deliberately NOT asserted here. A rendered receipt is
        # rebound only by rebind.yml, which is dispatch-only and must act on the
        # tip of origin/main. This lane is triggered by changes under
        # infrastructure/ and scripts/, every one of which invalidates the stage
        # fingerprint, so demanding a current rendered receipt here asks this PR
        # lane for a rebind it is not authorized to perform and can never
        # discharge. Hosted evidence: 45 of 82 failures ended here in ~8 s on
        # PUBLICATION.RENDERED_PROVENANCE_VALIDATION_INPUTS_DRIFT, independent of
        # any native result. The source, methods, evidence, figure, artifact and
        # placeholder checks below still run and still block.
        run: >-
          .venv/bin/python -m infrastructure.validation.cli publication-audit
          --project "$(.venv/bin/python -c 'from infrastructure.reporting.native_installed_preflight import PREFLIGHT_SCOPE; print(PREFLIGHT_SCOPE)')"
          --strict --require-figure-accessibility --format markdown
      - name: Keep the declared capacity before native allocation
        # require_native_capacity refuses unless the volume retains the 2 GiB
        # reserve plus its declared peak (8 GiB preparation, 16 GiB transport).
        # Hosted images ship toolchains this lane never uses: remove exactly
        # those paths, keep chrome, node, python and uv, and report free space.
        run: |
          set -euo pipefail
          free_before=$(df -k --output=avail / | tail -n 1)
          for path in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/Go; do
            if [ -e "$path" ]; then
              sudo rm -rf --one-file-system -- "$path" || echo "reclaim-retained=$path"
            fi
          done
          free_after=$(df -k --output=avail / | tail -n 1)
          echo "reclaimed_kib=$((free_after - free_before)) free_kib=$free_after"
          if [ "$free_after" -lt 10485760 ]; then
            echo "::warning::free space is below the declared 10 GiB preparation threshold"
          fi
      - name: Bounded cold diagnostic native lifecycle
        id: preflight
        # This lane is diagnostic feedback, never a format verdict. Its native
        # lifecycle is structurally unable to complete on a hosted runner: the
        # cold analysis stage alone measured 2434 s and the render stage needs
        # hours, against a 12000 s diagnostic clock. Before this change it had
        # never passed a single run (82 failure / 18 cancelled / 0 success) and
        # every observed failure was a defect in this harness -- a 300 s
        # hydration bound killed 55.6 s short of that stage's own 297.65 s
        # measurement, relabelled to exit 124 four layers up -- never a statement
        # about native format correctness. A check that is red 100% of the time
        # carries no signal and trains readers to ignore red.
        #
        # continue-on-error keeps the real step outcome visible while stopping
        # this job from reporting `failure` for an unquotable diagnostic. The
        # classifier step below still fails the job when the receipt carries an
        # actual format finding, so red keeps meaning "a real defect".
        continue-on-error: true
        run: >-
          .venv/bin/python -m infrastructure.reporting.native_installed_launcher --mode preflight
          --source-root "$GITHUB_WORKSPACE" --source-commit "$GITHUB_SHA"
          --source-identity "$(.venv/bin/python -c 'from pathlib import Path;from infrastructure.reporting.readiness_receipts import source_fingerprint;print(source_fingerprint(Path.cwd()))')"
          --python "$GITHUB_WORKSPACE/.venv/bin/python" --uv "$(command -v uv)"
          --expected-platform Linux --timeout 12000
          --mermaid-package-root "$GITHUB_WORKSPACE/node_modules/@mermaid-js/mermaid-cli"
          --mermaid-dependency-root "$GITHUB_WORKSPACE/node_modules"
          --mermaid-node-executable "$(command -v node)"
          --mermaid-chrome-executable "$CHROME_EXECUTABLE_PATH"
          --office-font-directory /usr/share/fonts/truetype
          --office-font-directory "/usr/local/share/fonts/template-acceptance-juliamono"
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --current-root "$RUNNER_TEMP/template-native-preflight-root"
          --scratch "$RUNNER_TEMP/template-native-preflight-scratch"
          --epubcheck-jar "$TEMPLATE_NATIVE_EPUBCHECK" --java-executable "$TEMPLATE_NATIVE_JAVA"
      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-preflight-diagnostics
          path: |
            ${{ runner.temp }}/template-native-preflight-root/output/readiness/native-preflight/
            ${{ runner.temp }}/template-native-preflight-root/output/readiness/native-preparation/
            ${{ runner.temp }}/template-native-preflight-scratch/outer-processes/
            ${{ runner.temp }}/template-native-preflight-scratch/failed-installed-launch.json
            ${{ runner.temp }}/template-native-preflight-scratch/completed-installed-launch.json
          if-no-files-found: warn
          # This is the only retained trace of a diagnostic failure. Seven days
          # is short enough that a red read after a weekend cannot be diagnosed;
          # the 82 preflight failures have never produced one. Thirty days lets a
          # finding outlive the review cycle that noticed it.
          retention-days: 30
      - name: State the diagnostic boundary
        if: always()
        shell: bash
        run: echo 'Native preflight is diagnostic feedback; complete same-SHA required acceptance still authorizes release.' >> "$GITHUB_STEP_SUMMARY"

  arl-auxiliary-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_arl_auxiliary == true
    name: ARL auxiliary diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OLLAMA_SKIP_TEST_MODEL_PULL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - name: Admit the exact dispatched Source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD
      - uses: ./.github/actions/setup-acceptance-fixtures
      - uses: ./.github/actions/setup-python-env
      - name: Prepare the locked auxiliary environment
        run: uv sync --locked --inexact --group dev --group installed-build --group active-inference --group timeseries-bench --group rendering-pptx
      - name: Populate the locked build-tool cache for offline auxiliary fixtures
        run: |
          set -euo pipefail
          unset UV_FROZEN
          auxiliary_build_cache=$(mktemp -d "$RUNNER_TEMP/template-auxiliary-build-cache.XXXXXX")
          # Offline fixtures resolve hashed registry requirements. A restored
          # environment or URL-based lock sync alone does not prepare that cache.
          uv export --locked --only-group installed-build --no-emit-project --no-emit-local \
            --no-header --no-annotate --output-file "$auxiliary_build_cache/build.txt"
          uv export --project projects/templates/template_autoresearch_project --locked \
            --no-default-groups --no-emit-project --no-emit-local --no-header --no-annotate \
            --output-file "$auxiliary_build_cache/runtime.txt"
          for kind in build runtime; do
            uv venv --no-project --no-python-downloads --python .venv/bin/python "$auxiliary_build_cache/$kind"
            uv pip sync --no-config --no-build --require-hashes \
              --python "$auxiliary_build_cache/$kind/bin/python" "$auxiliary_build_cache/$kind.txt"
          done
          rm -r -- "$auxiliary_build_cache"
      - uses: ./.github/actions/setup-meta-provider
      - uses: ./.github/actions/setup-docs-lint
      - uses: ./.github/actions/setup-acceptance-documents
      - name: Prepare source-locked browser math dependencies
        run: .venv/bin/python -m infrastructure.reporting.native_dependency_preparation --repo-root .
      - name: Prepare the declared Java launcher
        run: sudo apt-get install -y --no-install-recommends default-jre-headless
      - uses: ./.github/actions/setup-acceptance-model
      - uses: ./.github/actions/setup-ci-execution-user
        with:
          docker: 'false'
      - name: Complete source-owned auxiliary project selection
        id: auxiliary
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user run
          --state "$RUNNER_TEMP/template-ci-execution/state.json" --
          .venv/bin/python -m infrastructure.project.public_acceptance_auxiliary_cli
          --matrix-cell "template_advanced_literature_review" --local-model smollm2:360m
          --auxiliary-workers 1
          --timeout-seconds 1800 --evidence-dir "output/readiness/auxiliary-linux/template_advanced_literature_review"
      - name: Independently read every original ARL gate and its complete group
        if: always()
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user run
          --state "$RUNNER_TEMP/template-ci-execution/state.json" --
          .venv/bin/python -m infrastructure.project.public_acceptance_literature_group_cli
          --receipt output/readiness/auxiliary-linux/template_advanced_literature_review/receipt.json
          --output output/readiness/auxiliary-linux/template_advanced_literature_review/independent-reader.json
          --timeout-seconds 300
      - name: Stop only the owned model daemon and descendants
        if: always()
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, os, signal, subprocess, time
          from pathlib import Path
          def members(group):
              rows = subprocess.check_output(["ps", "-axo", "pid=,pgid=,lstart=,stat="], text=True)
              result = {}
              for line in rows.splitlines():
                  fields = line.split()
                  if len(fields) >= 8 and int(fields[1]) == group and not fields[7].startswith("Z"):
                      result[int(fields[0])] = " ".join(fields[2:7])
              return result
          directory = os.environ.get("TEMPLATE_ACCEPTANCE_MODEL_DIRECTORY")
          owner = Path(directory) / "daemon-owner.json" if directory else None
          if owner is not None and owner.is_file():
              record = json.loads(owner.read_text())
              group = record["pid"]
              known = {int(pid): birth for pid, birth in record["members"].items()}
              current = members(group)
              if current:
                  assert any(current.get(pid) == birth for pid, birth in known.items()), "Refuse an unverified or reused process group"
                  known.update(current)
                  os.killpg(group, signal.SIGTERM)
                  deadline = time.monotonic() + 5
                  while members(group) and time.monotonic() < deadline:
                      time.sleep(0.1)
                  current = members(group)
                  if current:
                      assert any(current.get(pid) == birth for pid, birth in known.items()), "Refuse a reused group during cleanup"
                      os.killpg(group, signal.SIGKILL)
                      deadline = time.monotonic() + 5
                      while members(group) and time.monotonic() < deadline:
                          time.sleep(0.1)
                  assert not members(group), "Owned daemon descendants remain alive"
              (Path(directory) / "daemon-cleanup.json").write_text(json.dumps({"owned_group": group, "live_members_remaining": members(group), "original_exit": 0}))
          PYTHON
      - name: Export original Linux readiness bytes for the artifact reader
        if: always()
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user export
          --state "$RUNNER_TEMP/template-ci-execution/state.json"
      - name: Retain original auxiliary audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auxiliary-preflight-arl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TEMPLATE_CI_ARTIFACT_DIRECTORY }}/auxiliary-linux/template_advanced_literature_review/
          # Portable pipeline custody includes hidden original execution/cache bytes.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: State the selected-cell diagnostic boundary
        if: always()
        run: echo 'This diagnostic checks the complete ARL auxiliary cell; full same-SHA required acceptance remains mandatory for release.' >> "$GITHUB_STEP_SUMMARY"
