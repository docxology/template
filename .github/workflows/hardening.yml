name: Optional Hardening

on:
  workflow_dispatch:

# Global minimum permissions; individual jobs override where needed
permissions:
  contents: read

concurrency:
  # Preserve completed-SHA evidence even while other main commits arrive.
  # Only superseded runs of the same pull request cancel each other.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "true"
  MPLBACKEND: Agg

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 — Lint & Type Check
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # Presence-detection for OPTIONAL/rotating projects. `hashFiles()` is NOT
  # available in a job-level `if:` (only in step contexts) — using it there is
  # a workflow-validation error that makes GitHub reject the ENTIRE workflow
  # at startup (zero jobs run, surfaced as "workflow file issue"). This tiny
  # job computes the existence flags in a step (valid) and exposes them as
  # outputs that the optional jobs gate on via `needs.detect.outputs.*`.
  detect:
    name: Detect optional projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      setup_hook: ${{ steps.d.outputs.setup_hook }}
      fep_lean: ${{ steps.d.outputs.fep_lean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        shell: bash
        run: |
          shopt -s globstar nullglob
          hooks=(projects/**/scripts/setup_hook.py)
          if [ ${#hooks[@]} -gt 0 ]; then
            echo "setup_hook=true" >> "$GITHUB_OUTPUT"
          else
            echo "setup_hook=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f projects/fep_lean/lean/lean-toolchain ]; then
            echo "fep_lean=true" >> "$GITHUB_OUTPUT"
          else
            echo "fep_lean=false" >> "$GITHUB_OUTPUT"
          fi

  # Derive the complete project/Python matrix from the validated, versioned
  # public-capability manifest. One source now owns the exact public roster and
  # supported CI Python versions; malformed metadata, incompatible Python
  # floors, or declaration drift fails before any matrix cell starts
  # (PUBLIC-CAPABILITY-PARITY-1). No project runtime is executed here.
  detect-projects:
    name: Detect public capability matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      infra_matrix: ${{ steps.matrix.outputs.infra_matrix }}
      required_jobs: ${{ steps.matrix.outputs.required_jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - name: Sync dependencies
        run: uv sync

      - name: Validate capabilities and emit CI matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(uv run python scripts/gates/public_capabilities.py --ci-matrix-json)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          required_jobs="$(uv run python scripts/gates/ci_policy.py --workflow hardening.yml)"
          echo "required_jobs=${required_jobs}" >> "$GITHUB_OUTPUT"
          infra_matrix="$(uv run python scripts/gates/infra_ci_partition.py --matrix)"
          echo "infra_matrix=${infra_matrix}" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Job 0b — Actionlint (workflow syntax gate; independent of project setup)
  #
  # GH-ACTIONLINT-1: catch workflow-expression and `uses:` errors early, before
  # a small mistake silently disables CI coverage or fails every PR. Read-only,
  # no `uv sync`, no project dependencies, no `needs:` — it runs in parallel with
  # everything else. The actionlint binary is fetched with its official installer
  # script pinned to a release commit SHA (immutable); the runner's preinstalled
  # shellcheck is picked up automatically to also lint embedded `run:` scripts.
  # ───────────────────────────────────────────────────────────────────────────
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        env:
          # rhysd/actionlint @ v1.7.12 — bump REF and VERSION together on upgrade
          ACTIONLINT_REF: 914e7df21a07ef503a81201c76d2b11c789d3fca
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_REF}/scripts/download-actionlint.bash" \
            -o "${RUNNER_TEMP}/download-actionlint.bash"
          echo "72fa3e45ac20f3c3a512d6747b4fcf719e21f890e8c43e78d48a41fdfb900c4e  ${RUNNER_TEMP}/download-actionlint.bash" \
            | sha256sum --check --status
          bash "${RUNNER_TEMP}/download-actionlint.bash" "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" -color

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - name: Sync dependencies
        run: uv sync

      - name: Resolve public CI paths
        id: public-scope
        run: |
          uv run python -m infrastructure.project.public_scope ci-paths >> "$GITHUB_OUTPUT"

      - name: Ruff lint
        run: uv run ruff check ${{ steps.public-scope.outputs.lint_paths }}

      - name: Ruff format check
        run: uv run ruff format --check ${{ steps.public-scope.outputs.lint_paths }}

      - name: Type checking
        run: uv run python scripts/gates/mypy_ratchet.py ${{ steps.public-scope.outputs.source_paths }}

      # MED5 gate: every re-exporting module under infrastructure/ must
      # declare __all__ — see docs/rules/api_design.md. Prevents regression
      # of the [attr-defined] mypy class of bug.
      - name: Audit __all__ on re-exporting modules
        run: uv run python -m infrastructure.skills check-all-exports

      - name: Verify operations manifest freshness
        run: uv run python -m infrastructure.skills operations-check

      - name: Reject tracked generated artifacts
        run: uv run python scripts/audit/check_tracked_generated_artifacts.py

      - name: Reject tracked high-confidence secrets
        run: uv run python scripts/audit/check_tracked_secrets.py

      - name: Confidentiality guard — only public template resources tracked
        run: uv run python scripts/audit/check_tracked_all.py

      # AUDIT-PRINT-GUARD-1: the T20 (print) ban is scoped to infrastructure/
      # via CLI select (a global select would flag every CLI/report module in
      # docs/ and tests/); per-file-ignores in pyproject.toml exempt the
      # legitimate CLI entrypoint, gate, and human-report modules.
      - name: Print ban — infrastructure library modules use structured logging
        run: uv run ruff check --select T20 infrastructure/

      # No-op on a clean CI clone (projects/ has no mirror); it is the local
      # developer checkout this catches, and CI asserts the guard still runs.
      - name: Mirror guard — projects/<lifecycle>/ holds managed symlinks only
        run: uv run python scripts/audit/check_mirror_symlinks.py

      # AUDIT-DOC-MODULE-REF-1: every `infrastructure.*` dotted path in docs/,
      # README.md, and AGENTS.md must resolve to a real module, so the next
      # module split cannot silently stale documentation references.
      - name: Documentation module-reference guard
        run: uv run python scripts/audit/check_doc_module_refs.py

      # Publication audit is source-only in CI because project output trees are
      # disposable/ignored. Release jobs and local sign-off add --rendered to
      # require artifact manifests, evidence registries, and figure bindings.
      - name: Publication audit — all public exemplars
        run: uv run python -m infrastructure.validation.cli publication-audit --all-public --strict --format json

      # XML parser policy (DEP-DEFUSEDXML-1): enforced by Bandit B313-B320 in
      # the security job, but this AST-level guard is explicit and independent.
      - name: XML parser policy — defusedxml only
        run: |
          uv run python - <<'PY'
          import sys
          from pathlib import Path

          from infrastructure.validation.xml_parser_policy import (
              validate_xml_parser_policy,
          )

          violations = validate_xml_parser_policy(Path('.') / 'infrastructure', Path('.'))
          if violations:
              print('XML parser policy violations:', *violations, sep='\n')
              sys.exit(1)
          PY

      # Enforce the module-size composability budget as a hard gate (fails at
      # >=950 infra / >=250 project-script lines). It also runs inside the
      # blocking health job below; keeping the focused step here gives an
      # earlier, named failure in the lint job. Advisory warnings (>=800) still
      # only warn.
      - name: Module line-count gate — composability budget
        run: uv run python scripts/gates/module_line_count_check.py

      # Strict template-drift gate: exemplar docs/scripts must match the
      # canonical Layer-1 contracts (thin orchestrators, pipeline wording,
      # publication metadata). Previously pre-commit-only; elevated to CI so
      # drift cannot land through a branch that skips local hooks.
      - name: Template drift — strict
        run: uv run python scripts/audit/check_template_drift.py --strict

# ─────────────────────────────────────────────────────────────────────────────
# Job 1b — Blocking static health report
#
# MED2: ``infrastructure.core.health`` aggregates every quality gate into a
# single typed ``HealthReport``. Behavioral tests and platform matrices remain
# separate jobs; every gate represented in this static report is blocking.
# ─────────────────────────────────────────────────────────────────────────────
  health:
    name: Static Health Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - uses: ./.github/actions/setup-docs-lint

      - name: Sync dependencies
        run: uv sync --locked --group installed-build

      - name: Install genuine Meta provider for public collection
        # Advanced imports its declared namespaced Meta engine. Collection uses
        # the selected root interpreter and admits a real, noneditable wheel.
        # Build outside source with the locked backend before observing counts.
        timeout-minutes: 5
        run: |
          provider=$(mktemp -d "$RUNNER_TEMP/template-meta-provider-source.XXXXXX")
          wheels=$(mktemp -d "$RUNNER_TEMP/template-meta-provider-wheel.XXXXXX")
          cp -R projects/templates/template_literature_meta_analysis/. "$provider/"
          uv build --wheel --no-build-isolation --python .venv/bin/python --out-dir "$wheels" "$provider"
          uv pip install --python .venv/bin/python --no-deps --reinstall "$wheels"/*.whl

      - name: Run blocking static health checks
        run: |
          uv run python -m infrastructure.core.health --json --quiet \
            > health-report.json

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-report
          path: health-report.json
          if-no-files-found: warn

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 — No-Mocks Policy Verification
# ─────────────────────────────────────────────────────────────────────────────
  verify-no-mocks:
    name: Verify No Mocks Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs in parallel with `lint` — the no-mocks script only needs the
    # checkout and `uv sync`, not the lint/type results. This shaves ~5 min
    # off the critical path to the test subtree (test-infra, test-regression,
    # test-project all gate on verify-no-mocks, which previously sat behind
    # lint unnecessarily).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - name: Sync dependencies
        run: uv sync

      # Branch-protection check name stays stable. This command is the lexical
      # prohibited-framework gate; the following inventory gate separately
      # enforces that semantic dependency replacements remain at zero.
      - name: Verify prohibited mock-framework syntax
        run: uv run python scripts/audit/verify_no_mocks.py

      - name: Enforce zero semantic dependency replacements
        run: >-
          uv run python scripts/audit/verify_no_mocks.py
          --inventory --max-dependency-replacements 0

# ─────────────────────────────────────────────────────────────────────────────
# Job 2b — Setup hook on Windows (conditional smoke)
#
# When any active project ships ``projects/**/scripts/setup_hook.py``, verify
# hook discovery and subprocess paths on ``windows-latest`` (``.sh`` hooks are
# intentionally skipped there — see TO-DO.md / infrastructure.project.setup_hook).
# ─────────────────────────────────────────────────────────────────────────────
  setup-hook-windows-smoke:
    name: Setup hook (Windows smoke)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [verify-no-mocks, detect]
    if: needs.detect.outputs.setup_hook == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - name: Sync dependencies
        run: uv sync

      - name: Run setup_hook tests (Windows)
        env:
          PYTHONUTF8: "1"
        run: >-
          uv run pytest tests/infra_tests/project/test_setup_hook.py -v
          --timeout=120

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 — Infrastructure Tests (matrix: ubuntu + macos × Python 3.14/3.15)
# ─────────────────────────────────────────────────────────────────────────────
  test-infra:
    name: "Infra Tests (${{ matrix.os }}, Python ${{ matrix.python-version }}, shard ${{ matrix.shard }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: [verify-no-mocks, detect-projects]
    permissions:
      contents: read
    env:
      # Override the repository's .python-version so uv uses the interpreter
      # selected by this matrix cell, including its moving patch release.
      UV_PYTHON: ${{ matrix.python-version }}
    # The validated matrix covers every supported runtime on every CI event.
    strategy:
      fail-fast: false
      # Keep the existing OS/runtime coverage and partition every selected
      # module completely. Independent runner cells bound shared CPU pressure.
      matrix: ${{ fromJSON(needs.detect-projects.outputs.infra_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the committed gitlink during setup; domain tests stay offline.
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (dev + optional test groups)
        run: uv sync --locked --group public-exemplars --group installed-build

      - name: Warm locked offline wheels for fresh-environment tests
        # A restored `.venv` can satisfy the sync above without downloading,
        # and setup-uv prunes registry wheels from its cache. Infra tests that
        # build fresh environments with `uv sync --locked --offline` need every
        # locked default-group wheel for this interpreter, so warm them through
        # the same lockfile installer while the network is allowed. The root
        # project's editable build backend resolves through build isolation and
        # is not hash-pinned by uv.lock. The scratch environment is discarded;
        # only the cache remains.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/uv-offline-warm.XXXXXX")
          UV_PROJECT_ENVIRONMENT="$scratch/venv" uv sync --frozen --no-python-downloads \
            --python .venv/bin/python
          rm -rf "$scratch"

      - name: Verify selected Python minor
        run: |
          uv run python -c \
            'import sys; expected=tuple(map(int, "${{ matrix.python-version }}".split("."))); assert sys.version_info[:2] == expected, (sys.version, expected)'

      - name: Fix macOS socket.getfqdn timeout
        if: runner.os == 'macOS'
        run: sudo scutil --set HostName "$(hostname)"

      - uses: ./.github/actions/setup-acceptance-documents

      - name: Run infrastructure tests
        env:
          COVERAGE_FILE: .coverage.infra
          # Coverage instrumentation is memory-intensive on macOS; keep that
          # runner deterministic while retaining wider auto-parallelism on Linux.
          TEMPLATE_CI_XDIST_WORKERS: ${{ matrix.os == 'macos-latest' && '2' || 'auto' }}
          # All four py3.14/Linux shards instrument real execution. The required
          # coverage-infra job merges their complete union and enforces 60%.
          INFRA_COV_FLAGS: ${{ (matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest') && '--cov=infrastructure --cov-report= --cov-fail-under=0' || '' }}
        # -n auto parallelizes across runner cores (pytest-xdist). Scope-based
        # distribution keeps subprocess-heavy test modules together, avoiding
        # intermittent worker replacement under work-stealing contention.
        run: |
          # shellcheck disable=SC2086  # INFRA_COV_FLAGS is intentionally word-split
          uv run pytest tests/infra_tests/ \
            -p infrastructure.core.testing.ci_infra_shard_plugin \
            --infra-ci-shard "${{ matrix.shard }}" \
            -n "$TEMPLATE_CI_XDIST_WORKERS" \
            --dist loadscope \
            --benchmark-disable \
            $INFRA_COV_FLAGS \
            --durations=10 \
            -m "not requires_ollama and not requires_docker and not network and not slow and not bench and not benchmark and not performance" \
            --timeout=120

      - name: Preserve partial infrastructure controller diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infra-diagnostics-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.shard }}
          path: output/readiness/ordinary-infra-ci/diagnostics/shard-${{ matrix.shard }}.json
          if-no-files-found: warn

      # CI-PLAYWRIGHT-SCHEDULE-1: browser provisioning costs several minutes,
      # so PR and push runs skip it; the MathJax live-viewport spec still runs
      # on the weekly scheduled (and manually dispatched) lanes.
      - name: Verify completed MathJax equations across live viewport changes
        if: matrix.shard == 0 && matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install --prefix .tmp/playwright-node --no-package-lock --no-save @playwright/test@1.62.1
          .tmp/playwright-node/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH="$PWD/.tmp/playwright-node/node_modules" \
            .tmp/playwright-node/node_modules/.bin/playwright test \
            tests/infra_tests/rendering/mathjax_reflow.spec.cjs \
            --workers=1 --output=.tmp/mathjax-browser

      - name: Export actual infrastructure coverage shard
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: uv run python scripts/gates/infra_ci_partition.py --export-shard "${{ matrix.shard }}"

      - name: Upload complete selection record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infra-selection-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.shard }}
          path: output/readiness/ordinary-infra-ci/shard-${{ matrix.shard }}.json
          if-no-files-found: error

      - name: Upload actual infrastructure coverage shard
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infra-coverage-shard-${{ matrix.shard }}
          path: output/readiness/ordinary-infra-ci/coverage-data/infra-coverage-shard-${{ matrix.shard }}/
          if-no-files-found: error

  coverage-infra:
    name: Infrastructure Union Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-infra]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the committed gitlink during setup; domain tests stay offline.
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"
      - name: Prepare locked union observer
        run: uv sync --locked
      - name: Retrieve every actual infrastructure coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: infra-coverage-shard-*
          path: output/readiness/ordinary-infra-ci/coverage-data
      - name: Verify complete selection and enforce union coverage
        run: uv run python scripts/gates/infra_ci_partition.py --merge-coverage
      - name: Upload infrastructure coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-infra.xml
          flags: infrastructure
          name: infra-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 3b — Infrastructure slow lane (scheduled/dispatch only)
#
# SLOW-PROFILE-1: the ~190 ``pytest.mark.slow`` infra tests (36 files; real
# pandoc/LaTeX rendering, llm review generators over a local HTTP stub) never
# ran on CI — the default marker expression deselects them on every lane. This
# scheduled lane exercises the full slow suite so a broken slow-marked test
# fails HERE, loudly, while PR lanes stay fast. ``slow`` has zero overlap with
# the other opt-in markers (verified 2026-09-08), so a bare ``-m slow`` — which
# overrides the pyproject default marker expression — selects exactly the
# deferred suite.
# ─────────────────────────────────────────────────────────────────────────────
  test-infra-slow:
    name: "Infra Slow Lane (pytest.mark.slow)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [verify-no-mocks]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env

      - name: Sync dependencies (dev + optional test groups)
        run: uv sync --group public-exemplars

      - name: Install pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1

      - name: Cache TeX Live packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /var/cache/apt
            /usr/share/texlive
            /usr/share/texmf
          key: texlive-${{ runner.os }}-xetex-extra-bibtex-fonts-v1
        id: texlive-cache

      - name: Install TeX Live (xelatex + bibtex)
        if: steps.texlive-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-bibtex-extra \
            texlive-fonts-recommended lmodern

      - name: Prepare the genuine locked Active coverage environment
        timeout-minutes: 10
        run: uv sync --project projects/templates/template_active_inference --locked --extra dev --python .venv/bin/python

      - name: Run slow-marked infrastructure tests
        run: >-
          uv run pytest tests/infra_tests/
          -m slow
          -p infrastructure.core.testing.ci_infra_shard_plugin
          --infra-ci-observer-only slow
          -n auto
          --dist loadscope
          --benchmark-disable
          --durations=10
          --timeout=1200

      - name: Preserve partial slow-lane controller diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infra-diagnostics-slow
          path: output/readiness/ordinary-infra-ci/diagnostics/shard-slow.json
          if-no-files-found: warn

# ─────────────────────────────────────────────────────────────────────────────
# Job — Regression tier (claim-binding pins across all public exemplars)
# ─────────────────────────────────────────────────────────────────────────────
  test-regression:
    name: "Regression Tier (claim-binding pins)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify-no-mocks]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      - name: Sync dependencies (dev + optional test groups)
        run: uv sync --group public-exemplars

      # The claim-binding regression tier re-derives every pinned manuscript
      # number from source and fails if a value drifts. Run serial (no -n auto):
      # exemplars ship colliding top-level ``src`` packages resolved via
      # per-project aliases + temporary sys.meta_path finders whose isolation is
      # collection-order-sensitive (see docs/maintenance/regression-testing.md).
      - name: Run claim-binding regression tier
        run: |
          set -euo pipefail
          report=$(mktemp "$RUNNER_TEMP/regression-junit.XXXXXX.xml")
          echo "TEMPLATE_TIER_JUNIT=$report" >> "$GITHUB_ENV"
          uv run pytest tests/regression/ -q --no-cov --timeout=120 --junitxml="$report"

      # Count the fresh report from that successful run, so the collection
      # census and behavioral evidence come from the same pytest invocation.
      # Fewer than three cases, malformed XML, failures, or errors block.
      - name: Assert regression tier is not empty
        run: |
          uv run --no-sync --offline python - <<'PYTHON'
          import os
          from defusedxml.ElementTree import parse
          root = parse(os.environ["TEMPLATE_TIER_JUNIT"]).getroot()
          if root.tag not in {"testsuite", "testsuites"}:
              raise SystemExit("FAIL: missing JUnit suite root.")
          count = len(list(root.iter("testcase")))
          print(f"regression actual JUnit cases: {count}")
          if count < 3 or root.find(".//failure") is not None or root.find(".//error") is not None:
              raise SystemExit("FAIL: regression tier requires at least 3 cases and no failures or errors.")
          PYTHON

# ─────────────────────────────────────────────────────────────────────────────
# Job 3c — Integration tier (repository-level wiring)
#
# CI-WIRING-1: ``tests/integration/`` (run.sh, secure_run.sh, output copying,
# execute_pipeline CLI, full-pipeline flow) is a registered suite that no CI
# job ran — this job mirrors ``test-regression`` so the suite is exercised on
# every push/PR instead of only on developer machines.
# ─────────────────────────────────────────────────────────────────────────────
  test-integration:
    name: "Integration Tier (run.sh + pipeline CLI)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify-no-mocks]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      - name: Sync dependencies (dev + optional test groups)
        run: uv sync --group public-exemplars

      - name: Run integration suite
        run: |
          set -euo pipefail
          report=$(mktemp "$RUNNER_TEMP/integration-junit.XXXXXX.xml")
          echo "TEMPLATE_TIER_JUNIT=$report" >> "$GITHUB_ENV"
          uv run pytest tests/integration/ -q --no-cov --timeout=120 --junitxml="$report"

      # Keep the original three-case minimum on the actual successful run.
      # Fresh JUnit also refuses malformed XML and recorded failures/errors.
      - name: Assert integration tier is not empty
        run: |
          uv run --no-sync --offline python - <<'PYTHON'
          import os
          from defusedxml.ElementTree import parse
          root = parse(os.environ["TEMPLATE_TIER_JUNIT"]).getroot()
          if root.tag not in {"testsuite", "testsuites"}:
              raise SystemExit("FAIL: missing JUnit suite root.")
          count = len(list(root.iter("testcase")))
          print(f"integration actual JUnit cases: {count}")
          if count < 3 or root.find(".//failure") is not None or root.find(".//error") is not None:
              raise SystemExit("FAIL: integration tier requires at least 3 cases and no failures or errors.")
          PYTHON

# ─────────────────────────────────────────────────────────────────────────────
# Job 4 — Project Tests (one parallel job per public exemplar)
# ─────────────────────────────────────────────────────────────────────────────
  test-project:
    name: "Project Tests (${{ matrix.project }}, py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    # Each public exemplar runs in its OWN parallel job, so wall-clock is the
    # slowest single project (~active_inference) instead of the ~45 min sequential
    # sum of all public exemplars. Each job enforces that project's own 90% floor via
    # ``scripts/pipeline/stage_01_test.py --project`` (authoritative per CLAUDE.md), which
    # also removes the old code_project/fep_lean conftest plugin-name collision
    # (every project is already isolated in its own job). py3.14 (floor) + py3.15
    # (ceiling) give cross-version coverage; macOS breadth is handled by test-infra.
    # 135 min backstop — the directly invoked Stage-01 application owns one
    # 115-minute generic-or-declared project budget. The hosted path does not
    # have the full pipeline's separate 120-minute stage wrapper; 20 minutes of
    # job margin remain for setup, descendant cleanup, and uploads. This is
    # capacity, not evidence of success.
    # Lane-wedging runbook (observed 2026-09-11): a lane can sit in_progress
    # long past this timeout-minutes without GitHub enforcing the timeout.
    # If a lane stalls: (1) cancel at the RUN level (`gh run cancel <run-id>`)
    # — job-ID cancels no-op on dead IDs because job IDs rotate per attempt —
    # (2) let the cancel settle, (3) `gh run rerun <run-id> --failed`. Retry
    # attempts normally complete well inside this envelope (observed: 42/53
    # min on attempt 3 after a wedged attempt 1).
    timeout-minutes: 135
    needs: [verify-no-mocks, detect-projects]
    permissions:
      contents: read
    env:
      # .python-version requests 3.14 by default; bind uv to this exact matrix
      # minor so the capability contract covers the interpreter actually used.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      # The include list is the exact canonical project × Python product from
      # `public_capabilities.py`; no project or Python literal is duplicated in
      # workflow YAML.
      matrix: ${{ fromJSON(needs.detect-projects.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Standalone exports admit the committed public resource gitlink.
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (dev + optional test groups)
        # `public-exemplars` is the single deterministic dependency contract
        # for every canonical public project, including scientific, literature,
        # PPTX, and monitoring dependencies. Prepare the locked backend before
        # genuine standalone-wheel controls run with networking disabled.
        run: uv sync --locked --group public-exemplars --group installed-build

      - name: Prepare exact standalone runtime dependencies
        # The genuine standalone-wheel control installs the root build backend
        # and the standalone runtime with `uv pip sync --offline --no-config
        # --no-build --require-hashes`. A lockfile `uv sync` fetches wheels by
        # their locked URLs and never records the registry entries that an
        # offline `uv pip sync` resolves from, so warm both exact hash-pinned
        # sets through the same installer here, while the network is allowed.
        if: matrix.project == 'templates/template_autoresearch_project'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uv export --locked --only-group installed-build --no-emit-project \
            --no-header --no-annotate \
            --output-file "$RUNNER_TEMP/autoresearch-build-requirements.txt"
          uv export --project projects/templates/template_autoresearch_project \
            --locked --no-default-groups --no-emit-project --no-emit-local \
            --no-header --no-annotate \
            --output-file "$RUNNER_TEMP/autoresearch-runtime-requirements.txt"
          for kind in build runtime; do
            uv venv --no-project --no-python-downloads --python .venv/bin/python \
              "$RUNNER_TEMP/autoresearch-$kind-preparation"
            uv pip sync --no-config --no-build --require-hashes \
              --python "$RUNNER_TEMP/autoresearch-$kind-preparation/bin/python" \
              "$RUNNER_TEMP/autoresearch-$kind-requirements.txt"
          done

      # Active Inference and Formal execute their declared Lean proofs in
      # ordinary Stage 01 (Formal also runs TLC with the runner's Java and its
      # hash-pinned jar). Provision exactly the toolchain each project pins;
      # an absent tool would otherwise fail those controls rather than pass.
      - name: Select the pinned Lean toolchain file
        id: lean-pin
        if: matrix.project == 'templates/template_active_inference' || matrix.project == 'templates/template_formal'
        run: |
          case "${{ matrix.project }}" in
            templates/template_active_inference) pin=projects/templates/template_active_inference/lean/lean-toolchain ;;
            templates/template_formal) pin=projects/templates/template_formal/formal/lean/lean-toolchain ;;
          esac
          echo "file=$pin" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned Lean toolchain
        if: steps.lean-pin.outputs.file != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: elan-toolchains-${{ runner.os }}-${{ hashFiles(steps.lean-pin.outputs.file) }}

      - name: Install elan and the pinned Lean toolchain
        if: steps.lean-pin.outputs.file != ''
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          curl -sSf \
            https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          echo "4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264  $RUNNER_TEMP/elan-init.sh" \
            | sha256sum --check --status
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '[:space:]' < "${{ steps.lean-pin.outputs.file }}")"
          java -version

      - name: Prepare the exact external TLC provider for Formal
        if: matrix.project == 'templates/template_formal'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pins=$(python3 -S - <<'PY'
          import ast
          import re
          from pathlib import Path

          fields = {"TLC_URL", "TLC_SHA256", "TLC_BYTES"}
          tree = ast.parse(Path("projects/templates/template_formal/src/template_formal/tool_acceptance.py").read_text(encoding="utf-8"))
          values = {}
          for node in ast.walk(tree):
              if isinstance(node, (ast.Assign, ast.AnnAssign, ast.AugAssign, ast.NamedExpr)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  selected = {item.id for target in targets for item in ast.walk(target) if isinstance(item, ast.Name)} & fields
                  if selected:
                      if not (isinstance(node, ast.Assign) and node in tree.body and len(targets) == 1
                              and isinstance(targets[0], ast.Name) and isinstance(node.value, ast.Constant)):
                          raise SystemExit("TLC pins require unique simple top-level literal assignments")
                      name = targets[0].id
                      if name in values:
                          raise SystemExit("TLC pin is declared more than once: " + name)
                      values[name] = node.value.value
          if set(values) != fields:
              raise SystemExit("TLC source pin tuple is incomplete")
          url, digest, size = values["TLC_URL"], values["TLC_SHA256"], values["TLC_BYTES"]
          if type(url) is not str or re.fullmatch(r"https://github\.com/tlaplus/tlaplus/releases/download/[A-Za-z0-9._-]+/tla2tools\.jar", url) is None:
              raise SystemExit("TLC URL must be an exact HTTPS official release locator")
          if type(digest) is not str or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("TLC SHA256 must be 64 lowercase hexadecimal characters")
          if type(size) is not int or not 0 < size <= 64 * 1024 * 1024:
              raise SystemExit("TLC byte length must be a positive integer within the existing 64 MiB bound")
          print(url, digest, size)
          PY
          )
          read -r url expected_sha expected_bytes <<< "$pins"
          tool=$(mktemp -d "$RUNNER_TEMP/template-formal-tlc.XXXXXX")
          jar="$tool/tla2tools.jar"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 120 --output "$jar" "$url"
          actual_bytes=$(wc -c < "$jar" | tr -d '[:space:]')
          if [ "$actual_bytes" != "$expected_bytes" ]; then
            printf 'TLC byte length mismatch: expected %s, got %s\n' "$expected_bytes" "$actual_bytes" >&2
            exit 1
          fi
          actual_sha=$(sha256sum "$jar")
          actual_sha=${actual_sha%% *}
          if [ "$actual_sha" != "$expected_sha" ]; then
            printf 'TLC SHA256 mismatch: expected %s, got %s\n' "$expected_sha" "$actual_sha" >&2
            exit 1
          fi
          echo "TEMPLATE_FORMAL_TLC_JAR=$jar" >> "$GITHUB_ENV"

      - name: Install the genuine Meta provider wheel for Advanced
        # Advanced Literature Review imports the namespaced Meta engine, which
        # the root environment does not install, and runtime admission refuses
        # an editable Meta source tree. Build the provider wheel from a copy of
        # the checked-out Meta source (so no build files land in the tree) and
        # install only that distribution into the root test environment, which
        # keeps the workspace's exact runner stack.
        if: matrix.project == 'templates/template_advanced_literature_review'
        timeout-minutes: 10
        run: |
          provider="$RUNNER_TEMP/meta-provider-source"
          wheels="$RUNNER_TEMP/meta-provider-wheel"
          rm -rf "$provider" "$wheels"
          cp -R projects/templates/template_literature_meta_analysis "$provider"
          uv build --wheel --out-dir "$wheels" "$provider"
          uv pip install --no-deps --reinstall "$wheels"/*.whl

      - name: Verify selected Python minor
        run: |
          uv run python -c \
            'import sys; expected=tuple(map(int, "${{ matrix.python-version }}".split("."))); assert sys.version_info[:2] == expected, (sys.version, expected)'

      # Public exemplar suites may exercise real DOCX/EPUB render paths even
      # though this job runs Stage 1 only. Keep the converter provisioned for
      # every capability-manifest lane so those regressions never degrade into
      # missing-tool failures or skips.
      - uses: ./.github/actions/setup-acceptance-documents
        with:
          # EDA directly requires XeLaTeX and embedded JuliaMono faces. Other
          # ordinary project cells retain exact Pandoc/crossref preparation.
          mode: ${{ matrix.project == 'templates/template_eda_notebook' && 'native' || 'converter' }}

      # Controlled API fixtures verify transport; these Docker checks are not
      # actual Ollama/model acceptance. Image provisioning is explicit and
      # immutable; the test runner and live CLI never pull a missing image.
      - name: Provision pinned SIA sandbox image
        if: matrix.project == 'templates/template_sia'
        env:
          SIA_SANDBOX_IMAGE: python@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
        run: |
          docker pull "$SIA_SANDBOX_IMAGE"
          docker image inspect "$SIA_SANDBOX_IMAGE" --format '{{.Id}}'
          echo "TEMPLATE_SIA_TEST_IMAGE=$SIA_SANDBOX_IMAGE" >> "$GITHUB_ENV"

      # scripts/pipeline/stage_01_test.py --project runs pytest with cwd=<project> and enforces that
      # project's own --cov-fail-under=90 internally, writing coverage into the
      # project dir (generic pytest: .coverage.project; declared verifier:
      # .coverage; both produce coverage_project.json).
      # The gate is therefore authoritative here; no repo-root coverage step.
      #
      # CI-SLOWMARK-SHARD-1: the two lanes are split explicitly instead of a
      # bare ``--include-slow`` on every event. Push/PR cells run with slow
      # tests deselected (profile marker expression adds ``not slow``);
      # scheduled/dispatched cells keep ``--include-slow`` so the full suite —
      # including any slow-marked project test — exercises on the slow lane
      # only, mirroring the public-matrix-receipt precedent. No project test
      # is slow-marked today (verified 2026-09-08); this gate keeps any future
      # slow-marked project regression off the PR path.
      - name: Run project tests (push/PR — slow deselected)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uv run python scripts/pipeline/stage_01_test.py \
            --project "${{ matrix.project }}" --project-only

      - name: Run project tests (scheduled/dispatch — slow included)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          uv run python scripts/pipeline/stage_01_test.py \
            --project "${{ matrix.project }}" --project-only --include-slow

      - name: Upload project coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: projects/${{ matrix.project }}/coverage_project.json
          flags: projects
          name: project-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 4b — fep_lean (real math-inc gauss + elan lake/lean; excluded from matrix above)
# This job uses projects/fep_lean/ paths.  When fep_lean is not checked out
# (it lives in the private repo's working/ pool), the detect job emits
# fep_lean=false and this job is skipped.  Check it out flat under projects/ to
# activate CI:
#   cp -r <private-projects>/working/fep_lean projects/fep_lean
# ─────────────────────────────────────────────────────────────────────────────
  fep-lean:
    name: fep_lean (gauss + lake)
    if: needs.detect.outputs.fep_lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [verify-no-mocks, detect]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - name: Sync dependencies (dev + optional test groups)
        run: uv sync --group rendering --group monitoring

      - name: Sync fep_lean project (explicit venv + dev extras)
        run: uv sync --directory projects/fep_lean --extra dev

      # CI-LEAN-CACHE-1: elan skips the multi-GB toolchain download when the
      # cached `~/.elan/toolchains` already holds the pinned toolchain; the
      # `.lake` build dir skips the multi-minute Lake rebuild when sources are
      # unchanged. Keys hash the fep_lean pin/manifest files (absent in the
      # public template → empty hash → cache miss, which actions/cache
      # tolerates; the job is skipped there anyway by `detect`).
      - name: Cache elan toolchains (lean-toolchain-keyed)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: elan-toolchains-${{ runner.os }}-${{ hashFiles('projects/fep_lean/lean/lean-toolchain') }}

      - name: Cache Lake build (lake-manifest-keyed)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projects/fep_lean/lean/.lake
          key: lake-build-${{ runner.os }}-${{ hashFiles('projects/fep_lean/lean/lake-manifest.json', 'projects/fep_lean/lean/lean-toolchain') }}
          restore-keys: |
            lake-build-${{ runner.os }}-

      - name: Install elan (lean + lake)
        run: |
          set -euxo pipefail
          curl -sSf \
            https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          echo "4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264  $RUNNER_TEMP/elan-init.sh" \
            | sha256sum --check --status
          sh "$RUNNER_TEMP/elan-init.sh" -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Pin Lean toolchain and warm Lake build
        working-directory: projects/fep_lean/lean
        run: |
          set -euxo pipefail

          elan override set "$TOOLCHAIN"
          lean --version
          lake --version
          lake build

      - name: Reject sorry in Lean sketches
        working-directory: projects/fep_lean/lean/FepSketches
        run: |
          set -euo pipefail
          SORRY_LINES=$(grep -n 'sorry' fep_all.lean Basic.lean \
            | grep -Ev ':[[:space:]]*--' || true)
          if [ -n "$SORRY_LINES" ]; then
            echo "ERROR: 'sorry' found in non-comment Lean lines:"
            echo "$SORRY_LINES"
            exit 1
          fi
          echo "No sorry in Lean sketches."

      - name: Install Open Gauss CLI
        timeout-minutes: 25
        env:
          OPEN_GAUSS_AUTO_ATTACH: "0"
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          git clone --depth 1 https://github.com/math-inc/OpenGauss.git "$RUNNER_TEMP/OpenGauss"
          cd "$RUNNER_TEMP/OpenGauss"
          # Pin to the reviewed HEAD SHA; update this value intentionally when upgrading.
          EXPECTED_SHA="f87633900ae185b8037bf451a914fe7eeae1eb08"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: OpenGauss HEAD SHA mismatch."
            echo "  Expected: $EXPECTED_SHA"
            echo "  Got:      $ACTUAL_SHA"
            echo "Update EXPECTED_SHA in .github/workflows/ci.yml after reviewing the diff."
            exit 1
          fi
          ./scripts/install.sh --plain --noninteractive --skip-system-packages
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v gauss
          gauss doctor

      - name: Run fep_lean tests (real gauss doctor + lake build)
        working-directory: projects/fep_lean
        env:
          COVERAGE_FILE: ../../.coverage.fep_lean
        run: >-
          uv run pytest tests/
          --timeout=1200
          --cov=src
          --cov-report=term-missing
          --cov-fail-under=89
          --durations=10
          -m "not requires_ollama"

# ─────────────────────────────────────────────────────────────────────────────
# Job 5 — Validate Manuscripts
# ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Manuscripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - name: Sync dependencies
        run: uv sync --locked --group installed-build

      - name: Install genuine Meta provider for public collection
        # Advanced imports its declared namespaced Meta engine. Collection uses
        # the selected root interpreter and admits a real, noneditable wheel.
        # Build outside source with the locked backend before observing counts.
        timeout-minutes: 5
        run: |
          provider=$(mktemp -d "$RUNNER_TEMP/template-meta-provider-source.XXXXXX")
          wheels=$(mktemp -d "$RUNNER_TEMP/template-meta-provider-wheel.XXXXXX")
          cp -R projects/templates/template_literature_meta_analysis/. "$provider/"
          uv build --wheel --no-build-isolation --python .venv/bin/python --out-dir "$wheels" "$provider"
          uv pip install --python .venv/bin/python --no-deps --reinstall "$wheels"/*.whl

      - name: Resolve public project names
        id: project-scope
        run: |
          set -euo pipefail
          names=$(uv run python -m infrastructure.project.public_scope project-names)
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Validate manuscript markdown
        # The `markdown` subcommand takes ONE directory; project globs
        # shell-globs to multiple dirs (CLI then errors "unrecognized
        # arguments"). Validate each public project's manuscript in turn.
        run: |
          set -euo pipefail
          for project in ${{ steps.project-scope.outputs.names }}; do
            d="projects/$project/manuscript"
            [ -d "$d" ] || continue
            echo "::group::validate $d"
            uv run python -m infrastructure.validation.cli markdown "$d"
            echo "::endgroup::"
          done

      - name: Verify api-reference.md is in sync with __all__
        # Auto-generated from each `infrastructure/<pkg>/__init__.py` `__all__`
        # by `scripts/docgen/api_reference.py`. Drift fails the build;
        # regenerate locally with `--write` and commit the result.
        run: uv run python scripts/docgen/api_reference.py --check

      - name: Verify exemplar_roster.md is in sync with the live roster
        # Auto-generated from the public exemplar roster by
        # `scripts/docgen/exemplar_roster.py`. Adding a test file to an
        # exemplar changes its row; without this gate the committed roster
        # drifted silently and was only caught by the full infra pytest run.
        # Drift fails the build; regenerate locally and commit the result.
        run: uv run python scripts/docgen/exemplar_roster.py --check

      - name: Verify COUNTS.md is in sync with the live tree
        # Auto-generated from live repo state by `scripts/docgen/counts.py`
        # (tracked infrastructure .py count, project/publishing test-collection
        # totals, exemplar roster, module list). Replaces the formerly
        # hand-maintained COUNTS.md whose drift was chased across ~40
        # commits. Drift fails the build; regenerate locally with `--write` and
        # commit the result.
        run: uv run python scripts/docgen/counts.py --check

      - name: Verify publication_records.md is in sync with public metadata
        run: uv run python scripts/docgen/publication_records.py --check

      - name: Verify project imports
        env:
          PUBLIC_PROJECTS: ${{ steps.project-scope.outputs.names }}
        # Public project names are now QUALIFIED (``templates/<name>``) and the
        # projects/ tree is not a Python package chain (no projects/__init__.py),
        # so a dotted ``projects.<name>.src`` import cannot resolve. Import each
        # project's ``src`` package in an ISOLATED subprocess with the project's
        # own sys.path (repo root for ``infrastructure``, project dir, and its
        # ``src``) — the same way pytest's pythonpath is configured — which also
        # avoids the top-level ``src`` name collision across projects.
        run: |
          uv run python -c "
          import os
          import subprocess
          import sys

          repo = os.getcwd()
          projects = os.environ['PUBLIC_PROJECTS'].split()
          if not projects:
              print('No projects found — skipping import check')
              sys.exit(0)
          failed = False
          for project in projects:
              proj_dir = os.path.join(repo, 'projects', *project.split('/'))
              env = dict(os.environ)
              env['PYTHONPATH'] = os.pathsep.join([repo, proj_dir, os.path.join(proj_dir, 'src')])
              result = subprocess.run([sys.executable, '-c', 'import src'], env=env, capture_output=True, text=True)
              if result.returncode == 0:
                  print(f'  OK: {project} (src)')
              else:
                  tail = (result.stderr.strip().splitlines() or [str(result.returncode)])[-1]
                  print(f'  FAIL: {project}: {tail}')
                  failed = True
          if failed:
              sys.exit(1)
          print(f'All {len(projects)} project(s) imported successfully')
          "

# ─────────────────────────────────────────────────────────────────────────────
# Job 6 — Security Scan
# ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - name: Sync dependencies
        run: uv sync

      - name: Resolve public project names
        id: security-scope
        run: |
          set -euo pipefail
          names=$(uv run python -m infrastructure.project.public_scope project-names)
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Dependency audit (pip-audit)
        run: |
          set -euo pipefail
          IGNORE_FILE=".github/pip-audit-ignore.txt"
          LOCK_REQUIREMENTS="${RUNNER_TEMP}/template-all-requirements.txt"
          uv run python scripts/gates/pip_audit_ignore_policy.py "$IGNORE_FILE"
          uv export --all-groups --all-extras --frozen --no-hashes \
            --no-emit-project --output-file "$LOCK_REQUIREMENTS"
          PIP_AUDIT_ARGS=()
          while IFS= read -r raw || [ -n "$raw" ]; do
            [[ "$raw" =~ ^[[:space:]]*# ]] && continue
            line="${raw%%#*}"
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            PIP_AUDIT_ARGS+=(--ignore-vuln "$line")
          done < "$IGNORE_FILE"
          audit_requirements() {
            local requirement_file="$1"
            for attempt in 1 2 3; do
              if uv run pip-audit --requirement "$requirement_file" \
                --no-deps --disable-pip "${PIP_AUDIT_ARGS[@]}"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "pip-audit attempt ${attempt} failed for ${requirement_file}; retrying in 15s..." >&2
                sleep 15
              fi
            done
            return 1
          }

          # Audit the complete root export and every canonical public exemplar
          # export. A clean root environment does not prove that an isolated
          # project's own lockfile is safe.
          audit_requirements "$LOCK_REQUIREMENTS"
          PUBLIC_REQUIREMENTS_DIR="${RUNNER_TEMP}/template-public-requirements"
          mkdir -p "$PUBLIC_REQUIREMENTS_DIR"
          for project in ${{ steps.security-scope.outputs.names }}; do
            slug="${project//\//-}"
            requirement_file="$PUBLIC_REQUIREMENTS_DIR/${slug}.txt"
            uv export --project "projects/$project" --all-extras --frozen \
              --no-hashes --no-emit-project --output-file "$requirement_file"
            echo "Auditing public exemplar export: $project"
            audit_requirements "$requirement_file"
          done

      - name: Code security scan (Bandit MEDIUM+ severity)
        run: |
          set -euo pipefail
          targets=(infrastructure scripts)
          for project in ${{ steps.security-scope.outputs.names }}; do
            targets+=("projects/$project")
          done
          uv run bandit -c bandit.yaml -r -ll "${targets[@]}"

      # Targeted shell-injection sweep at LOW severity: the MEDIUM+ gate above
      # rates a constant-string ``shell=True`` (B602/B604/B605/B609) as LOW and
      # so lets it pass. This always-on pass closes that gap across all three
      # trees; keep it green by never introducing ``shell=True`` / partial-path
      # ``os.system`` calls (use list-form argv with ``shell=False``).
      - name: Shell-injection sweep (Bandit B602/B604/B605/B609, LOW+)
        run: |
          set -euo pipefail
          targets=(infrastructure scripts)
          for project in ${{ steps.security-scope.outputs.names }}; do
            targets+=("projects/$project")
          done
          uv run bandit -c bandit.yaml -r \
            -t B602,B604,B605,B609 --severity-level low \
            "${targets[@]}"

# ─────────────────────────────────────────────────────────────────────────────
# Job 6b — Documentation Lint (mermaid + cross-links + consistency + doc pairs)
#
# Rules enforced:
#   1. Every fenced ```mermaid block in long-lived docs must render with the
#      real `mmdc` (mermaid-cli) binary backed by chrome-headless-shell.
#   2. Every relative Markdown link must resolve on disk (skipping fenced and
#      inline-code spans).
#   3. ``N Python (sub)packages`` claims in long-lived docs must match the
#      live count under ``infrastructure/``; rotating project names must not
#      appear unconditionally hard-coded outside ``docs/_generated/``.
#   4. Permanent-template content folders must carry paired ``AGENTS.md`` and
#      ``README.md`` files.
#
# This job intentionally fails LOUDLY when mmdc / chrome-headless-shell is
# missing instead of skipping — see ``infrastructure/validation/docs/mermaid_lint.py``.
# ─────────────────────────────────────────────────────────────────────────────
  docs-lint:
    name: Documentation Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - uses: ./.github/actions/setup-docs-lint

      - name: Sync Python dependencies
        run: uv sync

      - name: Run docs linters (mermaid + cross-links + consistency + doc pairs)
        run: uv run python scripts/audit/lint_docs.py --quiet

      - name: Check template exemplar drift (strict — dead links gate)
        run: uv run python scripts/audit/check_template_drift.py --strict

      - name: Skill-reachability gate (front-door links + index completeness)
        run: uv run python scripts/gates/skill_reachability_check.py

# ─────────────────────────────────────────────────────────────────────────────
# Job 7 — Performance Check
# ─────────────────────────────────────────────────────────────────────────────
  performance:
    name: Performance Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CI-FAST-PERF-1: no `needs:` - this job consumes no upstream artifacts
    # (import benchmarks + informational microbenches only), so declaring
    # `needs: [test-infra, test-project]` only serialized it after the slowest
    # project cell (~35-53 min) for no gate benefit. `ci-gate` still requires it.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env

      - name: Sync dependencies
        run: uv sync

      - name: Run import benchmarks
        run: |
          uv run python -c "
          import time
          import sys
          from pathlib import Path
          from infrastructure.project.public_scope import public_project_names

          MAX_IMPORT_SECONDS = 5.0
          results = {}

          # Infrastructure core
          t0 = time.perf_counter()
          try:
              import infrastructure.core
              results['infrastructure.core'] = time.perf_counter() - t0
          except ImportError as e:
              print(f'SKIP infrastructure.core: {e}')

          import subprocess
          import os
          projects = public_project_names(Path('.'))
          for project in projects:
              project_path = Path('.') / 'projects' / project
              project_dir = str(project_path)
              project_src_dir = str(project_path / 'src')
              label = f'projects/{project}/src'
              pythonpath = os.pathsep.join(
                  part for part in [project_dir, project_src_dir, os.environ.get('PYTHONPATH', '')] if part
              )
              env = {**os.environ, 'PYTHONPATH': pythonpath}
              t0 = time.perf_counter()
              proc = subprocess.run(
                  [sys.executable, '-c', 'import src'],
                  env=env, capture_output=True,
              )
              elapsed = time.perf_counter() - t0
              if proc.returncode == 0:
                  results[label] = elapsed
              else:
                  print(f'SKIP {label}: {proc.stderr.decode().strip()}')

          total = sum(results.values())
          print('Import timing:')
          for name, elapsed in results.items():
              print(f'  {elapsed:.3f}s  {name}')
          print(f'Total: {total:.3f}s (informational; public roster size dependent)')
          print(f'Per-import threshold: {MAX_IMPORT_SECONDS}s')

          slow = {name: elapsed for name, elapsed in results.items() if elapsed > MAX_IMPORT_SECONDS}
          if slow:
              print('ERROR: One or more imports exceed threshold')
              for name, elapsed in slow.items():
                  print(f'  {elapsed:.3f}s  {name}')
              sys.exit(1)
          print('Performance check passed')
          "

      # Informational microbench harness for setup_hook + analysis_pipeline (MED6).
      # `|| true` keeps this strictly informational — a slow bench will never
      # fail the build. Results are uploaded as a CI artifact for trend analysis.
      - name: Run setup_hook + analysis_pipeline microbenches (informational)
        run: |
          uv run pytest tests/infra_tests/benchmark/ -m bench --benchmark-only \
            --benchmark-min-rounds=3 --benchmark-json=bench-results.json \
            --timeout=180 || true

      - name: Upload microbench results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: warn

      # MED3 — coverage trend dashboard. Pulls last 30 days of CI artefacts
      # via `gh run download` and renders ``docs/_generated/coverage_history.md``.
      # Strictly informational (`|| true`); the result is uploaded as the
      # ``coverage-history`` artefact for trend review.
      - name: Generate coverage history dashboard (informational)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/docgen/coverage_history.py --from-gh --days=30 || true

      - name: Upload coverage history dashboard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-history
          path: docs/_generated/coverage_history.md
          if-no-files-found: warn

# ─────────────────────────────────────────────────────────────────────────────
# Job — Public-matrix receipt (weekly/manual only)
#
# The per-project test-projects jobs run one exemplar per matrix cell, so no
# single job can produce the aggregated public-matrix receipt. This scheduled
# lane runs the full receipt-bearing matrix in one process and uploads the
# deterministic receipt (roster revision, per-project floor/exit/coverage/
# output-isolation) for operator verification. Deliberately NOT run on push/PR
# — a full public matrix adds substantial runtime to every PR.
# ─────────────────────────────────────────────────────────────────────────────
  public-matrix-receipt:
    name: Public Matrix Receipt
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      - name: Sync dependencies (dev + optional test groups)
        run: uv sync --locked --group public-exemplars --group installed-build

      - name: Prepare exact standalone runtime dependencies
        # Same preparation as the test-project Autoresearch cell: warm the
        # root installed-build backend and the standalone runtime through the
        # offline fixture's exact installer while the network is allowed.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uv export --locked --only-group installed-build --no-emit-project \
            --no-header --no-annotate \
            --output-file "$RUNNER_TEMP/autoresearch-build-requirements.txt"
          uv export --project projects/templates/template_autoresearch_project \
            --locked --no-default-groups --no-emit-project --no-emit-local \
            --no-header --no-annotate \
            --output-file "$RUNNER_TEMP/autoresearch-runtime-requirements.txt"
          for kind in build runtime; do
            uv venv --no-project --no-python-downloads --python .venv/bin/python \
              "$RUNNER_TEMP/autoresearch-$kind-preparation"
            uv pip sync --no-config --no-build --require-hashes \
              --python "$RUNNER_TEMP/autoresearch-$kind-preparation/bin/python" \
              "$RUNNER_TEMP/autoresearch-$kind-requirements.txt"
          done

      - uses: ./.github/actions/setup-acceptance-fixtures

      - uses: ./.github/actions/setup-acceptance-documents

      - name: Prepare the exact harmonized Lean toolchain
        timeout-minutes: 20
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          echo "4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264  $RUNNER_TEMP/elan-init.sh" | sha256sum --check --status
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          active_pin=$(cat projects/templates/template_active_inference/lean/lean-toolchain)
          formal_pin=$(cat projects/templates/template_formal/formal/lean/lean-toolchain)
          test -n "$active_pin" && test "$active_pin" = "$formal_pin"
          "$HOME/.elan/bin/elan" toolchain install "$active_pin"
          java -version

      - name: Install the genuine selected Meta provider wheel
        timeout-minutes: 10
        run: |
          provider=$(mktemp -d "$RUNNER_TEMP/template-meta-provider-source.XXXXXX")
          wheels=$(mktemp -d "$RUNNER_TEMP/template-meta-provider-wheel.XXXXXX")
          cp -R projects/templates/template_literature_meta_analysis/. "$provider/"
          uv build --wheel --no-build-isolation --python .venv/bin/python --out-dir "$wheels" "$provider"
          uv pip install --python .venv/bin/python --no-deps --reinstall "$wheels"/*.whl

      - name: Provision the exact SIA sandbox image
        env:
          SIA_SANDBOX_IMAGE: python@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
        run: |
          docker pull "$SIA_SANDBOX_IMAGE"
          docker image inspect "$SIA_SANDBOX_IMAGE" --format '{{.Id}}'
          echo "TEMPLATE_SIA_TEST_IMAGE=$SIA_SANDBOX_IMAGE" >> "$GITHUB_ENV"

      - name: Run receipt-bearing public matrix
        run: >-
          uv run python scripts/pipeline/stage_01_test.py
          --project-only --all-projects --public-projects
          --project-workers auto
          --receipt public_matrix_receipt.json

      - name: Upload public-matrix receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-matrix-receipt
          path: public_matrix_receipt.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Final gate — single static check name for branch protection
  # ─────────────────────────────────────────────────────────────────────────────
  # GitHub cannot require dynamic matrix jobs by name, so branch protection on
  # main requires this one static job. It succeeds only when every upstream
  # job succeeded or was intentionally skipped by its own `if:` (e.g. the
  # schedule-only public-matrix-receipt on push/PR events).
  ci-gate:
    name: Hardening Gate
    if: always()
    needs:
      - detect
      - detect-projects
      - actionlint
      - lint
      - health
      - verify-no-mocks
      - setup-hook-windows-smoke
      - test-infra
      - coverage-infra
      - test-infra-slow
      - test-regression
      - test-integration
      - test-project
      - fep-lean
      - validate
      - security
      - docs-lint
      - performance
      - public-matrix-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate upstream job results
        id: results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REQUIRED_JOBS_JSON: ${{ needs.detect-projects.outputs.required_jobs }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON"
          if ! echo "$NEEDS_JSON" | jq -e --arg event "$EVENT_NAME" --argjson required "$REQUIRED_JOBS_JSON" '
            . as $needs |
            type == "object" and length > 0 and
            ($required | type == "array" and length > 0 and all(type == "string")) and
            (($required | length) == ($required | unique | length)) and
            ((keys | sort) == ($required | sort)) and
            (to_entries | all(
              .value.result == "success" or
              (.value.result == "skipped" and (
                (.key == "setup-hook-windows-smoke" and
                  $needs.detect.result == "success" and
                  $needs.detect.outputs.setup_hook == "false") or
                (.key == "fep-lean" and
                  $needs.detect.result == "success" and
                  $needs.detect.outputs.fep_lean == "false") or
                ((.key == "test-infra-slow" or .key == "public-matrix-receipt") and
                  ($event == "push" or $event == "pull_request"))
              ))
            ))
          ' > /dev/null; then
            echo "::error::A required CI job did not succeed or a conditional skip lacks its declared reason"
            exit 1
          fi
          echo "All required CI jobs succeeded (or were intentionally skipped)."
      - name: Summarize CI gate outcomes
        if: always()
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          GATE_OUTCOME: ${{ steps.results.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            # shellcheck disable=SC2016  # Markdown backticks are literal printf text.
            printf '### CI Gate\n\nSource: `%s` · job: `%s` · gate evaluation: `%s`\n\n' "$GITHUB_SHA" "$JOB_STATUS" "$GATE_OUTCOME"
            printf '| Required job | Outcome | Admitted skip reason |\n| --- | --- | --- |\n'
            jq -r --arg gate "$GATE_OUTCOME" --arg event "$EVENT_NAME" '
              to_entries[] | [ .key, .value.result,
                (if .value.result != "skipped" then ""
                 elif $gate != "success" then "not admitted by CI Gate"
                 elif .key == "setup-hook-windows-smoke" then "detect: setup_hook=false"
                 elif .key == "fep-lean" then "detect: fep_lean=false"
                 else "schedule/manual lane on " + $event end)
              ] | "| " + join(" | ") + " |"
            ' <<< "$NEEDS_JSON"
          } >> "$GITHUB_STEP_SUMMARY"
