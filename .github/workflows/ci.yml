name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      coverage-project:
        description: Optional exact public qualified name for own release-profile coverage
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: functional-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "true"
  MPLBACKEND: Agg

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        env:
          # rhysd/actionlint @ v1.7.12 — bump REF and VERSION together on upgrade
          ACTIONLINT_REF: 914e7df21a07ef503a81201c76d2b11c789d3fca
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_REF}/scripts/download-actionlint.bash" \
            -o "${RUNNER_TEMP}/download-actionlint.bash"
          echo "72fa3e45ac20f3c3a512d6747b4fcf719e21f890e8c43e78d48a41fdfb900c4e  ${RUNNER_TEMP}/download-actionlint.bash" \
            | sha256sum --check --status
          bash "${RUNNER_TEMP}/download-actionlint.bash" "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" -color

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
      - run: uv sync --locked
      - name: Check public source
        run: |
          set -euo pipefail
          PUBLIC_CI_PATHS=$(uv run python -m infrastructure.project.public_scope ci-paths)
          PUBLIC_CI_LINT_ROW=${PUBLIC_CI_PATHS%%$'\n'*}
          PUBLIC_CI_SOURCE_ROW=${PUBLIC_CI_PATHS#*$'\n'}
          [[ "$PUBLIC_CI_LINT_ROW" == lint_paths=* && "$PUBLIC_CI_SOURCE_ROW" == source_paths=* ]]
          read -r -a PUBLIC_CI_LINT_PATHS <<<"${PUBLIC_CI_LINT_ROW#lint_paths=}"
          read -r -a PUBLIC_CI_SOURCE_PATHS <<<"${PUBLIC_CI_SOURCE_ROW#source_paths=}"
          [[ ${#PUBLIC_CI_LINT_PATHS[@]} -gt 0 && ${#PUBLIC_CI_SOURCE_PATHS[@]} -gt 0 ]]
          uv run ruff check "${PUBLIC_CI_LINT_PATHS[@]}"
          uv run ruff format --check "${PUBLIC_CI_LINT_PATHS[@]}"
          uv run mypy "${PUBLIC_CI_SOURCE_PATHS[@]}"
      - name: Guard public data and secrets
        run: |
          set -euo pipefail
          uv run python scripts/audit/check_tracked_all.py
          uv run python scripts/audit/check_tracked_secrets.py
          uv run python scripts/audit/check_tracked_generated_artifacts.py
      - name: Check unsafe code and test replacement
        run: |
          set -euo pipefail
          uv run bandit -c bandit.yaml -r infrastructure scripts projects -ll
          uv run python scripts/audit/verify_no_mocks.py

  detect-projects:
    name: Public functional test selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      infra: ${{ steps.matrix.outputs.infra }}
      contracts: ${{ steps.matrix.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-env
      - run: uv sync --locked
      - name: Validate public templates and smoke roster
        id: matrix
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          uv run python scripts/gates/public_capabilities.py --ci-matrix-json > /dev/null
          uv run python -m infrastructure.core.testing.ci_selection --output functional-selection.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-selection
          path: functional-selection.json
          if-no-files-found: error

  test-infra:
    name: "Infrastructure Smoke (${{ matrix.shard }})"
    needs: detect-projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-projects.outputs.infra) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          dependency-group: installed-build
      - run: uv sync --locked --group installed-build
      - uses: ./.github/actions/setup-meta-provider
      - name: Prepare genuine PDF raster tools for behavioral controls
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftoppm -v
          pdffonts -v
      - uses: ./.github/actions/setup-acceptance-documents
        with:
          mode: converter
      - name: Select the installed browser for actual native controls
        run: |
          set -euo pipefail
          chrome=/opt/google/chrome/chrome
          test -f "$chrome" && test -x "$chrome" && test ! -L "$chrome"
          test -f /opt/google/chrome/resources.pak
          "$chrome" --version
          echo "CHROME_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: functional-selection
      - uses: ./.github/actions/setup-ci-execution-user
      - name: Run exact functional shard with original pytest observations
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user run \
            --state "$RUNNER_TEMP/template-ci-execution/state.json" -- \
            .venv/bin/python -m infrastructure.core.testing.ci_infra \
            --plan functional-selection.json --shard "$SHARD" \
            --directory "output/readiness/functional-infra/shard-$SHARD"
      - name: Export original readiness bytes for the artifact reader
        if: always()
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user export
          --state "$RUNNER_TEMP/template-ci-execution/state.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functional-infra-${{ matrix.shard }}
          path: ${{ env.TEMPLATE_CI_ARTIFACT_DIRECTORY }}/functional-infra/
          if-no-files-found: error

  test-contract:
    name: "Changed contract (${{ matrix.module }})"
    needs: detect-projects
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.detect-projects.outputs.contracts) }}
    steps:
      - name: Explicit no changed deep contract module
        if: matrix.shard == -1
        run: echo "No selected deep contract module; full release acceptance remains separate."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.shard != -1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup-python-env
        if: matrix.shard != -1
        with:
          dependency-group: installed-build
      - run: uv sync --locked --group installed-build
        if: matrix.shard != -1
      - uses: ./.github/actions/setup-meta-provider
        if: matrix.shard != -1
      - name: Prepare pinned document tools for the selected native consumer
        if: matrix.documents != 'none'
        uses: ./.github/actions/setup-acceptance-documents
        with:
          mode: ${{ matrix.documents }}
      - name: Prepare actual TeX and PDF readers for selected native contracts
        if: matrix.tex
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
          xelatex --version
          bibtex --version
          kpsewhich plainnat.bst
          kpsewhich seqsplit.sty
          kpsewhich lmodern.sty
          for tool in xdvipdfmx pdffonts pdftotext pdftoppm; do command -v "$tool"; done
      - name: Select the installed browser for the selected native consumer
        if: matrix.browser
        run: |
          set -euo pipefail
          chrome=/opt/google/chrome/chrome
          test -f "$chrome" && test -x "$chrome" && test ! -L "$chrome"
          test -f /opt/google/chrome/resources.pak
          "$chrome" --version
          echo "CHROME_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Prepare hash-required offline cache for independently installed native contracts
        if: >-
          matrix.module == 'tests/infra_tests/reporting/test_native_whole_portability.py' ||
          matrix.module == 'tests/infra_tests/reporting/test_native_hosted_credentials.py'
        timeout-minutes: 10
        uses: ./.github/actions/setup-native-offline-cache
      - name: Prepare the Active exemplar own locked environment for coverage probes
        if: >-
          matrix.module == 'tests/infra_tests/documentation/test_counts_coverage_support.py' ||
          matrix.module == 'tests/infra_tests/documentation/test_counts_coverage_measurement.py'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          unset UV_FROZEN
          # The probes consume this real project environment offline without syncing.
          # Copied interpreter entries keep nested runtime paths within the checkout.
          project=projects/templates/template_active_inference
          .venv/bin/python -m venv --copies "$project/.venv"
          uv sync --project "$project" --locked --extra dev \
            --no-python-downloads --python "$PWD/.venv/bin/python"

      - name: Warm locked offline wheels for the relocated-runner contract
        if: matrix.module == 'tests/infra_tests/documentation/test_counts_refresh.py'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Restoring .venv does not populate the fresh offline fixture's wheel cache.
          # Match its exact dev-only sync while leaving the restored environment intact.
          unset UV_FROZEN
          counts_contract_scratch=$(mktemp -d "$RUNNER_TEMP/counts-contract-warm.XXXXXX")
          UV_PROJECT_ENVIRONMENT="$counts_contract_scratch/venv" \
            uv sync --locked --only-group dev --no-install-project \
              --no-install-package desloppify --no-python-downloads --python .venv/bin/python
          rm -r -- "$counts_contract_scratch"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.shard != -1
        with:
          name: functional-selection
      - uses: ./.github/actions/setup-ci-execution-user
        if: matrix.shard != -1
      - name: Run one complete changed contract module with declared markers
        if: matrix.shard != -1
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user run \
            --state "$RUNNER_TEMP/template-ci-execution/state.json" -- \
            .venv/bin/python -m infrastructure.core.testing.ci_infra \
            --plan functional-selection.json --shard "$SHARD" \
            --directory "output/readiness/functional-infra/contract-$SHARD"
      - name: Export original readiness bytes for the artifact reader
        if: always() && matrix.shard != -1
        run: >-
          .venv/bin/python -m infrastructure.core.testing.ci_execution_user export
          --state "$RUNNER_TEMP/template-ci-execution/state.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.shard != -1
        with:
          name: functional-infra-contract-${{ matrix.shard }}
          path: ${{ env.TEMPLATE_CI_ARTIFACT_DIRECTORY }}/functional-infra/
          if-no-files-found: error

  test-project:
    name: "Project Smoke (${{ matrix.project }})"
    needs: detect-projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-projects.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
        with:
          dependency-group: installed-build
      - run: uv sync --locked --group installed-build
      - name: Build the standalone project wheel
        env:
          PROJECT: ${{ matrix.project }}
        run: uv build --wheel --no-build-isolation --python .venv/bin/python --out-dir "$RUNNER_TEMP/wheels" "projects/$PROJECT"
      - name: Prepare the declared Meta provider for Advanced Literature Review
        if: matrix.project == 'templates/template_advanced_literature_review'
        uses: ./.github/actions/setup-meta-provider
      - name: Prepare the bibliography converter for Search Project
        if: matrix.project == 'templates/template_search_project'
        uses: ./.github/actions/setup-acceptance-documents
        with:
          mode: converter
      - name: Run focused behavioral tests
        env:
          TEMPLATE_CI_JUNIT_DIRECTORY: ${{ runner.temp }}/functional-project
          PROJECT: ${{ matrix.project }}
        run: .venv/bin/python scripts/gates/ci_smoke.py --project "$PROJECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functional-project-junit-${{ strategy.job-index }}
          path: ${{ runner.temp }}/functional-project/
          if-no-files-found: error

  own-exemplar-coverage:
    name: Requested exemplar coverage
    if: github.event_name == 'workflow_dispatch' && inputs.coverage-project != ''
    uses: ./.github/workflows/exemplar-coverage.yml
    permissions:
      contents: read
    with:
      coverage-project: ${{ inputs.coverage-project }}

  ci-gate:
    name: CI Gate
    if: always()
    needs: [actionlint, lint, detect-projects, test-infra, test-contract, test-project, own-exemplar-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every functional job and the declared coverage outcome
        env:
          COVERAGE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-project != '' }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          case "$COVERAGE_REQUESTED" in
            true|false) ;;
            *) echo "coverage request must be the exact declared boolean" >&2; exit 1 ;;
          esac
          jq -e --arg requested "$COVERAGE_REQUESTED" '
            type == "object"
            and keys == ["actionlint", "detect-projects", "lint", "own-exemplar-coverage", "test-contract", "test-infra", "test-project"]
            and (del(."own-exemplar-coverage") | all(.[]; .result == "success"))
            and (."own-exemplar-coverage".result == (if $requested == "true" then "success" else "skipped" end))
          ' <<< "$NEEDS_JSON"
          echo "CI Gate passed for the functional jobs and declared coverage request." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: functional-selection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: functional-infra-*
          path: functional-infra-receipts
      - name: Require complete disjoint functional member receipts
        run: |
          .venv/bin/python -m infrastructure.core.testing.ci_infra \
            --plan functional-selection.json --directory functional-infra-receipts
