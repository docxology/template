name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      coverage-project:
        description: Optional exact public qualified name for own release-profile coverage
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: functional-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "true"
  MPLBACKEND: Agg

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        env:
          # rhysd/actionlint @ v1.7.12 — bump REF and VERSION together on upgrade
          ACTIONLINT_REF: 914e7df21a07ef503a81201c76d2b11c789d3fca
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_REF}/scripts/download-actionlint.bash" \
            -o "${RUNNER_TEMP}/download-actionlint.bash"
          echo "72fa3e45ac20f3c3a512d6747b4fcf719e21f890e8c43e78d48a41fdfb900c4e  ${RUNNER_TEMP}/download-actionlint.bash" \
            | sha256sum --check --status
          bash "${RUNNER_TEMP}/download-actionlint.bash" "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" -color

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
      - run: uv sync --locked
      - name: Check public source
        run: |
          set -euo pipefail
          PUBLIC_CI_PATHS=$(uv run python -m infrastructure.project.public_scope ci-paths)
          PUBLIC_CI_LINT_ROW=${PUBLIC_CI_PATHS%%$'\n'*}
          PUBLIC_CI_SOURCE_ROW=${PUBLIC_CI_PATHS#*$'\n'}
          [[ "$PUBLIC_CI_LINT_ROW" == lint_paths=* && "$PUBLIC_CI_SOURCE_ROW" == source_paths=* ]]
          read -r -a PUBLIC_CI_LINT_PATHS <<<"${PUBLIC_CI_LINT_ROW#lint_paths=}"
          read -r -a PUBLIC_CI_SOURCE_PATHS <<<"${PUBLIC_CI_SOURCE_ROW#source_paths=}"
          [[ ${#PUBLIC_CI_LINT_PATHS[@]} -gt 0 && ${#PUBLIC_CI_SOURCE_PATHS[@]} -gt 0 ]]
          uv run ruff check "${PUBLIC_CI_LINT_PATHS[@]}"
          uv run ruff format --check "${PUBLIC_CI_LINT_PATHS[@]}"
          uv run mypy "${PUBLIC_CI_SOURCE_PATHS[@]}"
      - name: Guard public data and secrets
        run: |
          set -euo pipefail
          uv run python scripts/audit/check_tracked_all.py
          uv run python scripts/audit/check_tracked_secrets.py
          uv run python scripts/audit/check_tracked_generated_artifacts.py
      - name: Check unsafe code and test replacement
        run: |
          set -euo pipefail
          uv run bandit -c bandit.yaml -r infrastructure scripts projects -ll
          uv run python scripts/audit/verify_no_mocks.py

  detect-projects:
    name: Public functional test selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
      - run: uv sync --locked
      - name: Validate public templates and smoke roster
        id: matrix
        run: |
          set -euo pipefail
          uv run python scripts/gates/public_capabilities.py --ci-matrix-json > /dev/null
          echo "matrix=$(uv run python scripts/gates/ci_smoke.py --matrix)" >> "$GITHUB_OUTPUT"

  test-infra:
    name: Infrastructure Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
      - run: uv sync --locked --group installed-build
      - uses: ./.github/actions/setup-meta-provider
      - name: Run pipeline and CI behavior tests
        run: |
          uv run python - <<'PYTHON'
          import subprocess, sys
          from pathlib import Path
          from infrastructure.core.testing.pytest_orchestration import resolve_infrastructure_test_paths
          paths = resolve_infrastructure_test_paths(Path.cwd(), "pipeline-smoke")
          paths.extend([
              "tests/infra_tests/core/test_ci_smoke.py",
              "tests/infra_tests/core/test_secure_write.py",
              "tests/infra_tests/config/test_acceptance_model.py",
              "tests/infra_tests/project/test_distribution_contract.py",
              "tests/infra_tests/project/test_acceptance_fixture_preparation.py",
              "tests/infra_tests/project/test_public_source_body_admission.py",
              "tests/infra_tests/reporting/test_native_tex_root_admission.py",
              "tests/infra_tests/reporting/test_native_installed_preparation_source.py",
              "tests/infra_tests/rendering/test_literature_hydration.py",
              "tests/infra_tests/rendering/test_shared_web_fonts.py",
          ])
          raise SystemExit(subprocess.run([
              sys.executable, "-m", "pytest", *paths, "--no-cov", "-q",
              "--timeout=60", "--benchmark-disable",
          ], check=False).returncode)
          PYTHON

  test-project:
    name: "Project Smoke (${{ matrix.project }})"
    needs: detect-projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-projects.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
      - run: uv sync --locked --group installed-build
      - name: Build the standalone project wheel
        env:
          PROJECT: ${{ matrix.project }}
        run: uv build --wheel --no-build-isolation --python .venv/bin/python --out-dir "$RUNNER_TEMP/wheels" "projects/$PROJECT"
      - name: Prepare the declared Meta provider for Advanced Literature Review
        if: matrix.project == 'templates/template_advanced_literature_review'
        uses: ./.github/actions/setup-meta-provider
      - name: Prepare the bibliography converter for Search Project
        if: matrix.project == 'templates/template_search_project'
        uses: ./.github/actions/setup-acceptance-documents
        with:
          mode: converter
      - name: Run focused behavioral tests
        env:
          PROJECT: ${{ matrix.project }}
        run: .venv/bin/python scripts/gates/ci_smoke.py --project "$PROJECT"

  own-exemplar-coverage:
    name: Requested exemplar coverage
    if: github.event_name == 'workflow_dispatch' && inputs.coverage-project != ''
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      COVERAGE_PROJECT: ${{ inputs.coverage-project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv sync --locked --group installed-build
      - name: Validate the requested public project
        run: |
          .venv/bin/python - <<'PYTHON'
          import os
          from infrastructure.project.public_scope import PUBLIC_PROJECT_NAMES
          if os.environ["COVERAGE_PROJECT"] not in PUBLIC_PROJECT_NAMES:
              raise SystemExit("coverage-project must be an exact canonical public qualified name")
          PYTHON
      - name: Prepare the own locked development environment
        run: |
          .venv/bin/python - <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          project = os.environ["COVERAGE_PROJECT"]
          command = ["uv", "sync", "--project", str(Path("projects") / project),
                     "--locked", "--extra", "dev", "--python", ".venv/bin/python"]
          if project == "templates/template_formal":
              command.extend(["--extra", "formal-tools"])
          subprocess.run(command, check=True)
          PYTHON
      - name: Warm the exact Autoresearch standalone dependencies
        if: inputs.coverage-project == 'templates/template_autoresearch_project'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          uv export --locked --only-group installed-build --no-emit-project --no-emit-local \
            --no-header --no-annotate --output-file "$RUNNER_TEMP/autoresearch-build-requirements.txt"
          uv export --project projects/templates/template_autoresearch_project \
            --locked --no-default-groups --no-emit-project --no-emit-local \
            --no-header --no-annotate --output-file "$RUNNER_TEMP/autoresearch-runtime-requirements.txt"
          for kind in build runtime; do
            uv venv --no-project --no-python-downloads --python .venv/bin/python \
              "$RUNNER_TEMP/autoresearch-$kind-preparation"
            uv pip sync --no-config --no-build --require-hashes \
              --python "$RUNNER_TEMP/autoresearch-$kind-preparation/bin/python" \
              "$RUNNER_TEMP/autoresearch-$kind-requirements.txt"
          done
      - uses: ./.github/actions/setup-meta-provider
        if: inputs.coverage-project == 'templates/template_advanced_literature_review'
        with:
          python-executable: projects/${{ inputs.coverage-project }}/.venv/bin/python
      - uses: ./.github/actions/setup-acceptance-documents
        with:
          mode: ${{ inputs.coverage-project == 'templates/template_eda_notebook' && 'native' || 'converter' }}
      - name: Prepare the selected pinned Lean toolchain
        if: inputs.coverage-project == 'templates/template_active_inference' || inputs.coverage-project == 'templates/template_formal'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 60 \
            https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          echo "4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264  $RUNNER_TEMP/elan-init.sh" | sha256sum --check --status
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ "$COVERAGE_PROJECT" = templates/template_formal ]; then
            pin=projects/templates/template_formal/formal/lean/lean-toolchain
          else
            pin=projects/templates/template_active_inference/lean/lean-toolchain
          fi
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '[:space:]' < "$pin")"
          if [ "$COVERAGE_PROJECT" = templates/template_formal ]; then java -version; fi
      - name: Acquire and verify Formal's exact declared tools
        if: inputs.coverage-project == 'templates/template_formal'
        timeout-minutes: 10
        run: >-
          projects/templates/template_formal/.venv/bin/python
          -m template_formal.tool_acceptance
          --project-root "$PWD/projects/templates/template_formal"
          --timeout 300 --acquire
      - name: Prepare the pinned SIA sandbox image
        if: inputs.coverage-project == 'templates/template_sia'
        env:
          SIA_SANDBOX_IMAGE: python@sha256:51dafde81dbdb6ebde285137a295cf18a47ca95234fe388a343719cb97305b3d
        run: |
          set -euo pipefail
          docker pull "$SIA_SANDBOX_IMAGE"
          docker image inspect "$SIA_SANDBOX_IMAGE" --format '{{.Id}}'
          echo "TEMPLATE_SIA_TEST_IMAGE=$SIA_SANDBOX_IMAGE" >> "$GITHUB_ENV"
      - name: Measure the complete own release-profile coverage
        run: |
          .venv/bin/python - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          from infrastructure.documentation.counts_coverage import exemplar_source_hash, measure_exemplar_coverage
          root = Path.cwd()
          project = os.environ["COVERAGE_PROJECT"]
          name = Path(project).name
          source_hash = exemplar_source_hash(root, name)
          measured = measure_exemplar_coverage(root, name)
          if exemplar_source_hash(root, name) != source_hash:
              raise SystemExit("coverage inputs changed during the measurement")
          output = root / "output/readiness/requested-exemplar-coverage.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({
              "schema_version": "template-requested-exemplar-coverage/v1",
              "project": project, "profile": "release",
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_hash": source_hash, "coverage_pct": measured,
          }, indent=2, sort_keys=True) + "\n")
          print(output.read_text())
          PYTHON
      - name: Retain the requested measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requested-exemplar-coverage
          path: output/readiness/requested-exemplar-coverage.json
          if-no-files-found: error

  ci-gate:
    name: CI Gate
    if: always()
    needs: [actionlint, lint, detect-projects, test-infra, test-project, own-exemplar-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every functional job and the declared coverage outcome
        env:
          COVERAGE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-project != '' }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          case "$COVERAGE_REQUESTED" in
            true|false) ;;
            *) echo "coverage request must be the exact declared boolean" >&2; exit 1 ;;
          esac
          jq -e --arg requested "$COVERAGE_REQUESTED" '
            type == "object"
            and keys == ["actionlint", "detect-projects", "lint", "own-exemplar-coverage", "test-infra", "test-project"]
            and (del(."own-exemplar-coverage") | all(.[]; .result == "success"))
            and (."own-exemplar-coverage".result == (if $requested == "true" then "success" else "skipped" end))
          ' <<< "$NEEDS_JSON"
          echo "CI Gate passed for the functional jobs and declared coverage request." >> "$GITHUB_STEP_SUMMARY"
