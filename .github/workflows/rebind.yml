name: Rebind rendered provenance

# Every rendered-provenance receipt binds the tracked implementation under
# `infrastructure/` and `scripts/` (package AGENTS.md/README.md/DESIGN.md are
# excluded) plus its exemplar's own source and config closure. A merged lock
# bump, an exemplar pyproject edit or an infrastructure change therefore
# invalidates all 25 receipts without moving a rendered byte: the tree is green
# when the pull-request head is verified and red on main after the merge. That is
# why no tag can be cut and stay valid while the dependency queue keeps merging.
#
# This job restamps the receipts on main as its own commit, proves the complete
# roster green on the tree that commit will contain, and only then pushes, so a
# tag can be cut at a commit whose receipts are current.
#
# Termination is structural, not a marker. The job acts only when the pushed
# range touched a receipt-affecting path, and its own commit touches only
# `projects/templates/*/output/reports/*.json`, which is outside that set: the
# second run skips and says so in the summary. `[skip ci]` is deliberately not
# used. The rebind commit is verified in-job by the same strict gates CI runs,
# and a push made with the repository's own GITHUB_TOKEN starts no new workflow
# run; if an exact-SHA `CI Gate` is later required for this commit (release
# sign-off), dispatch `ci.yml` manually for it.
on:
  push:
    branches: [main]

permissions:
  contents: write

# One rebind at a time. A later push queues behind the running rebind. If main
# advances while a rebind runs, the push is refused with an explicit message and
# the newer push event's own run rebinds the newer tip. There is no retry.
concurrency:
  group: rebind-rendered-provenance
  cancel-in-progress: false

env:
  UV_FROZEN: "true"
  MPLBACKEND: Agg

jobs:
  rebind:
    name: Rebind rendered provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the pushed commit with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Initialize submodules before any measurement
        id: submodules
        shell: bash
        run: |
          set -euo pipefail
          # The stage fingerprint of every receipt contains 125 records under
          # infrastructure/steganography/kmyth. Measuring without the submodule
          # reports drift that is not there, and a receipt stamped without it is
          # exactly what CI rejects later. Initialize first, then report the pin.
          git submodule update --init --recursive
          git submodule status --recursive
          echo "kmyth=$(git -C infrastructure/steganography/kmyth rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      - name: Prepare the locked environment
        run: uv sync --locked

      - name: Decide whether this push invalidates rendered receipts
        id: decide
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          target="${PUSH_AFTER:-HEAD}"
          if ! git cat-file -e "${target}^{commit}" 2>/dev/null; then target=$(git rev-parse HEAD); fi
          if [ -n "${PUSH_BEFORE}" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$PUSH_BEFORE" "$target")
            label="${PUSH_BEFORE:0:12}..${target:0:12}"
          elif git rev-parse -q --verify "${target}^" >/dev/null; then
            changed=$(git diff --name-only "${target}^" "$target")
            label="${target:0:12} (no usable before-commit)"
          else
            changed=$(git diff-tree --no-commit-id --name-only -r "$target")
            label="${target:0:12} (initial commit)"
          fi
          # Receipt-affecting surface, mirrored from
          # infrastructure/validation/rendered_snapshot/_records.py:
          #   * root .gitignore/.python-version/pyproject.toml/uv.lock
          #   * every tracked path under infrastructure/ and scripts/
          #   * every tracked path in an exemplar tree except output/ (the
          #     rebind's own footprint and the re-render surface, whose receipts
          #     a merged change carries itself) and the snapshot-excluded
          #     documentation names, which cannot move a fingerprint.
          is_receipt_affecting() {
            case "$1" in
              */AGENTS.md|*/README.md|*/SYNTAX.md|*/TO-DO.md|*/TODO.md) return 1 ;;
              projects/templates/*/output/*) return 1 ;;
              pyproject.toml|uv.lock|.python-version|.gitignore) return 0 ;;
              infrastructure/*|scripts/*) return 0 ;;
              projects/templates/*) return 0 ;;
            esac
            return 1
          }
          count=0
          affecting=""
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            count=$((count + 1))
            if is_receipt_affecting "$path"; then
              affecting="${affecting}${path}"$'\n'
            fi
          done <<< "$changed"
          n_affecting=$(printf '%s' "$affecting" | grep -c . || true)
          {
            echo "range=$label"
            echo "changed=$count"
            echo "affecting=$n_affecting"
          } >> "$GITHUB_OUTPUT"
          if [ "$n_affecting" -gt 0 ]; then
            echo "act=true" >> "$GITHUB_OUTPUT"
            echo "reason=$n_affecting receipt-affecting path(s) in $label" >> "$GITHUB_OUTPUT"
            printf 'receipt-affecting paths in %s:\n' "$label"
            printf '%s' "$affecting" | sed 's/^/  /'
          else
            echo "act=false" >> "$GITHUB_OUTPUT"
            echo "reason=no receipt-affecting path in $label ($count changed path(s))" >> "$GITHUB_OUTPUT"
            printf 'skip: no receipt-affecting path in %s (%s changed path(s))\n' "$label" "$count"
            printf '%s\n' "$changed" | head -20 | sed 's/^/  not receipt-affecting: /'
          fi

      - name: Rebind rendered receipts and stage the footprint
        id: rebind
        if: steps.decide.outputs.act == 'true'
        shell: bash
        env:
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # Pin the epoch to the triggering commit's committer timestamp: the
          # same value the manual rebind uses, and never the runner's clock.
          target="${PUSH_AFTER:-HEAD}"
          if ! git cat-file -e "${target}^{commit}" 2>/dev/null; then target=$(git rev-parse HEAD); fi
          epoch=$(git show -s --format=%ct "$target")
          export SOURCE_DATE_EPOCH="$epoch"
          {
            echo "SOURCE_DATE_EPOCH=$epoch"
            echo "TEMPLATE_BUILD_EPOCH_SOURCE=git:$target"
          } >> "$GITHUB_ENV"
          uv run --no-sync --offline python scripts/maintenance/refresh_rendered_provenance.py \
            --all-public --rebind --jobs 4
          # This is the last step that changes bytes. Staging below registers
          # them in the index so the strict gate's clean-index check sees the
          # worktree and the index agree, and so the commit contains exactly the
          # bytes that were verified. Nothing after this step writes a file.
          { git diff --name-only; git diff --cached --name-only; } | sort -u > "$RUNNER_TEMP/rebind-footprint.txt"
          while IFS= read -r path; do [ -n "$path" ] && git add -- "$path"; done < "$RUNNER_TEMP/rebind-footprint.txt"
          printf 'staged %s path(s)\n' "$(grep -c . "$RUNNER_TEMP/rebind-footprint.txt" || true)"

      - name: Verify both gates on the tree the commit will contain
        id: verify
        if: steps.decide.outputs.act == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A failure here means a human must look. There is no retry and no
          # override: this step exists so that a red gate can never be committed.
          set +e
          gate_output=$(uv run --no-sync --offline python scripts/audit/check_publication_outputs.py \
            --repo-root "$GITHUB_WORKSPACE" --all-public --strict --jobs 4 2>&1)
          gate_status=$?
          set -e
          printf '%s\n' "$gate_output"
          printf '%s\n' "$gate_output" > "$RUNNER_TEMP/publication-gate.txt"
          if [ "$gate_status" -ne 0 ]; then
            echo "::error::publication output gate failed (exit $gate_status); nothing will be committed"
            exit 1
          fi
          if ! printf '%s\n' "$gate_output" | grep -q 'blocking=0, review_required=0'; then
            echo "::error::publication output gate did not report blocking=0, review_required=0; nothing will be committed"
            exit 1
          fi
          uv run --no-sync --offline python -m infrastructure.validation.cli publication-audit \
            --all-public --strict --rendered

      - name: Commit the rebind
        id: commit
        if: steps.decide.outputs.act == 'true'
        shell: bash
        env:
          VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
          TRIGGER_REASON: ${{ steps.decide.outputs.reason }}
          TRIGGER_RANGE: ${{ steps.decide.outputs.range }}
          SUBMODULE_KMYTH: ${{ steps.submodules.outputs.kmyth }}
        run: |
          set -euo pipefail
          # Re-gated here, not only in the step condition: a failed verification
          # can never produce a commit, even if the job structure is edited.
          if [ "${VERIFICATION_OUTCOME:-missing}" != "success" ]; then
            echo "::error::refusing to commit: verification outcome was '${VERIFICATION_OUTCOME:-missing}', not success"
            exit 1
          fi
          changed=$( { git diff --name-only; git diff --cached --name-only; } | sort -u | grep -v '^$' || true )
          if [ -z "$changed" ]; then
            echo "nothing to commit; the receipts already match this tree"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The rebind footprint is confined to output/reports/, which is what
          # makes the loop terminate. Anything else is refused, not committed.
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^projects/templates/[^/]+/output/reports/[A-Za-z0-9_.-]+\.json$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::refusing to commit: the rebind changed paths outside its output/reports footprint"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          while IFS= read -r path; do [ -n "$path" ] && git add -- "$path"; done <<< "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          message="$RUNNER_TEMP/rebind-commit-message.txt"
          {
            printf 'chore(provenance): rebind rendered receipts after %s\n\n' "${GITHUB_SHA:0:12}"
            printf 'Restamps the rendered-provenance receipts of the 25 public exemplars for the\n'
            printf 'current stage, source and config closures. Trigger: %s. Range: %s.\n\n' "${TRIGGER_REASON}" "${TRIGGER_RANGE}"
            printf 'Verified on this tree before committing, with the submodule kmyth at %s:\n' "${SUBMODULE_KMYTH}"
            printf '  scripts/audit/check_publication_outputs.py --all-public --strict --jobs 4\n'
            printf '    -> blocking=0, review_required=0\n'
            printf '  python -m infrastructure.validation.cli publication-audit --all-public --strict --rendered\n'
            printf '    -> pass\n\n'
            printf 'SOURCE_DATE_EPOCH=%s (the triggering commit).\n' "${SOURCE_DATE_EPOCH}"
            printf 'The rebind is the last change in this commit; no rendered byte moved.\n'
          } > "$message"
          git commit -F "$message"
          {
            echo "committed=true"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git show -s --format=%T HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Push the rebind commit to main
        id: push
        if: steps.commit.outputs.committed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Refuse rather than race: if main moved while this rebind ran, the
          # newer push event's own run rebinds the newer tip. No force, no retry.
          git fetch --no-tags origin main
          remote=$(git rev-parse FETCH_HEAD)
          parent=$(git rev-parse HEAD^)
          if [ "$remote" != "$parent" ]; then
            echo "::error::main advanced to $remote while this rebind ran (expected parent $parent); not pushing. The newer push event's own run rebinds the newer tip."
            exit 1
          fi
          if ! git push origin HEAD:main 2> "$RUNNER_TEMP/push-error.txt"; then
            cat "$RUNNER_TEMP/push-error.txt" >&2
            if grep -qi 'protected branch\|required status check\|GH006' "$RUNNER_TEMP/push-error.txt"; then
              echo "::error::main refused a direct update from this token. This is a repository-setting question, not a rebind failure: allow the GitHub Actions app (or the pushing identity) to bypass the required 'CI Gate' check, or provide a token that may, then re-run. Nothing was pushed; main is unchanged."
            fi
            exit 1
          fi

      - name: Summarize the decision, the tree and the submodule
        if: always()
        shell: bash
        env:
          DECISION_ACT: ${{ steps.decide.outputs.act }}
          DECISION_REASON: ${{ steps.decide.outputs.reason }}
          DECISION_RANGE: ${{ steps.decide.outputs.range }}
          REBIND_OUTCOME: ${{ steps.rebind.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit }}
          TREE_SHA: ${{ steps.commit.outputs.tree }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          PUSHED_TREE: ${{ github.sha }}
        run: |
          set -euo pipefail
          submodule=$(git -C infrastructure/steganography/kmyth rev-parse HEAD 2>/dev/null || echo unavailable)
          head=$(git rev-parse HEAD 2>/dev/null || echo unavailable)
          # shellcheck disable=SC2016 # Backticks in printf formats are literal Markdown.
          {
            printf '### Rebind rendered provenance\n\n'
            printf -- '- Pushed tree: `%s` (HEAD now `%s`)\n' "${PUSHED_TREE:-unknown}" "$head"
            printf -- '- Submodule kmyth: `%s`\n' "$submodule"
            printf -- '- Decision: `%s` — %s\n' "${DECISION_ACT:-not evaluated}" "${DECISION_REASON:-no decision recorded}"
            printf -- '- Range: `%s`\n' "${DECISION_RANGE:-unknown}"
            printf -- '- Rebind: `%s` · Verify: `%s` · Commit: `%s` · Push: `%s`\n' \
              "${REBIND_OUTCOME:-skipped}" "${VERIFY_OUTCOME:-skipped}" "${COMMITTED:-false}" "${PUSH_OUTCOME:-skipped}"
            if [ -n "${COMMIT_SHA:-}" ]; then
              printf -- '- Rebind commit: `%s` (tree `%s`)\n' "$COMMIT_SHA" "${TREE_SHA:-unknown}"
            fi
            printf '\n'
            if [ "${DECISION_ACT:-}" != "true" ]; then
              printf 'Skipped: this push touched no receipt-affecting path, so no receipt can be stale.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
