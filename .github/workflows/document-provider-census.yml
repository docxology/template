name: Pinned deterministic document compiler census

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-document-compiler-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare reviewed signed Ubuntu acquisition
        uses: ./.github/actions/setup-acceptance-documents
        with:
          mode: converter
          python-executable: /usr/bin/python3
      - name: Prepare the signed native Nix client
        run: |
          set -euo pipefail
          sudo -n apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo -n apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends nix-bin nix-setup-systemd
          sudo -n nix-store --init
      - name: Collect actual pinned compiler and complete boot package database
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, shutil, subprocess, time
          from pathlib import Path
          root = Path('output/readiness/deterministic-document-compiler').resolve()
          root.mkdir(parents=True)
          deadline = time.monotonic() + 9000
          reference = 'git+https://github.com/lierdakil/pandoc-crossref?rev=e6c2ae3418dcf63f974802f8b7c105ebc299706c'
          expression = '''let
            upstream = builtins.getFlake "git+https://github.com/lierdakil/pandoc-crossref?rev=e6c2ae3418dcf63f974802f8b7c105ebc299706c";
            pkgs = import upstream.inputs.nixpkgs {
              system = "x86_64-linux";
              overlays = [ upstream.inputs.haskellNix.overlay ];
              inherit (upstream.inputs.haskellNix) config;
            };
          in pkgs.haskell-nix.compiler.ghc9122'''
          base = ['sudo', '-n', shutil.which('nix'), '--store', 'local', '--extra-experimental-features', 'nix-command flakes',
                  '--option', 'accept-flake-config', 'false', '--option', 'require-sigs', 'true',
                  '--option', 'max-jobs', '2', '--option', 'cores', '2',
                  '--option', 'substituters', 'https://cache.nixos.org https://cache.iog.io https://pandoc-crossref.cachix.org',
                  '--option', 'extra-trusted-public-keys',
                  'hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= pandoc-crossref.cachix.org-1:LI9ABFTkGpPCTkUTzoopVSSpb1a26RSTJNMsqVbDtPM=']
          def run(label, arguments, native=False):
              command = arguments if native else base + arguments
              with (root / (label + '.stdout')).open('xb') as stdout:
                  process = subprocess.run(command, stdout=stdout, check=False, timeout=max(0.001, deadline-time.monotonic()))
              (root / (label + '.command.json')).write_text(json.dumps({'argv': command, 'returncode': process.returncode}) + '\n')
              if process.returncode:
                  raise SystemExit(process.returncode)
              return (root / (label + '.stdout')).read_bytes()
          source = json.loads(run('source', ['flake', 'metadata', '--json', '--no-write-lock-file', '--no-update-lock-file', reference]))
          assert source['locked']['rev'] == 'e6c2ae3418dcf63f974802f8b7c105ebc299706c'
          assert source['locked']['narHash'] == 'sha256-+RpgwW3AmNjTLVfMK7SYjFPi/DlxesuXUtsWGtnm9oM='
          (root / 'compiler-expression.nix').write_text(expression + '\n')
          products = json.loads(run('compiler-build', ['build', '--json', '--no-write-lock-file', '--no-update-lock-file', '--out-link', str(root / 'compiler-runtime'), '--expr', expression]))
          assert len(products) == 1 and set(products[0]['outputs']) == {'out'}
          product = products[0]
          output = Path(product['outputs']['out'])
          run('compiler-recursive-derivations', ['derivation', 'show', '--recursive', product['drvPath']])
          run('compiler-runtime-verification', ['store', 'verify', '--recursive', str(output)])
          version = run('compiler-version', [str(output / 'bin/ghc'), '--numeric-version'], native=True).decode().strip()
          assert version == '9.12.2'
          options = run('compiler-options', [str(output / 'bin/ghc'), '--show-options'], native=True).decode().splitlines()
          assert '-fobject-determinism' in options
          packages = run('boot-packages', [str(output / 'bin/ghc-pkg'), '--global', 'list', '--simple-output'], native=True).decode().split()
          run('boot-package-database', [str(output / 'bin/ghc-pkg'), '--global', 'dump'], native=True)
          result = {'schema_version': 'template-document-compiler-census-v1', 'role': 'actual pinned compiler and boot package collection only',
                    'runtime_acceptance': False, 'source_commit': os.environ['GITHUB_SHA'], 'upstream_source': source['locked'],
                    'compiler': 'ghc-' + version, 'derivation': product['drvPath'], 'output': str(output), 'boot_packages': packages}
          (root / 'compiler-census.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PYTHON
      - name: Retain actual compiler and boot dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deterministic-document-compiler-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/readiness/deterministic-document-compiler/*.json
            output/readiness/deterministic-document-compiler/*.stdout
            output/readiness/deterministic-document-compiler/*.nix
          if-no-files-found: error
          retention-days: 30
