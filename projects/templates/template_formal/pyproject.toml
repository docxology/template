# template_formal — strongly-typed multiagent ant-robot colony exemplar.
# Inherits workspace tooling (uv, pytest, mypy, ruff) from the root pyproject.toml.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_formal"
version = "0.2.0"
license = {text = "MIT"}
description = "Strongly-typed multiagent ant-robot colony: ADTs, session-typed protocols, affine-discipline resource handles"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pyyaml>=6.0",
    "pillow>=12.3.0",
    "matplotlib>=3.8",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
formal-tools = [
    "research-project-template==4.4.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "mypy>=1.17.1",
    "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# `mypy --strict projects/templates/template_formal/src` is the authoritative
# oracle invocation (see tests/test_mypy_oracle.py). This section documents
# the same policy for editors/IDEs that discover config by directory.
[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[tool.uv]

[tool.uv.sources]
# Optional tool execution uses the genuine platform wheel outside this checkout.
research-project-template = { path = "../../..", editable = true }

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.4.1"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["network-faults", "lean", "tlc"]
