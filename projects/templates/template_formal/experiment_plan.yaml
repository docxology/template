schema_version: 1

conditions:
  - name: happy_path_protocol
    role: reference
    description: "Session-typed handshake protocol driven over the in-process bus with no fault injection enabled."
  - name: mypy_strict_oracle
    role: proposed
    description: "mypy --strict run against src/template_formal/ (expected zero exit) and against six known-bad tests/mypy_fixtures/ programs (expected non-zero exit each)."
  - name: fault_injected_protocol
    role: variant
    description: "Same handshake protocol with drop/reorder/duplicate/corrupt fault modes enabled independently via the deterministic-seed fault injector."
metrics:
  primary:
    name: mypy_exit_code_matches_expected_class
    direction: minimize
protocol: "Run tests/test_mypy_oracle.py, tests/network/test_bus.py, tests/network/test_handshake_over_bus.py, and tests/colony/test_colony_integration.py as real subprocess/pytest invocations; assert exit codes and typed Result variants directly against captured state, never against a scripted or hardcoded outcome."
expected_figures:
  - fig:demo-convergence
  - fig:convergence-tick-distribution
expected_tables: []
baselines:
  - happy_path_protocol
ablations:
  - fault_injected_protocol

# These axes are the typed configuration dimensions exercised by the real
# colony harness. Each value is a requested trial value, not an interpolated
# manuscript result; the linked experiment tests remain the executable proof.
ablation_axes:
  - name: deposit-channel
    parameter: deposit_amount
    values: [0.0, 1.0]
    negative_control: "zero deposit preserves the decision loop but removes pheromone feedback"
  - name: decay-response
    parameter: decay
    values: [0.1, 0.46, 0.97]
    negative_control: "extreme decay must remain distinguishable from the calibrated baseline"
  - name: sensing-noise
    parameter: sensing_noise_std
    values: [0.5, 4.0]
    negative_control: "high sensing noise must not be reported as a mechanism improvement"
  - name: sensor-cap
    parameter: sensed_concentration_cap
    values: [12.5, 15.0, 20.0]
    negative_control: "a cap outside the binding range must differ from a binding cap"
