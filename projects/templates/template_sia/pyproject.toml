[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_sia"
version = "0.2.0"
license = {text = "MIT"}
description = "Deterministic SIA self-improvement harness exemplar"
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.12"
dependencies = [
    "research-project-template==4.0.2",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# The Ollama path is explicitly opt-in; default project gates must remain
# credential- and service-free even when the marker is present.
addopts = "-v --tb=short --strict-markers -m 'not requires_ollama'"
markers = [
    "requires_ollama: needs local Ollama daemon",
    "slow: script and artifact integration checks kept for release profiles",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]

[tool.uv.sources]
# Local preparation uses this checkout; standalone execution uses its admitted wheel.
research-project-template = { path = "../../..", editable = true }

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.0.2"
tested_python_versions = ["3.12", "3.13", "3.14"]
required_unpaid_capabilities = ["local-proposals", "docker-sandbox"]
