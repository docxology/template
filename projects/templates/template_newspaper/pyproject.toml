# template_newspaper — exemplar large-format newspaper layout project
# Inherits workspace settings from the root pyproject.toml.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_newspaper"
version = "2.0.0"
license = {text = "MIT"}
description = "Data-driven large-format newspaper layout engine (ReportLab) that renders a 12-page US-tabloid edition (broadsheet optional) — 'The Triplicate' of Crescent City, CA — from structured YAML content."
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "research-project-template==4.4.1",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "Pillow>=12.3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools]
# Retain the authored source-root initializer in the installed wheel.
py-modules = ["__init__"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

# Compatibility contract for this independent exemplar release.
[tool.uv.sources]
# The exemplar consumes the platform SDK from the repository checkout; a standalone
# release substitutes its admitted wheel.
research-project-template = { path = "../../..", editable = true }

[tool.template]
platform_version = "4.4.1"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["print-raster"]
