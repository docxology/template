# template_newspaper — exemplar large-format newspaper layout project
# Inherits workspace settings from the root pyproject.toml.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_newspaper"
version = "2.0.0"
license = {text = "MIT"}
description = "Data-driven large-format newspaper layout engine (ReportLab) that renders a 12-page US-tabloid edition (broadsheet optional) — 'The Triplicate' of Crescent City, CA — from structured YAML content."
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "research-project-template==5.0.2",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    # 13.0.0 is the first Pillow release with no open advisory: 12.3.0 carries 130 critical and 598 high alerts in this repository. Do not lower this floor.
    "Pillow>=13.0.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools]
# Retain the authored source-root initializer in the installed wheel.
py-modules = ["__init__"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "requires_ollama: requires a live Ollama server and model; excluded by default and explicitly opt in with -m requires_ollama. See docs/development/optional-dependencies.md",
    "requires_docker: requires an explicitly prepared Docker daemon; excluded by default",
    "network: requires explicitly enabled live network access; provider eligibility and credentials must be verified before execution",
    "slow: mark test as slow running",
    "bench: performance benchmark tests",
    "benchmark: opt-in benchmark tests, including pytest-benchmark settings",
    "performance: opt-in performance suite alias; excluded by default",
    "long_running: heavy end-to-end test families; excluded by quick and release profiles",
    "private_project: tests for private sidecar project tooling",
    "external_fixture: tests requiring downloaded external fixture trees",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

# Compatibility contract for this independent exemplar release.
[tool.uv.sources]
# The exemplar consumes the platform SDK from the repository checkout; a standalone
# release substitutes its admitted wheel.
research-project-template = { path = "../../..", editable = true }

[tool.template]
platform_version = "5.0.2"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["print-raster"]
