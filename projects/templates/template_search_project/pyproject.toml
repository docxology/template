# Search uses the platform distribution as an explicit runtime dependency.
# The local uv resolver supports this checkout; standalone installs use an admitted
# platform 4.0.0 wheel and this project's wheel in a fresh selected environment.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_search_project"
# Intended independent release; historical sidecars retain their published version.
version = "0.2.0"
description = "Configurable literature-search → BibTeX → LLM-synthesis pipeline built on infrastructure/search and infrastructure/reference."
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

# Runtime dependencies for the *project-local* code in `src/`.
dependencies = [
    "requests>=2.32.0",
    "research-project-template==4.5.0",
    "pypdf>=6.16.1",
    "pyyaml>=6.0,<7.0",
    "matplotlib>=3.7,<4.0",
    "pillow>=12.3.0",
    "idna>=3.15",
    # `infrastructure/search/literature/backends.py` imports
    # `defusedxml.ElementTree` directly. Workspace mode picks it up
    # transitively through `py-serializable`; project-local venvs (used
    # by `execute_pipeline.py --core-only`) need it declared explicitly.
    "defusedxml>=0.7,<1.0",
]

[project.optional-dependencies]
# Test surface — `pytest-httpserver` is used to drive the HTTP backends
# in `infrastructure/search/literature/` without mocking network calls.
dev = [
    "pytest-timeout>=2.4.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-httpserver>=1.0.8",
]
# Mirrors the root project's optional groups so `uv sync --group rendering`
# and `uv sync --group llm` install the same deps when this project is
# used standalone. Keep these in sync with the root pyproject.toml.
rendering = [
    "pypdf>=6.16.1",
    "reportlab>=4.0.0",
]
llm = [
    "ollama>=0.3.0",
    "requests>=2.31.0",
    "urllib3>=2.7.0",
]

[tool.setuptools]
# Retain the authored source-root initializer in the installed wheel.
py-modules = ["__init__"]

[tool.setuptools.packages.find]
# Explicit src-anchored discovery: the exemplar's importable package lives at
# `src/template_search_project` (nested unique-package layout), so an
# editable/wheel install must expose `template_search_project.*` — not a
# phantom top-level `src` module (packages = ["src"] predates the
# SUBMODULAR-SEARCH-1 split). The include filter keeps discovery explicit —
# no unintended top-level packages auto-discovered from this directory.
where = ["src"]
include = ["template_search_project*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.5.0"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["retrieval", "fulltext", "local-synthesis"]

[tool.uv.sources]
research-project-template = { path = "../../..", editable = true }
