# Literature-search exemplar: the domain src/ layer is a thin wrapper around
# infrastructure.search / infrastructure.reference / infrastructure.llm /
# infrastructure.reporting / infrastructure.core.logging — every file below
# imports one of those directly by design (this project's whole purpose is
# orchestrating those infrastructure capabilities for the literature-search
# workflow), so each is declared here per the layer-boundary contract
# infrastructure/project/drift/checks_boundary.py enforces. Paths updated to
# the post-split subpackage layout (SUBMODULAR-SEARCH-1).
allow_infrastructure_imports:
  - src/template_search_project/pipeline/composition.py
  - src/template_search_project/publish/dashboard.py
  - src/template_search_project/search/deep_search.py
  - src/template_search_project/search/deep_search_cli.py
  - src/template_search_project/publish/figures.py
  - src/template_search_project/pipeline/llm_runtime.py
  - src/template_search_project/pipeline/pipeline.py
  - src/template_search_project/analysis/report.py
  - src/template_search_project/search/search_pipeline_cli.py
  - src/template_search_project/pipeline/synthesis.py
