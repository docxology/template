reason: >-
  The typed domain config loader uses the declared platform's immutable UTF-8
  stream to preserve exact admitted input bytes and ordinary loader semantics.
  Bibliography projection uses mature citation parsing and confined atomic I/O
  to preserve authored references. Deep composition uses the platform's held
  no-follow source inventory for a current disk-source artifact dependency
  record, separate from audited live-provider and installed-wheel acceptance.
  Manuscript hydration uses the same confined atomic writes and confined
  generated-file removal to keep active outputs from aliasing authored sources.
