[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_autopoiesis"
version = "2.0.0"
license = {text = "MIT"}
description = "Autopoietic project generator: combinatoric specification, infrastructure realization, and recompute-verified provenance"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "research-project-template==4.4.1",
    # Default realization executes and checks each generated child's real tests.
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "numpy",
    "matplotlib",
    "pyyaml",
    "qrcode",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout>=2.4.0",
    "hypothesis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.uv.sources]
# Local preparation uses this checkout; standalone execution uses its admitted wheel.
research-project-template = { path = "../../..", editable = true }

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.4.1"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["child-execution"]
