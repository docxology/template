[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_active_inference"
version = "0.4.0"
license = {text = "MIT"}
description = "Multi-track Active Inference exemplar: analytical + pymdp + sheaf manuscript + Lean/GNN/ontology. Track/fragment counts are registry-backed (manuscript/sheaf/tracks.yaml); not hard-coded here."
authors = [{ name = "Daniel Ari Friedman", email = "daniel@activeinference.institute" }]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "inferactively-pymdp==1.0.3",
]

[project.optional-dependencies]
dev = [
    "research-project-template==4.5.0",
    "defusedxml>=0.7.1",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "coverage>=7.13.2",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "requires_pymdp: tests that import inferactively-pymdp",
    "long_running: end-to-end or heavy test families that take minutes",
    "slow: tests retained for release profiles but omitted from the quick inner loop",
    "requires_gate_artifacts: tests that consume the real-tree hydrated gate-artifact cache",
    "timeout(seconds): per-test timeout for artifact write/validate isolation checks",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2

[tool.template]
acceptance_test_groups = "orchestration.full_verification:_validated_coverage_test_groups"
platform_version = "4.5.0"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["pymdp", "lean"]
# Test prepared artifacts exactly once through isolated --cov-append groups.
# Explicit full verification separately regenerates research and publication outputs.
project_test_command = ["python", "scripts/run_full_verification.py", "--coverage-only"]
project_test_profile_argument = "--profile"

[tool.uv]

[tool.uv.sources]
research-project-template = { path = "../../..", editable = true }
