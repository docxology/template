# Harness exemplar: infrastructure imports confined to the loop cluster and
# writers/security/ml payload builders (post-split subpackage layout). Standalone
# domain modules must stay infra-free.
allow_infrastructure_imports:
  - src/template_autoresearch_project/loop/loop.py
  - src/template_autoresearch_project/loop/config.py
  - src/template_autoresearch_project/loop/loop_phases.py
  - src/template_autoresearch_project/writers/manifests.py
  - src/template_autoresearch_project/writers/loop_artifacts.py
  - src/template_autoresearch_project/writers/benchmark.py
  - src/template_autoresearch_project/security/payloads.py
  - src/template_autoresearch_project/writers/research_object.py
  - src/template_autoresearch_project/ml/selection.py
