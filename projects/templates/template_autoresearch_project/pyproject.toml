[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_autoresearch_project"
version = "0.4.0"
license = {text = "MIT"}
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
description = "Deterministic bounded AutoResearch ML-loop exemplar for the template repository."
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "research-project-template==4.5.0",
    "numpy>=1.26",
    "matplotlib>=3.7",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
# `infrastructure` resolves through the declared research-project-template
# dependency installed in the prepared environment. A lexical "../../.." entry
# would import platform modules through a non-normalized alias path that the
# executed-bytecode audit cannot bind to its admitted platform root.
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: full-loop and generated-figure integration checks kept for release profiles",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv.sources]
# Local preparation uses this checkout; standalone execution uses its admitted wheel.
research-project-template = { path = "../../..", editable = true }

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.5.0"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = []
