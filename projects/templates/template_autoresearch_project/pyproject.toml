[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_autoresearch_project"
version = "0.4.0"
license = {text = "MIT"}
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
description = "Deterministic bounded AutoResearch ML-loop exemplar for the template repository."
requires-python = ">=3.12"
dependencies = [
    "research-project-template==4.0.0",
    "numpy>=1.26",
    "matplotlib>=3.7",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
# Project lives at projects/templates/<name>/; the repo root (which holds
# `infrastructure/`) is three levels up, so the documented per-project pytest
# command resolves `infrastructure` without an externally supplied PYTHONPATH.
pythonpath = ["../../..", ".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: full-loop and generated-figure integration checks kept for release profiles",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv.sources]
# Local preparation uses this checkout; standalone execution uses its admitted wheel.
research-project-template = { path = "../../..", editable = true }

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.0.0"
tested_python_versions = ["3.12", "3.13", "3.14"]
required_unpaid_capabilities = []
