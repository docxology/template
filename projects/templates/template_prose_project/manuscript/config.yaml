metadata:
  license: MIT
  language: en
manuscript_dir: manuscript
render:
  formats:
    pdf: true
    html: true
    slides: true
    docx: false
    epub: false
prose:
  preset: lenient
  target_grade_level_min: 10.0
  target_grade_level_max: 18.0
  long_sentence_threshold: 35
  citation_density_min_per_1000: 0.0
  require_h1_per_section: true
  forbid_skipped_levels: true
bibliography:
  references_path: manuscript/references.bib
  fail_on_missing: true
  fail_on_unused: false
report:
  output_path: output/review_report.md
  include_per_file_table: true
  include_outline: true
  include_quality_flags: true
llm:
  review:
    enabled: false
    provider: local_transcript
    model: ''
    transcript_path: output/.pipeline/prose_review/latest.json
