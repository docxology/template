# template_prose_project — exemplar prose-focused research project
# Runtime scripts use the declared Layer-1 package; local uv preparation resolves it here.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_prose_project"
version = "0.5.0"
license = {text = "MIT"}
description = "Configurable prose-analysis pipeline (readability + structure + quality + reference checking) built on infrastructure/prose and infrastructure/reference."
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "research-project-template==4.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pillow>=12.3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]

[tool.uv.sources]
# Checkout preparation uses Layer 1 locally; installed acceptance requires its wheel.
research-project-template = { path = "../../..", editable = true }

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.1.0"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["local-review"]
