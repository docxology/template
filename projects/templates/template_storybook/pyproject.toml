[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_storybook"
version = "0.2.0"
license = {text = "MIT"}
description = "A full-page illustrated storybook exemplar with data-owned pages, shape-character generation, and ReportLab PDF assembly."
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.12"
dependencies = [
    "Pillow>=12.3.0",
    "pyyaml>=6.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools]
# Retain the authored source-root initializer in the installed wheel.
py-modules = ["__init__"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.0.2"
tested_python_versions = ["3.12", "3.13", "3.14"]
required_unpaid_capabilities = ["print-raster"]
