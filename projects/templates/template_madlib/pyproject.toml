[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_madlib"
version = "0.2.0"
license = {text = "MIT"}
description = "Deterministic token-injection exemplar for conditional IMRAD manuscripts with cover, pipeline, and configured-field visualizations"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "research-project-template==4.1.0",
    "matplotlib>=3.7.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: artifact-generation and manuscript integration checks kept for release profiles",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]

# Compatibility contract for this independent exemplar release.
[tool.uv.sources]
research-project-template = {path = "../../..", editable = true}

[tool.template]
platform_version = "4.1.0"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = []
