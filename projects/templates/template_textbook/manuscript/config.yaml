  - open textbook
  - modular manuscript
  - reproducible publishing
  - computational backbone
  - Python
analysis:
  scripts:
  - generate_figures.py
  - generate_diagrams.py
  - analysis.py
layout:
  page_size: letter
  margin_top_mm: 18
  margin_bottom_mm: 18
  margin_left_mm: 18
  margin_right_mm: 18
  margin_inner_extra_mm: 0
  line_height: 1.3
  text_width_fraction: 0.92
typography:
  body_font: Linux Libertine O
  heading_font: Linux Biolinum O
  mono_font: DejaVu Sans Mono
  base_font_size_pt: 10
  link_color: '#1A5276'
  link_color_internal: '#1A5276'
  link_color_external: '#1A5276'
  link_underline: true
front_matter:
  files:
  - file: front_matter.md
    title: Front Matter
  - file: preface.md
    title: Preface
  page_two_quote:
    text: A model becomes useful when its assumptions, computations, and limits can
      be inspected.
    attribution: The Template Textbook
  page_two_acknowledgements:
    title: Acknowledgements
    text: This book draws on openly documented scientific computing practices and
      verified primary publications. Its numerical scenarios and bundled data are
      instructional examples; no new empirical study is claimed.
  include_front_matter: true
  include_preface: true
rendering:
  number_chapters: true
  number_figures: true
  number_equations: true
  number_tables: true
  toc_depth: 2
render:
  formats:
    pdf: true
    html: true
    epub: true
    docx: true
    slides: false
project_config:
  pedagogy:
    default_lecture_minutes: 45
    worked_chapter_read_minutes: 40
    default_lab_minutes: 60
    extended_case_study_lab_minutes: 75
  evidence:
    numeric_fact_registry: data/numeric_facts.yaml
    diagram_specs: src/mermaid/diagram_specs.yaml
