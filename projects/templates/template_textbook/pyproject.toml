# template_textbook — exemplar book-length manuscript scaffold
# Inherits workspace settings from the root pyproject.toml.
#
# This template demonstrates the *modular textbook* shape: a data-driven
# manuscript (parts -> chapters -> sections), a tested computational backbone
# under src/, deterministic figure + diagram generators, and a content
# scaffolding/validation engine that lets authors fill marked stubs out to
# hundreds or thousands of pages without drifting from the structural contract.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_textbook"
version = "0.2.0"
license = {text = "CC-BY-4.0"}
description = "Modular, fillable textbook scaffold: data-driven manuscript (parts/chapters/labs/questions), tested computational backbone, deterministic figures + Mermaid diagrams, and a content scaffold/validation engine."
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "defusedxml>=0.7.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "research-project-template==5.2.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
visuals = [
    # 13.0.0 is the first Pillow release with no open advisory: 12.3.0 carries 130 critical and 598 high alerts in this repository. Do not lower this floor.
    "pillow>=13.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: renderer and full-manuscript integration checks kept for release profiles",
    "requires_ollama: requires a live Ollama server and model; excluded by default and explicitly opt in with -m requires_ollama. See docs/development/optional-dependencies.md",
    "requires_docker: requires an explicitly prepared Docker daemon; excluded by default",
    "network: requires explicitly enabled live network access; provider eligibility and credentials must be verified before execution",
    "bench: performance benchmark tests",
    "benchmark: opt-in benchmark tests, including pytest-benchmark settings",
    "performance: opt-in performance suite alias; excluded by default",
    "long_running: heavy end-to-end test families; excluded by quick and release profiles",
    "private_project: tests for private sidecar project tooling",
    "external_fixture: tests requiring downloaded external fixture trees",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

[tool.uv.sources]
# Development tests use the declared SDK; standalone execution uses its admitted wheel.
research-project-template = { path = "../../..", editable = true }

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "5.2.0"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = []
