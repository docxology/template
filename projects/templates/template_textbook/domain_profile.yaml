domain: modular_textbook
display_name: Authored Systems and Models Textbook
required_packages:
  - matplotlib
  - pyyaml
  - pytest
preferred_outputs:
  - pdf
  - html
  - epub
  - docx
validation_gates:
  - manuscript_structure
  - scaffold_integrity
  - render_validation
  - publication_readiness
figure_types:
  - model_curve
  - instructional_errorbar
  - gallery_figure
  - mermaid_diagram
citation_policy: official_or_scholarly
source_policy: >-
  Treat manuscript/config.yaml as the units structure source of truth. Canonical
  content is authored; scaffold fixtures remain separate drafts. Instructional
  data and model examples must not be presented as new empirical measurements.
review_gates:
  - manuscript_structure
  - scaffold_integrity
  - manuscript_completion
  - publication_readiness
artifact_expectations:
  - output/data/worked_model_summary.json
  - output/figures/part_0_orientation.png
  - output/figures/gallery/gallery_line.png
  - output/pdf/template_textbook_combined.pdf
benchmark_rubric:
  name: modular-textbook-readiness
  dimensions:
    - name: config_schema_validity
      weight: 2.0
    - name: authored_content_completeness
      weight: 2.0
    - name: figure_generation
      weight: 1.0
    - name: evidence_claim_honesty
      weight: 1.5
    - name: render_success
      weight: 1.0
llm_prompt_guidance: >-
  Check canonical content, computations, primary references, and explicit model
  assumptions. Require completion across all configured sections. Keep new draft
  scaffolds and historical publication evidence distinct from intended releases.
