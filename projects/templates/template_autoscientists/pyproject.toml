# AutoScientists Template Configuration
# Inherits workspace settings from root pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_autoscientists"
version = "2.0.0"
license = {text = "MIT"}
description = "Deterministic reference implementation of the AutoScientists self-organizing agent coordination model"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "requests>=2.32.0",
    "research-project-template==4.1.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest-timeout>=2.4.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos; the live-agent path is opt-in only.
addopts = "-v --tb=short --strict-markers -m 'not requires_ollama'"
markers = [
    "requires_ollama: actual selected installed local model acceptance; missing capability fails",
]

[tool.coverage.run]
# Coverage is measured on src/ only; the deterministic core is the gated surface.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ includes the live adapter's strict domain and real HTTP controls.
# Actual installed-model acceptance remains explicitly opt-in.
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    # Protocol method stubs are type-only and never executed.
    "^\\s*\\.\\.\\.$",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.1.0"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["local-coordination"]

[tool.uv.sources]
research-project-template = { path = "../../..", editable = true }
