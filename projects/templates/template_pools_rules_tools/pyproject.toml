# Pools, Rules, and Tools — Meta-Project Configuration
# Demonstrates integration of fonds/, tools/, and rules/ resource directories.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_pools_rules_tools"
version = "2.0.0"
license = {text = "CC-BY-4.0"}
description = "Meta-project demonstrating fonds, tools, and rules integration"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "research-project-template==5.2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    # 13.0.0 is the first Pillow release with no open advisory: 12.3.0 carries 130 critical and 598 high alerts in this repository. Do not lower this floor.
    "pillow>=13.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
    "hypothesis>=6.100.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "requires_ollama: requires a live Ollama server and model; excluded by default and explicitly opt in with -m requires_ollama. See docs/development/optional-dependencies.md",
    "requires_docker: requires an explicitly prepared Docker daemon; excluded by default",
    "network: requires explicitly enabled live network access; provider eligibility and credentials must be verified before execution",
    "slow: mark test as slow running",
    "bench: performance benchmark tests",
    "benchmark: opt-in benchmark tests, including pytest-benchmark settings",
    "performance: opt-in performance suite alias; excluded by default",
    "long_running: heavy end-to-end test families; excluded by quick and release profiles",
    "private_project: tests for private sidecar project tooling",
    "external_fixture: tests requiring downloaded external fixture trees",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
allow_untyped_defs = false
disallow_any_unimported = true
disallow_any_explicit = true
disallow_any_expr = false
disallow_any_decorated = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["yaml", "csv", "matplotlib.*"]
ignore_missing_imports = true

[tool.ruff]
# Source stays parseable by pre-3.14 parsers, so the formatter keeps optional
# `except (A, B):` parentheses; the runtime floor remains `requires-python`.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "E501", "N999"]  # Executable stage names and path bootstrap imports

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "5.2.0"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["bundled-resource-execution"]

[tool.uv.sources]
research-project-template = { path = "../../..", editable = true }
