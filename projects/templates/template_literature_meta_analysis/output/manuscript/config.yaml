- cognitive enhancement
- reproducible research
metadata:
  license: CC-BY-4.0
  language: en
  repository: https://github.com/docxology/template_literature_meta_analysis
llm:
  reviews:
    enabled: true
    types:
    - executive_summary
  translations:
    enabled: true
    languages:
    - zh
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0
analysis:
  scripts:
  - 02_meta_analysis_pipeline.py
  - 04_generate_figures.py
  - 06_fulltext_assessment.py
  - 07_literature_evaluation.py
  - 08_deep_research_dispatch.py
  - 09_export_bibliography.py
  - 05_inject_variables.py
project_config:
  search:
    term: modafinil
    start_year: 1990
    query: '"modafinil" OR "provigil" OR "armodafinil"'
    max_results: 1000
    resume: true
    clear_corpus: false
    engines:
      arxiv: true
      openalex: true
      semantic_scholar: true
      crossref: true
      pubmed: true
      sovietrxiv: true
      chinarxiv: true
      europepmc: true
      biorxiv: true
      medrxiv: true
    sovietrxiv:
      api_email: ''
      source: ''
    chinarxiv:
      api_email: ''
    arxiv_queries:
    - all:"modafinil"
    - all:"armodafinil"
    - all:"wakefulness promoting agent"
    - all:"modafinil" AND all:"cognition"
    relevance_keywords:
    - modafinil
    - armodafinil
    - provigil
    - wakefulness
    - narcolepsy
    - cognitive enhancement
    - alertness
    - sleep deprivation
    - vigilance
    - eugeroic
  fulltext:
    enabled: false
    unpaywall_email: ''
    download_dir: output/fulltext
  embeddings:
    method: tfidf_svd
    n_components: 50
    max_features: 2000
    seed: 42
  sampling:
    fraction: 0.05
    seed: 42
  knowledge_graph:
    resume: true
    checkpoint_interval: 50
    checkpoint_path: output/data/nanopublications.jsonl
    clear_assertions: false
    max_papers: null
  llm_extraction:
    model: gemma3:4b
    base_url: http://localhost:11434
    temperature: 0.1
    max_tokens: 2048
    timeout_seconds: 120
    max_retries: 3
    min_confidence: 0.6
  reproducibility_assessment:
    checkpoint_interval: 50
    clear_workflow_graphs: false
    max_papers: null
    llm_model: gemma3:4b
    llm_url: http://localhost:11434
    llm_temperature: 0.1
    llm_max_tokens: 2048
    llm_timeout: 120
    llm_max_retries: 3
    content_weights:
      sources: 0.3
      methods: 0.2
      experiments: 0.2
      sinks: 0.3
    structural_weights:
      source_consumption: 0.25
      sink_production: 0.25
      reference_resolution: 0.2
      path_coverage: 0.15
      cohesion: 0.15
    low_score_threshold: 0.4
    fuzzy_quote_threshold: 0.85
  hypothesis_definitions:
    H1:
      id: PRIMARY_EFFICACY
      name: Wakefulness Efficacy
      description: Modafinil reliably promotes wakefulness in sleep-disorder populations
        (narcolepsy, shift-work, OSA)
      scope: clinical
    H2:
      id: OPTIMAL_PERFORMANCE
      name: Cognitive Enhancement
      description: Modafinil improves attention, working memory, and executive function,
        especially under sleep deprivation
      scope: cognitive
    H3:
      id: MECHANISTIC_BASIS
      name: Low Abuse Liability
      description: Modafinil has lower abuse potential and dependence risk than classical
        psychostimulants
      scope: safety
    H4:
      id: PROCESS_MODEL
      name: Dopaminergic Mechanism
      description: Modafinil acts substantially via dopamine-transporter inhibition
        rather than a purely novel mechanism
      scope: pharmacological
    H5:
      id: SCALABILITY
      name: Off-label Psychiatric Utility
      description: Modafinil is a useful adjunct for fatigue and cognition in psychiatric
        and neurological conditions
      scope: applied
    H6:
      id: CLINICAL_UTILITY
      name: Tolerability
      description: Modafinil is generally well tolerated, with predominantly mild,
        transient adverse effects
      scope: safety
  pipeline_stages:
  - name: literature_search
    script: 01_literature_search.py
    inputs: []
    outputs:
    - output/data/corpus.jsonl
    description: 'Query 10 engines: arXiv, Semantic Scholar, OpenAlex, Crossref, PubMed,
      SovietRxiv, ChinaRxiv, Europe PMC, bioRxiv, and medRxiv; merge and deduplicate'
  - name: meta_analysis
    script: 02_meta_analysis_pipeline.py
    inputs:
    - output/data/corpus.jsonl
    outputs:
    - output/data/subfield_classification.json
    - output/data/subfield_timeline.json
    - output/data/temporal_analysis.json
    - output/data/tfidf_data.json
    - output/data/topics.json
    - output/data/citation_network.json
    - output/data/citation_graph.gml
    description: Classify subfields, compute temporal metrics, TF-IDF, NMF, citation
      network
  - name: knowledge_graph
    script: 03_build_knowledge_graph.py
    inputs:
    - output/data/corpus.jsonl
    outputs:
    - output/data/nanopublications.jsonl
    - output/data/nanopublications.trig
    - output/data/hypothesis_scores.json
    - output/data/hypothesis_trends.json
    - output/data/assertion_summary.json
    description: Extract LLM-based assertions (optional), build KG, score hypotheses,
      export RDF/TriG nanopubs
  - name: figure_generation
    script: 04_generate_figures.py
    inputs:
    - output/data/temporal_analysis.json
    - output/data/topics.json
    - output/data/citation_network.json
    outputs:
    - output/figures/field_summary.png
    - output/figures/subfield_distribution.png
    - output/figures/growth_curve.png
    - output/figures/citation_network.png
    - output/figures/word_cloud.png
    - output/figures/pca_embeddings.png
    - output/figures/topic_term_bars.png
    description: Render publication-ready visualizations from analysis JSON outputs
  - name: export_bibliography
    script: 09_export_bibliography.py
    inputs:
    - output/data/corpus.jsonl
    outputs:
    - output/data/bibliography.bib
    description: Export the de-duplicated corpus to a single unified BibTeX file
  - name: fulltext_download
    script: 11_fulltext_download.py
    inputs:
    - output/data/corpus.jsonl
    outputs:
    - output/fulltext/
    - output/data/fulltext_extraction.json
    description: Download open-access full-text PDFs via Unpaywall, extract plaintext
      and figures (network-gated, opt-in)
  - name: reproducibility_assessment
    script: 10_reproducibility_assessment.py
    inputs:
    - output/data/corpus.jsonl
    - output/fulltext/
    outputs:
    - output/data/workflow_graphs.jsonl
    - output/data/reproducibility_scores.json
    - output/data/reproducibility_summary.json
    description: Decompose each paper's pipeline into a workflow graph and score reproducibility
      (LLM-gated, opt-in)
  - name: inject_variables
    script: 05_inject_variables.py
    inputs:
    - output/data/corpus.jsonl
    - output/data/temporal_analysis.json
    - output/data/subfield_classification.json
    outputs:
    - manuscript/00_abstract.md
    description: Compute dynamic variables from pipeline outputs and inject them into
      manuscript Markdown templates
  subfield_keywords:
    clinical_sleep:
    - narcolepsy
    - shift work
    - obstructive sleep apnea
    - excessive daytime sleepiness
    - wakefulness
    - hypersomnia
    - sleep disorder
    cognition:
    - cognitive enhancement
    - working memory
    - attention
    - executive function
    - vigilance
    - psychomotor
    - neuroenhancement
    pharmacology:
    - pharmacokinetics
    - dopamine transporter
    - mechanism of action
    - half-life
    - metabolism
    - cyp3a4
    - bioavailability
    psychiatry:
    - depression
    - adhd
    - schizophrenia
    - bipolar
    - fatigue
    - adjunctive
    safety:
    - adverse
    - abuse potential
    - dependence
    - tolerability
    - side effect
    - stevens-johnson
    neuroscience:
    - orexin
    - hypothalamus
    - neuroimaging
    - fmri
    - eeg
    - histamine
