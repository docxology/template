# Literature Meta-Analysis Project Configuration
# Inherits workspace settings from root pyproject.toml.
#
# This is a GENERIC, domain-agnostic literature meta-analysis template: point the
# `search.term` config key at any topic (the bundled default is "modafinil") and the
# pipeline produces merged, de-duplicated records across multiple literature engines,
# full-text assessment, descriptive statistics, language/entity analysis, embeddings,
# citation/temporal meta-analysis, and an auto-injected rendered manuscript.

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_literature_meta_analysis"
version = "0.2.0"
license = {text = "CC-BY-4.0"}
description = "Generic, idempotent literature meta-analysis template: multi-engine dispatch, de-duplication, full-text, embeddings, and bibliometrics for any search term"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"},
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "research-project-template==4.5.0",
    "pypdf>=6.16.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pillow>=12.3.0",
    "pandas>=2.0.0",
    "networkx>=3.0",
    "requests>=2.31.0",
    "rdflib>=7.0.0",
    "pyyaml>=6.0",
    'wordcloud>=1.9.0; python_version < "3.15"',
    "scikit-learn>=1.3.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest-timeout>=2.4.0",
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-httpserver>=1.0.8",
    "pygments>=2.20.0",
    "pypdf>=6.16.1",
    "reportlab>=4.0.0",
]
# Optional real-transformer embeddings upgrade (not required for the deterministic
# offline default, which uses hashing/TF-IDF -> SVD).
embeddings = [
    "sentence-transformers>=2.2.0",
    "torch>=2.13.0",
    "setuptools>=83.0.0",
]
# Optional LLM-backed knowledge-graph extraction (requires a running Ollama server).
llm = [
    "ollama>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
# >=90% on src/ is the enforced public-exemplar gate; the live coverage % is
# tracked in docs/_generated/COUNTS.md (do not hardcode it here — it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[project.urls]
Homepage = "https://github.com/docxology/template_literature_meta_analysis"
Documentation = "https://github.com/docxology/template_literature_meta_analysis/tree/main/docs"

[tool.uv]
# Inherits workspace settings from root pyproject.toml

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.5.0"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["retrieval", "fulltext", "extraction", "local-model", "kg"]

# Checkout resolver only; wheels declare the real platform dependency above.
[tool.uv.sources]
research-project-template = { path = "../../..", editable = true }

[tool.setuptools]
packages = [
    "template_literature_meta_analysis",
    "template_literature_meta_analysis.analysis",
    "template_literature_meta_analysis.deep_research",
    "template_literature_meta_analysis.knowledge_graph",
    "template_literature_meta_analysis.literature",
    "template_literature_meta_analysis.manuscript",
    "template_literature_meta_analysis.manuscript.variables",
    "template_literature_meta_analysis.manuscript.variables.extractors",
    "template_literature_meta_analysis.reproducibility",
    "template_literature_meta_analysis.visualization",
    "template_literature_meta_analysis.visualization.advanced",
]

[tool.setuptools.package-data]
"template_literature_meta_analysis.deep_research" = ["fixtures/recorded_report.json"]

[tool.setuptools.package-dir]
template_literature_meta_analysis = "src"
