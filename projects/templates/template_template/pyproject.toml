[project]
name = "template-template-meta-project"
version = "2.0.0"
license = {text = "Apache-2.0"}
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
description = "Self-referential study of the Docxology Template infrastructure, architecture, and provenance pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "research-project-template==4.1.0",
    "matplotlib>=3.10.0",
    "pillow>=12.3.0",
    "numpy>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src/template_template"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

[tool.uv.sources]
# Local preparation uses this checkout; standalone execution uses its admitted wheel.
research-project-template = { path = "../../..", editable = true }

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.1.0"
tested_python_versions = ["3.12", "3.13", "3.14"]
required_unpaid_capabilities = []
