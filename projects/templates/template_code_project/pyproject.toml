# Code Project Configuration
# Inherits workspace settings from root pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_code_project"
version = "3.0.0"
license = {text = "MIT"}
description = "Fully-tested codebase with numerical optimization and analysis"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pygments>=2.20.0",
]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: subprocess and full-pipeline integration checks kept for release profiles",
]

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate; live coverage % is tracked in
# docs/_generated/COUNTS.md (do not hardcode it here — it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "4.0.2"
tested_python_versions = ["3.12", "3.13", "3.14"]
required_unpaid_capabilities = ["local-review", "translation"]
