[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_data_descriptor"
version = "0.2.0"
license = {text = "CC-BY-4.0"}
description = "FAIR data descriptor and dataset release packet exemplar"
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "research-project-template==4.3.0",
    "matplotlib>=3.8.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]

# Compatibility contract for this independent exemplar release.
[tool.uv.sources]
# The exemplar consumes the platform SDK from the repository checkout; a standalone
# release substitutes its admitted wheel.
research-project-template = { path = "../../..", editable = true }

[tool.template]
platform_version = "4.3.0"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = []
