# EDA Notebook Configuration
# Inherits workspace settings from root pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template_eda_notebook"
version = "2.0.0"
license = {text = "MIT"}
description = "Fully-tested exploratory-data-analysis library with a computational-notebook walkthrough"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "research-project-template==5.0.2",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "ipykernel>=6.29.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    # 13.0.0 is the first Pillow release with no open advisory: 12.3.0 carries 130 critical and 598 high alerts in this repository. Do not lower this floor.
    "pillow>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest-timeout>=2.4.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"
markers = [
    "requires_ollama: requires a live Ollama server and model; excluded by default and explicitly opt in with -m requires_ollama. See docs/development/optional-dependencies.md",
    "requires_docker: requires an explicitly prepared Docker daemon; excluded by default",
    "network: requires explicitly enabled live network access; provider eligibility and credentials must be verified before execution",
    "slow: mark test as slow running",
    "bench: performance benchmark tests",
    "benchmark: opt-in benchmark tests, including pytest-benchmark settings",
    "performance: opt-in performance suite alias; excluded by default",
    "long_running: heavy end-to-end test families; excluded by quick and release profiles",
    "private_project: tests for private sidecar project tooling",
    "external_fixture: tests requiring downloaded external fixture trees",
]

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate; live coverage % is tracked in
# docs/_generated/COUNTS.md (do not hardcode it here — it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

[tool.uv.sources]
# Checkout development only; standalone acceptance installs the genuine platform wheel.
research-project-template = { path = "../../..", editable = true }

# Compatibility contract for this independent exemplar release.
[tool.template]
platform_version = "5.0.2"
tested_python_versions = ["3.14", "3.15"]
required_unpaid_capabilities = ["fresh-kernel"]
