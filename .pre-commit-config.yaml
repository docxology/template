# Pre-commit hooks — aligned with `.github/workflows/ci.yml` lint job:
#   ruff check + ruff format on the public CI source scope from
#   `infrastructure.project.public_scope`
#   mypy on the same paths (see `[tool.mypy]` in pyproject.toml)
#
# Stage policy (a commit must stay in the low single-digit seconds):
#
# Pre-commit (fast, mandatory): staged-index secret scan, hygiene hooks
# (whitespace/EOF/YAML/JSON/TOML validity, large files, conflict markers),
# Ruff check + format on the public CI scope, and the skill-reachability gate.
#
# Pre-push (fast, mandatory): tracked-artifact/secret/no-mocks guards + hook
# smoke pytest, manifest freshness (`infrastructure.skills check`,
# `operations-check`, `check-all-exports`), and the skill-reachability gate.
#
# Manual only (`pre-commit run --all-files --hook-stage manual`): the whole-tree
# type gate (`mypy-ci`), Bandit (`bandit-quick`, and the stricter `bandit-low`
# sweep), and the documentation contract guard. These are slow or already owned
# by a blocking CI job, so they no longer run on every commit or push:
#   * mypy -> `.github/actions/run-public-lint` (ci.yml `lint`, hardening `lint`)
#   * Bandit MEDIUM+ -> `.github/actions/run-safety-scan` (ci.yml `lint`,
#     hardening `security`)
#   * template drift, api-reference, exemplar roster, COUNTS, publication
#     records -> hardening `lint` / `validate` / `health`; `check_backlog.py`
#     and `check_claim_bindings.py` only lived here, so hardening `lint` now
#     runs them too.
# Full infra tests run in CI (`test-infra`); collecting all of `tests/infra_tests/`
# here is too slow for every push (~thousands of tests).
#
# PATH robustness: GUI git clients (GitHub Desktop, IDEs) launch hooks with a
# minimal login PATH that does NOT include `~/.local/bin` (uv's default install
# dir), so a bare `uv`/`uvx` would exit 127 "command not found". Every hook
# script below therefore prepends the common uv install locations to PATH
# before invoking uv/uvx so commits succeed from a terminal AND from GUI
# clients identically.

repos:
  # Standard hygiene hooks — fast (<1s each), catch entire classes of issues
  # before push that ruff/mypy don't cover (non-Python files, binary blobs,
  # merge-conflict markers, trailing whitespace, missing EOF newlines).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-added-large-files
        name: check-added-large-files (prevent binary blobs)
        args: ["--maxkb=512"]
        exclude: |
          (?x)^(
            docs/releases/template-v4\.0\.[01]-overview\.png$|
            projects/templates/.*\.png|
            projects/templates/.*\.svg|
            projects/templates/.*\.pdf|
            projects/templates/.*\.epub|
            projects/templates/[^/]+/output/web/assets/source-web-fonts\.js$|
            projects/templates/[^/]+/output/arxiv_submission_[0-9]{8}\.tar\.gz|
            output/templates/.*\.png|
            output/templates/.*\.svg|
            output/templates/.*\.pdf|
            output/templates/.*\.epub|
            projects/templates/template_literature_meta_analysis/output/fulltext/fulltext_inventory\.json
          )
      - id: check-merge-conflict
        name: check-merge-conflict (catch conflict markers)
      - id: trailing-whitespace
        name: trailing-whitespace (strip trailing whitespace)
        exclude: |
          (?x)^(
            output/.*|
            projects/templates/[^/]+/output/.*|
            projects/templates/.*\.svg
          )
      - id: end-of-file-fixer
        name: end-of-file-fixer (ensure trailing newline)
        exclude: |
          (?x)^(
            infrastructure/rendering/assets/fonts/lzma-d-min\.js$|
            output/.*|
            projects/templates/[^/]+/output/.*|
            projects/templates/.*\.svg|
            projects/templates/.*\.png
          )
      - id: check-yaml
        name: check-yaml (validate YAML syntax)
        args: ["--allow-multiple-documents"]
      - id: check-toml
        name: check-toml (validate TOML syntax)
      - id: check-json
        name: check-json (validate JSON syntax)
        exclude: |
          (?x)^(
            .*/\.vscode/.*|
            .*/\.claude/.*
          )

  - repo: local
    hooks:
      - id: staged-secret-scan
        name: staged-index secret scan (A/C/M/R)
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            export PYTHONDONTWRITEBYTECODE=1 &&
            uv run python scripts/audit/check_staged_secrets.py
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]
        always_run: true
        verbose: true

      - id: ruff-ci
        name: ruff check + format (CI scope)
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            CI_LINT_PATHS="$(uv run python -m infrastructure.project.public_scope lint-paths)" &&
            uv run ruff check $CI_LINT_PATHS --fix &&
            uv run ruff format $CI_LINT_PATHS
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]
        always_run: true
        verbose: true

      # Whole-tree type gate: slow (tens of seconds) and already blocking in CI
      # through `.github/actions/run-public-lint`. Manual stage only, so
      # `git commit` stays fast:
      #   pre-commit run --hook-stage manual mypy-ci
      - id: mypy-ci
        name: mypy (CI scope)
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            CI_SOURCE_PATHS="$(uv run python -m infrastructure.project.public_scope source-paths)" &&
            uv run python scripts/gates/mypy_ratchet.py $CI_SOURCE_PATHS
        language: system
        pass_filenames: false
        stages: [manual]
        always_run: true
        verbose: true

      # Run current-tree artifact and secret scans once in the mandatory
      # commands below; skip their duplicate smoke invocations. Hosted CI
      # still executes the full smoke suite, including those two tests.
      - id: pre-push-quick
        name: generated-artifact + mirror-shape guards + strict no-stand-ins policy + hook smoke pytest
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            export PYTHONDONTWRITEBYTECODE=1 &&
            unset $(git rev-parse --local-env-vars) &&
            uv run python scripts/audit/check_tracked_generated_artifacts.py &&
            uv run python scripts/audit/check_tracked_secrets.py &&
            uv run python scripts/audit/check_tracked_all.py &&
            uv run python scripts/audit/check_mirror_symlinks.py &&
            uv run python scripts/audit/verify_no_mocks.py &&
            uv run python scripts/audit/verify_no_mocks.py
            --inventory --max-dependency-replacements 0 &&
            uv run pytest tests/infra_tests/git_hook_smoke/
            --deselect=tests/infra_tests/git_hook_smoke/test_tracked_generated_artifacts.py::test_current_repo_has_no_tracked_generated_artifacts
            --deselect=tests/infra_tests/git_hook_smoke/test_tracked_generated_artifacts.py::test_current_repo_has_no_high_confidence_tracked_secrets
            -q --maxfail=1 --import-mode=importlib
        language: system
        pass_filenames: false
        stages: [pre-push, manual]
        always_run: true
        verbose: true

      # Docs/signpost contracts. They used to gate every push; the documentation
      # gates are expensive enough that they now run in CI and on demand:
      #   * check_template_drift --strict -> hardening `lint` and `docs-lint`
      #   * check_backlog.py / check_claim_bindings.py -> hardening `lint`
      #   * api_reference / exemplar_roster / counts / publication_records
      #     --check -> hardening `validate` and the blocking `health` report
      #   * the public-AGENTS personal-memory test runs in the infra test suite
      # Manual stage only:
      #   pre-commit run --hook-stage manual docs-contract-guard
      - id: docs-contract-guard
        name: docs signpost + public-AGENTS contract (dead links + no personal memory)
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            export PYTHONDONTWRITEBYTECODE=1 &&
            unset $(git rev-parse --local-env-vars) &&
            uv run python scripts/audit/check_template_drift.py --strict &&
            uv run python scripts/audit/check_backlog.py &&
            uv run python scripts/audit/check_claim_bindings.py &&
            uv run python scripts/docgen/api_reference.py --check &&
            uv run python scripts/docgen/exemplar_roster.py --check &&
            uv run python scripts/docgen/counts.py --check &&
            uv run python scripts/docgen/publication_records.py --check &&
            uv run pytest
            tests/infra_tests/test_docs_discovery_consistency.py::test_root_agents_is_public_repo_contract_not_personal_memory
            -q --import-mode=importlib
        language: system
        pass_filenames: false
        stages: [manual]
        always_run: true
        verbose: true

      # Mirrors the CI Bandit step, which now runs from the shared
      # `.github/actions/run-safety-scan` definition (ci.yml `lint`, hardening
      # `security`). Same scope and severity gate (`-ll` = MEDIUM+); exclusions
      # are configured in `bandit.yaml` (`exclude_dirs`).
      # Manual stage only: the full scan costs seconds to tens of seconds, so it
      # is opt-in locally and blocking in CI:
      #   pre-commit run --hook-stage manual bandit-quick
      - id: bandit-quick
        name: bandit MEDIUM+ (CI scope)
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            uv run bandit -c bandit.yaml -r -ll
            infrastructure/ scripts/ projects/
            -q
        language: system
        pass_filenames: false
        stages: [manual]
        always_run: true
        verbose: true

      # Catches drift in `.agents/skill_manifest.json` vs the on-disk skill
      # tree. Cheap (~0.2 s); runs before every push so a stale manifest never
      # rides into main.
      - id: skills-check
        name: infrastructure.skills check (manifest freshness)
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            uv run python -m infrastructure.skills check
        language: system
        pass_filenames: false
        stages: [pre-push, manual]
        always_run: true
        verbose: true

      # Verifies .agents/operations_manifest.json (the machine-readable catalog
      # of every `python -m infrastructure.X` CLI) matches live AST discovery —
      # the operations counterpart to skills-check. Regenerate with
      # `uv run python -m infrastructure.skills operations-write`.
      - id: operations-check
        name: infrastructure.skills operations-check (operation manifest freshness)
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            uv run python -m infrastructure.skills operations-check
        language: system
        pass_filenames: false
        stages: [pre-push, manual]
        always_run: true
        verbose: true

      # Audits every public Python module under `infrastructure/` for missing
      # `__all__` on re-exporting umbrella modules. Prevents regression of the
      # `[attr-defined]` mypy class of bug — see docs/rules/api_design.md.
      # Cheap (~0.2 s); runs before every push and on the lint hook stage.
      - id: all-exports-check
        name: infrastructure.skills check-all-exports
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            uv run python -m infrastructure.skills check-all-exports
        language: system
        pass_filenames: false
        stages: [pre-push, manual]
        always_run: true
        verbose: true

      # Skill-reachability gate (mirrors the CI docs-lint step). Asserts the
      # docs front door (`docs/AGENTS.md`) carries resolving links to all three
      # discovery entrypoints (`docs/_generated/skills_index.md`,
      # `docs/prompts/SKILL.md`, `docs/prompts/COMPOSITION.md`) and that every
      # discovered `SKILL.md` appears in the generated skills index. Cheap
      # (~0.3 s); runs on the lint hook stage so index drift is caught locally.
      - id: skill-reachability-check
        name: skill-reachability gate (front-door links + index completeness)
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            uv run python scripts/gates/skill_reachability_check.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push, manual]
        always_run: true
        verbose: true

      # Strict pass: LOW + MEDIUM + HIGH against `bandit.yaml`'s allow-list.
      # Manual-stage only (run with `pre-commit run --hook-stage manual
      # bandit-low`) — too noisy for every push, but kept here so the
      # invocation stays in lockstep with the documented policy.
      - id: bandit-low
        name: bandit LOW (allow-listed via bandit.yaml)
        entry: bash
        args:
          - -eo
          - pipefail
          - -c
          - >-
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" &&
            uv run bandit -c bandit.yaml -r --severity-level low
            infrastructure/ scripts/
            -q
        language: system
        pass_filenames: false
        stages: [manual]
        always_run: true
        verbose: true
